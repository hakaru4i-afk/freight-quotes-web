name: PR220 prepare reviewed chat candidate (branch only)
on:
  push:
    branches: [fix/p0-preserve-emergency-chats-20261126]
    paths: [.github/workflows/pr220-prepare-chat-candidate.yml]
permissions:
  contents: write
concurrency:
  group: pr220-prepare-candidate
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'hakaru4i-afk/freight-quotes-web' && github.actor == 'hakaru4i-afk' && github.ref == 'refs/heads/fix/p0-preserve-emergency-chats-20261126'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Regenerate reviewed staging assets and maps
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = fix/p0-preserve-emergency-chats-20261126
          node scripts/stamp-staging-rc.mjs --write
          node scripts/build-process-maps.mjs --record-reviewed-sources
          node scripts/stamp-staging-rc.mjs --check
          node scripts/build-process-maps.mjs --check
          git diff --check
          git diff --name-only | while IFS= read -r file; do
            case "$file" in
              test/app.js|test/index.html|test/build-info.json|test/site-status.json|test/business-process-model.json|test/process-map.html|test/business-process-current.drawio|test/business-process-current.svg|test/processes/*|test/process-history/*|test/process-editor-20261111.mjs|test/process-model-diff.mjs|test/global-view/*.mjs) ;;
              *) echo "Unexpected generated file: $file"; exit 1;;
            esac
          done
      - name: Verify VED and owner task browser regressions
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          node --test tests/emergency-chat-preservation-browser.test.mjs tests/ved-shared-chat-and-requests.test.mjs tests/chat-unread-contrast.test.mjs tests/owner-register-release-browser.test.mjs
      - name: Commit only reviewed staging output and refresh candidate source provenance
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/fix/p0-preserve-emergency-chats-20261126
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- test
          git diff --cached --check
          git commit -m 'build(staging): regenerate reviewed chat candidate assets and diagrams'
          test -z "$(git status --porcelain --untracked-files=no)"
          node scripts/release/refresh-pr157-staging-manifest.mjs --stdout > /tmp/pr220-manifest.json
          cp /tmp/pr220-manifest.json test/staging-manifest.json
          node --input-type=module -e 'import {readFileSync} from "node:fs";const m=JSON.parse(readFileSync("test/staging-manifest.json"));if(m.releaseStatus!=="RELEASE_BLOCKED"||m.runtimePairStatus!=="UNVERIFIED"||m.apiSourceCommit!==null||m.apiBundleSha256!==null)throw Error("UNSAFE_CANDIDATE_PROVENANCE");'
          git add -- test/staging-manifest.json
          git commit -m 'chore(staging): attest source assets without claiming new API evidence'
          git push origin HEAD:refs/heads/fix/p0-preserve-emergency-chats-20261126
