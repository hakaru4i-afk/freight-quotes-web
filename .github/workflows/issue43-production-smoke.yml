name: Issue43 production served smoke
on:
  push:
    branches: [main]
    paths:
      - app.js
      - index.html
      - build-info.json
      - site-status.json
      - production-release-manifest.json
      - tests/helpers/production-release-boundary.mjs
      - 'owner-ui-unification-*.css'
      - 'owner-ui-unification-*.js'
      - .github/workflows/issue43-production-smoke.yml
  pull_request:
    paths:
      - app.js
      - index.html
      - build-info.json
      - site-status.json
      - production-release-manifest.json
      - tests/helpers/production-release-boundary.mjs
      - 'owner-ui-unification-*.css'
      - 'owner-ui-unification-*.js'
      - .github/workflows/issue43-production-smoke.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pr-metadata-safety:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Validate PR metadata consistency (production smoke runs only on main push)
        run: |
          set -euo pipefail
          node <<'NODE_PR'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const info = JSON.parse(fs.readFileSync('build-info.json','utf8'));
          const status = JSON.parse(fs.readFileSync('site-status.json','utf8'));
          const manifest = JSON.parse(fs.readFileSync('production-release-manifest.json','utf8'));
          assert.equal(info.releaseVersion,status.release.version,'PR release metadata mismatch');
          assert.equal(info.version,status.version,'PR build metadata mismatch');
          assert.equal(info.environment,'production');
          assert.equal(info.projectRef,'ooclsrndeygojtofuyte');
          assert.equal(manifest.environment,'production');
          assert.match(manifest.assets?.['app.js']||'',/^[a-f0-9]{64}$/);
          console.log('PR_METADATA_CONSISTENCY_PASS; production smoke reserved for push/main');
          NODE_PR
          node --input-type=module <<'NODE_ATTEST'
          import {assertProductionReleaseIntegrity} from './tests/helpers/production-release-boundary.mjs';
          const m=assertProductionReleaseIntegrity();
          if (m.businessVersion!=='SH-01.30.59 v'||m.publicationState!=='CANDIDATE_PENDING_REQUIRED_CHECKS') throw Error('INVALID_SH59_DRAFT_ATTESTATION');
          console.log('SH59_PR_ASSET_INTEGRITY_PASS; PUBLISH_UNAPPROVED');
          NODE_ATTEST
  production-static-smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax and version coherence
        run: |
          set -euo pipefail
          node --check app.js
          node <<'NODE'
          const fs = require('node:fs');
          const x = JSON.parse(fs.readFileSync('build-info.json', 'utf8'));
          const status = JSON.parse(fs.readFileSync('site-status.json', 'utf8'));
          const page = fs.readFileSync('index.html','utf8');
          const app = fs.readFileSync('app.js','utf8');
          const protectedVersion = JSON.parse(fs.readFileSync('production-release-manifest.json','utf8')).businessVersion;
          if (x.environment !== 'production' || x.projectRef !== 'ooclsrndeygojtofuyte' || x.releaseVersion !== protectedVersion) throw Error('wrong production identity');
          if (x.version !== status.version || status.release.version !== protectedVersion) throw Error('release metadata mismatch');
          if (!page.includes('app.js?v=' + x.build)) throw Error('stale app cache key');
          if (!app.includes('sender_contact:S.target.value') || !app.includes('g.sender_contact||""')) throw Error('Owner field missing');
          if (!app.includes('Object.fromEntries(["sender_contact","origin","weight"')) throw Error('Owner hydrate missing');
          if (app.includes('freight-documents-qa-20261101a')) throw Error('QA storage in production');
          console.log('LOCAL_PRODUCTION_STATIC_PASS');
          NODE
          node --input-type=module <<'NODE_MANIFEST'
          import {assertProductionReleaseIntegrity} from './tests/helpers/production-release-boundary.mjs';
          assertProductionReleaseIntegrity();
          console.log('PRODUCTION_RELEASE_MANIFEST_PASS');
          NODE_MANIFEST
          node scripts/check-runtime-parity.mjs
      - name: Verify served GitHub Pages bytes
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          base="https://hakaru4i-afk.github.io/freight-quotes-web"
          matched=0
          for attempt in $(seq 1 12); do
            valid=1
            for file in app.js index.html build-info.json site-status.json production-release-manifest.json; do
              curl --fail --silent --show-error --location --max-time 25 \
                -H "Cache-Control: no-cache" "$base/$file?issue43=$GITHUB_SHA" -o "/tmp/issue43-$file" || { valid=0; break; }
              cmp -s "$file" "/tmp/issue43-$file" || { valid=0; break; }
            done
            if [ "$valid" -eq 1 ]; then matched=1; break; fi
            sleep 10
          done
          [ "$matched" -eq 1 ] || { echo "PRODUCTION_SERVE_MISMATCH"; exit 1; }
          echo "PRODUCTION_SERVED_BYTES_PASS"
      - name: Check production API unauthenticated health only
        env:
          REQUIRE_DEPLOYED_RELEASE: ${{ github.event_name != 'pull_request' }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 25 \
            "https://ooclsrndeygojtofuyte.supabase.co/functions/v1/freight-api/health" > /tmp/issue43-health.json
          node <<'NODE'
          const fs=require('node:fs');
          const h=JSON.parse(fs.readFileSync('/tmp/issue43-health.json','utf8'));
          if (!h || typeof h !== 'object') throw Error('no health payload');
          if(process.env.REQUIRE_DEPLOYED_RELEASE==='true'&&(h.environment!=='production'||h.projectRef!=='ooclsrndeygojtofuyte'||h.release!==JSON.parse(fs.readFileSync('build-info.json','utf8')).releaseVersion))throw Error('production API release pair mismatch');
          console.log('PRODUCTION_API_HEALTH_PASS');
          NODE
