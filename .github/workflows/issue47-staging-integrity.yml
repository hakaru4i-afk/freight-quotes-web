name: Issue47 staging integrity and served smoke
on:
  pull_request:
    paths:
      - "test/index.html"
      - "test/build-info.json"
      - "test/task2-guidance.js"
      - "tests/issue47-staging-integrity.test.mjs"
      - ".github/workflows/issue47-staging-integrity.yml"
  push:
    branches: [main]
    paths:
      - "test/index.html"
      - "test/build-info.json"
      - "test/task2-guidance.js"
      - "tests/issue47-staging-integrity.test.mjs"
permissions:
  contents: read
jobs:
  static-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check test/task2-guidance.js
      - run: node --test tests/issue47-staging-integrity.test.mjs
  served-pages:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify Pages serves exactly merged candidate build
        env:
          TEST_URL: https://hakaru4i-afk.github.io/freight-quotes-web/test/
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const m=JSON.parse(readFileSync('test/build-info.json','utf8'));
          const expected=readFileSync('test/index.html','utf8');
          for(let i=0;i<12;i++){
            try{
              const res=await fetch(process.env.TEST_URL+'index.html',{cache:'no-store'});
              assert.equal(res.status,200);
              const body=await res.text();
              assert.equal(body,expected,'GitHub Pages serves another build');
              const manifest=await fetch(process.env.TEST_URL+'build-info.json',{cache:'no-store'});
              assert.equal(manifest.status,200);
              assert.equal((await manifest.json()).build,m.build);
              const file=await fetch(process.env.TEST_URL+'task2-guidance.js',{cache:'no-store'});
              assert.equal(file.status,200);
              assert.equal(await file.text(),readFileSync('test/task2-guidance.js','utf8'));
              console.log('PASS public served staging matches git manifest and guidance source');
              process.exit(0);
            }catch(e){if(i===11)throw e;await new Promise(resolve=>setTimeout(resolve,5000));}
          }
          NODE
