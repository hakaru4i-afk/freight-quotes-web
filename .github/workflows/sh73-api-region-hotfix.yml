name: SH73 emergency API routing only
on:
  workflow_dispatch:
    inputs:
      confirmation:
        type: choice
        required: true
        options: ['SH73 ROUTING ONLY']
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: owner-portal-production-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'hakaru4i-afk/freight-quotes-web' && github.ref == 'refs/heads/main' && github.actor == 'hakaru4i-afk' && github.triggering_actor == 'hakaru4i-afk' && inputs.confirmation == 'SH73 ROUTING ONLY'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: github-pages
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: node --test tests/production-versioned-api-routing.test.mjs
      - uses: actions/download-artifact@v7
        with:
          name: github-pages
          run-id: 45818064696
          github-token: ${{ github.token }}
          path: archive
      - name: Preserve exact published release and prepare narrow hotfix
        run: |
          mkdir .hotfix-before .hotfix-pages
          tar --no-same-owner --no-same-permissions -xf archive/artifact.tar -C .hotfix-before
          cp -a .hotfix-before/. .hotfix-pages/
          node scripts/release/sh73-api-region-hotfix.mjs .hotfix-pages prepare
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          name: sh73-before-attempt-${{ github.run_attempt }}
          path: .hotfix-before
          retention-days: 7
      - uses: actions/upload-pages-artifact@v5
        id: upload
        with:
          name: sh73-pages-attempt-${{ github.run_attempt }}
          path: .hotfix-pages
      - name: Wait for exact Pages artifact to become visible
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
          ARTIFACT_NAME: sh73-pages-attempt-${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_ID" =~ ^[0-9]+$ ]]
          for attempt in $(seq 1 24); do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" |
               jq -e --arg id "$ARTIFACT_ID" --arg name "$ARTIFACT_NAME" '.artifacts | any((.id|tostring)==$id and .name==$name and .expired==false)' >/dev/null; then
              echo "Exact uploaded Pages artifact is visible."
              exit 0
            fi
            sleep 5
          done
          echo "::error::PAGES_ARTIFACT_NOT_VISIBLE"
          exit 1
      - uses: actions/deploy-pages@v5
        id: deploy
        with:
          artifact_name: sh73-pages-attempt-${{ github.run_attempt }}
      - name: Verify exact published hotfix and unchanged API identity
        id: verify
        run: node scripts/release/sh73-api-region-hotfix.mjs .hotfix-pages verify
      - name: Restore exact preceding Pages on failed readback
        if: failure() && steps.deploy.outcome == 'success' && steps.verify.outcome == 'failure'
        uses: actions/deploy-pages@v5
        with:
          artifact_name: sh73-before-attempt-${{ github.run_attempt }}
