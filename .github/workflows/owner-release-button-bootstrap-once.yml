name: Owner-approved one-time release-button bootstrap
# One Owner-approved UI-only publication. Never deploy backend, DB or unrelated main files.
# Owner-requested release preflight UI-only bootstrap; no API deployment, evidence bypass or business data changes.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/owner-release-button-bootstrap-once.yml'
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: owner-release-button-bootstrap-once
  cancel-in-progress: false
jobs:
  publish-reviewed-button:
    if: "github.actor == 'hakaru4i-afk' && github.ref == 'refs/heads/main' && (startsWith(github.event.head_commit.message, 'Merge pull request #168 ') || github.event.head_commit.message == 'fix(owner): activate verified one-time release button bootstrap' || github.event.head_commit.message == 'fix(owner): publish four-stage release button gate UI' || github.event.head_commit.message == 'fix(owner): publish verified release gate diagnostic UI' || github.event.head_commit.message == 'fix(owner): bootstrap safe release preflight button' || github.event.head_commit.message == 'fix(owner): publish passing preflight UI and locale tests')"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: github-pages
      url: https://hakaru4i-afk.github.io/freight-quotes-web/
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Confirm only Owner-reviewed release UI is promoted
        shell: bash
        run: |
          set -euo pipefail
          cmp portal-feedback-center-20261107.js test/portal-feedback-center-20261107.js
          cmp portal-feedback-center-20261107.js release/owner-portal-feedback-center-20261122.js
          node --check portal-feedback-center-20261107.js
          node --test tests/owner-portal-one-click-release.test.mjs tests/owner-ci-release-control.test.mjs tests/owner-register-publication.test.mjs
      - name: Retrieve the successful, original SH61 production Pages artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/approved-pages" .owner-button-pages
          gh run download 44963566890 -R hakaru4i-afk/freight-quotes-web --name sh61-final-pages --dir "$RUNNER_TEMP/approved-pages"
          test -s "$RUNNER_TEMP/approved-pages/artifact.tar"
          tar -xf "$RUNNER_TEMP/approved-pages/artifact.tar" -C .owner-button-pages
          test -s .owner-button-pages/production-release-manifest.json
          test -s .owner-button-pages/test/index.html
      - name: Verify byte-identical currently served production and modify only two JS assets
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 4 --max-time 30 "https://hakaru4i-afk.github.io/freight-quotes-web/build-info.json?bootstrap=$GITHUB_RUN_ID" -o "$RUNNER_TEMP/live-build.json"
          curl -fsSL --retry 4 --max-time 30 "https://hakaru4i-afk.github.io/freight-quotes-web/release-status.json?bootstrap=$GITHUB_RUN_ID" -o "$RUNNER_TEMP/live-release.json"
          cmp "$RUNNER_TEMP/live-build.json" .owner-button-pages/build-info.json
          cmp "$RUNNER_TEMP/live-release.json" .owner-button-pages/release-status.json
          node --input-type=module <<'JS'
          import {readFileSync,writeFileSync} from 'node:fs';
          import {resolve,dirname} from 'node:path';
          import {createHash} from 'node:crypto';
          const base=resolve('.owner-button-pages');
          const sha=b=>createHash('sha256').update(b).digest('hex');
          const path='production-release-manifest.json';
          const m=JSON.parse(readFileSync(base+'/'+path));
          if(m.environment!=='production'||m.businessVersion!=='SH-01.30.61 v'||!m.assets||Object.keys(m.assets).length<150)
            throw Error('APPROVED_PRODUCTION_ARTIFACT_NOT_FOUND');
          for(const [name,expected] of Object.entries(m.assets)){
            if(!/^(?!\/)(?!.*\.\.)(?!.*\\)[a-zA-Z0-9_./-]+$/.test(name))throw Error('UNSAFE_PRODUCTION_PATH:'+name);
            const file=readFileSync(resolve(base,name));
            if(sha(file)!==expected)throw Error('PRODUCTION_ARTIFACT_HASH_MISMATCH:'+name);
          }
          const approved=readFileSync('portal-feedback-center-20261107.js');
          if(!approved.toString().includes("action:'release_update'")||!approved.toString().includes('?releaseProgress='))
            throw Error('OWNER_RELEASE_ACTION_MISSING');
          for(const name of ['portal-feedback-center-20261107.js','test/portal-feedback-center-20261107.js']){
            readFileSync(resolve(base,name)); // Must already be part of the previously approved Pages artifact.
            writeFileSync(resolve(base,name),approved);
            m.assets[name]=sha(approved);
          }
          m.ownerReleaseButtonBootstrap={sourceCommit:process.env.GITHUB_SHA,kind:'owner-approved-UI-only',apiDeployment:false};
          writeFileSync(base+'/'+path,JSON.stringify(m,null,2)+'\n');
          console.log('BOOTSTRAP_REVIEWED_UI_ONLY_SHA256',sha(approved));
          JS
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          name: owner-release-button-reviewed-once
          path: .owner-button-pages
      - name: Allow the Pages artifact to become available
        run: sleep 25
      - name: Publish only the approved Owner release control
        uses: actions/deploy-pages@v4
        with:
          artifact_name: owner-release-button-reviewed-once
      - name: Confirm the new release button is actually served
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if curl -fsSL --max-time 20 "https://hakaru4i-afk.github.io/freight-quotes-web/portal-feedback-center-20261107.js?bootstrap=$GITHUB_RUN_ID-$i" -o "$RUNNER_TEMP/served-owner.js" && cmp -s "$RUNNER_TEMP/served-owner.js" portal-feedback-center-20261107.js; then
              echo OWNER_ONE_CLICK_BUTTON_PUBLISHED_VERIFIED
              exit 0
            fi
            sleep 6
          done
          echo "::error::OWNER_BUTTON_NOT_SERVED"
          exit 1
