name: Release stabilization candidate
on:
  pull_request:
    paths:
      - 'test/**'
      - 'tests/**'
      - '.github/workflows/release-stabilization.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Verify metadata, independent forms, tracking and fail-closed release decision
        run: >-
          node --test tests/issue47-late-ui.test.mjs
          tests/issue47-owner-optional-reason.test.mjs
          tests/issue28-workflow-separation.test.mjs
          tests/issue17-formal-document-ui.test.mjs
          tests/task2-execution-robots.test.mjs
          tests/task12-release-gate.test.mjs
      - name: Execute all 37 mapped robot groups
        run: node tests/task12-robot-runner.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-stabilization-robot-evidence
          path: reports/
          retention-days: 14
