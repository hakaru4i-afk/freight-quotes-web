name: Release stabilization candidate
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  lock:
    if: github.repository == 'hakaru4i-afk/freight-quotes-web' && github.ref == 'refs/heads/main' && github.actor == 'hakaru4i-afk' && github.triggering_actor == 'hakaru4i-afk'
    runs-on: ubuntu-24.04
    outputs:
      frontend: ${{ steps.lock.outputs.frontend }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          package-manager-cache: false
          node-version: '24'
      - id: lock
        run: |
          frontend=$(node --input-type=module -e 'import {readLock} from "./scripts/release/locked-release.mjs"; console.log(readLock().frontendSha)')
          git merge-base --is-ancestor "$frontend" "$GITHUB_SHA"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"

  regression:
    needs: lock
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: candidate
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          path: candidate
          ref: ${{ needs.lock.outputs.frontend }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          package-manager-cache: false
          node-version: '24'
      - name: Verify current asset digests, cache keys and update banner build ID
        run: node scripts/stamp-staging-rc.mjs --check
      - name: Reject stale process diagrams
        run: node scripts/build-process-maps.mjs --check
      - name: Cache npm and Playwright Chromium
        id: browser-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.npm
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-node24-playwright-1.56.1-v2
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Verify metadata, independent forms, tracking and fail-closed release decision
        run: >-
          node --test tests/issue47-late-ui.test.mjs
          tests/issue47-owner-optional-reason.test.mjs
          tests/issue28-workflow-separation.test.mjs
          tests/issue17-formal-document-ui.test.mjs
          tests/task2-execution-robots.test.mjs
          tests/task12-release-gate.test.mjs
          tests/lw-pending-tasks-all-roles.test.mjs
          tests/staging-asset-contract.test.mjs
      - name: Execute all 37 mapped robot groups
        env:
          LOCKED_FRONTEND_SHA: ${{ needs.lock.outputs.frontend }}
        run: |
          test "$(git rev-parse HEAD)" = "$LOCKED_FRONTEND_SHA"
          node ../scripts/release/locked-browser-fixtures.mjs apply . "$LOCKED_FRONTEND_SHA" ..
          rm -rf reports
          GITHUB_SHA="$LOCKED_FRONTEND_SHA" node tests/task12-robot-runner.mjs
      - name: Bind the fresh robot report to the candidate and dispatch attempt
        working-directory: .
        run: |
          node scripts/release/locked-evidence-run.mjs frontend candidate \
            candidate/reports/task12-robot-matrix.json candidate/reports/run-receipt.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: locked-frontend-regression-attempt-${{ github.run_attempt }}
          path: |
            candidate/reports/task12-robot-matrix.json
            candidate/reports/run-receipt.json
          if-no-files-found: error
          retention-days: 2

  complete-regression:
    needs: lock
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: candidate
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          path: candidate
          ref: ${{ needs.lock.outputs.frontend }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          package-manager-cache: false
          node-version: '24'
      - name: Verify the separately served production root against its own manifest
        working-directory: .
        run: |
          node --input-type=module <<'NODE'
          import {digest} from './scripts/release/locked-release.mjs';
          import {captureRoot} from './scripts/release/locked-staging.mjs';
          import {assertPublishedProductionRoot} from './tests/helpers/production-release-boundary.mjs';
          const files = await captureRoot();
          const manifest = assertPublishedProductionRoot(files);
          console.log('VERIFIED_PRODUCTION_ROOT', manifest.businessVersion,
            digest(files.get('production-release-manifest.json')), files.size - 1);
          NODE
      - name: Cache npm and Playwright Chromium
        id: browser-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.npm
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-node24-playwright-1.56.1-v2
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Run every frontend test file, including live browser and security regressions
        env:
          LOCKED_FRONTEND_SHA: ${{ needs.lock.outputs.frontend }}
          QA_SERVED_EXPECTED_DIR: .
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$LOCKED_FRONTEND_SHA"
          test "$(git -C .. rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --quiet HEAD --
          test -f release-lock.json
          test ! -L release-lock.json
          # Candidate tests read this file from their working directory. Use the
          # authoritative dispatch lock as temporary test configuration.
          trap 'git restore --source=HEAD --worktree -- release-lock.json' EXIT
          node ../scripts/release/locked-browser-fixtures.mjs apply . "$LOCKED_FRONTEND_SHA" ..
          git -C .. show "$GITHUB_SHA:release-lock.json" > release-lock.json
          rm -rf reports
          mkdir -p reports
          node --test --test-concurrency=3 --test-reporter=spec --test-reporter=junit --test-reporter-destination=stdout --test-reporter-destination=reports/full-regression.xml tests/*.test.mjs
          git restore --source=HEAD --worktree -- release-lock.json
          node ../scripts/release/locked-browser-fixtures.mjs verify . "$LOCKED_FRONTEND_SHA" ..
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: complete-frontend-regression
          path: candidate/reports/full-regression.xml
          retention-days: 14
