name: Release stabilization candidate
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/release-stabilization.yml'
      - 'release-lock.json'
      - 'package.json'
      - 'package-lock.json'
      - 'index.html'
      - 'test/index.html'
      - 'owner-registers-20261111.js'
      - 'test/owner-registers-20261111.js'
      - 'global-view/**'
      - 'test/global-view/**'
      - 'tests/**'
      - 'scripts/release/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  lock:
    if: github.repository == 'hakaru4i-afk/freight-quotes-web' && github.actor == 'hakaru4i-afk' && github.triggering_actor == 'hakaru4i-afk' && ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == 'hakaru4i-afk'))
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.lock.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - id: lock
        run: |
          frontend=$(node --input-type=module -e 'import {readLock} from "./scripts/release/locked-release.mjs"; console.log(readLock().frontendSha)')
          git merge-base --is-ancestor "$frontend" "$GITHUB_SHA"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"

  regression:
    needs: lock
    runs-on: [self-hosted, macOS, ARM64, freight-mac-qa]
    timeout-minutes: 15
    defaults:
      run:
        working-directory: candidate
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: candidate
          ref: ${{ needs.lock.outputs.frontend }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Cache npm and Playwright Chromium
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-node26-playwright-1.65.1-axe4.14.1-v1
      - name: Resolve exact frontend QA dependency lock and clean install
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Preserve generated frontend lockfile for source commit
        uses: actions/upload-artifact@v4
        with:
          name: frontend-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 7
      - run: npx playwright install chromium
      - name: Verify metadata, independent forms, tracking and fail-closed release decision
        run: >-
          node --test tests/issue47-late-ui.test.mjs
          tests/issue47-owner-optional-reason.test.mjs
          tests/issue28-workflow-separation.test.mjs
          tests/issue17-formal-document-ui.test.mjs
          tests/task2-execution-robots.test.mjs
          tests/task12-release-gate.test.mjs
          tests/lw-pending-tasks-all-roles.test.mjs
          tests/staging-asset-contract.test.mjs
      - name: Verify current asset digests, cache keys and update banner build ID
        run: node scripts/stamp-staging-rc.mjs --check
      - name: Reject stale process diagrams
        run: node scripts/build-process-maps.mjs --check
      - name: Execute all 37 mapped robot groups
        env:
          LOCKED_FRONTEND_SHA: ${{ needs.lock.outputs.frontend }}
        run: |
          test "$(git rev-parse HEAD)" = "$LOCKED_FRONTEND_SHA"
          rm -rf reports
          node tests/task12-robot-runner.mjs
      - name: Bind the fresh robot report to the candidate and dispatch attempt
        working-directory: .
        run: |
          node scripts/release/locked-evidence-run.mjs frontend candidate \
            candidate/reports/task12-robot-matrix.json candidate/reports/run-receipt.json
      - uses: actions/upload-artifact@v4
        with:
          name: locked-frontend-regression-attempt-${{ github.run_attempt }}
          path: |
            candidate/reports/task12-robot-matrix.json
            candidate/reports/run-receipt.json
          if-no-files-found: error
          retention-days: 2

  complete-regression:
    needs: lock
    runs-on: [self-hosted, macOS, ARM64, freight-mac-qa]
    timeout-minutes: 20
    defaults:
      run:
        working-directory: candidate
    steps:
      - uses: actions/checkout@v4
        with:
          path: candidate
          ref: ${{ needs.lock.outputs.frontend }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Cache npm and Playwright Chromium
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-node24-playwright-1.56.1-v2
      - name: Install locked browser and accessibility test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install chromium
      - name: Run every frontend test file, including live browser and security regressions
        env:
          LOCKED_FRONTEND_SHA: ${{ needs.lock.outputs.frontend }}
          QA_SERVED_EXPECTED_DIR: .
        run: |
          test "$(git rev-parse HEAD)" = "$LOCKED_FRONTEND_SHA"
          rm -rf reports
          mkdir -p reports
          node --test --test-concurrency=3 --test-reporter=spec --test-reporter=junit --test-reporter-destination=stdout --test-reporter-destination=reports/full-regression.xml tests/*.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: complete-frontend-regression
          path: candidate/reports/full-regression.xml
          retention-days: 14
