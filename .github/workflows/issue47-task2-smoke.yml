name: Issue47 Task2 staging full-stack smoke
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'test/app.js'
      - 'tests/issue47-bid-edit-route.test.mjs'
      - 'tests/issue47-carrier-round-status.test.mjs'
      - 'tests/issue47-carrier-workspace-deadlines.test.mjs'
      - 'tests/task2-document-request-flow.test.mjs'
      - 'tests/lw-pending-tasks-all-roles.test.mjs'
      - 'tests/ved-shared-chat-and-requests.test.mjs'
      - 'test/lw-ved-shared-chat-20261109.js'
      - 'test/lw-ved-shared-chat-20261109.css'
      - 'test/lw-pending-tasks-all-roles-20261109.js'
      - 'test/lw-pending-tasks-all-roles-20261109.css'
      - 'test/task2-panel.js'
      - 'test/task2-panel-*.js'
      - 'test/task2-guidance.js'
      - 'test/task2-guidance-*.js'
      - 'test/task2.css'
      - 'test/index.html'
      - 'test/build-info.json'
      - 'test/site-status.json'
      - '.github/workflows/issue47-task2-smoke.yml'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax and source contracts
        run: |
          node --check test/app.js
          node --check test/task2-panel.js
          node --check test/task2-panel-sidebar-only-20261107.js
          node --test tests/task2-document-request-flow.test.mjs
          node --check test/lw-pending-tasks-all-roles-20261109.js
          node --test tests/lw-pending-tasks-all-roles.test.mjs
          node --check test/lw-ved-shared-chat-20261109.js
          node --test tests/ved-shared-chat-and-requests.test.mjs
          node --check test/task2-guidance.js
          node --test tests/issue47-menu-clarity.test.mjs tests/issue49-staging-check.test.mjs tests/issue47-agreed-roles-and-owner-registers.test.mjs tests/issue47-bid-edit-route.test.mjs tests/issue47-carrier-round-status.test.mjs tests/issue47-carrier-workspace-deadlines.test.mjs
      - name: Verify staging API, anonymous access restriction, and served files
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          const manifest=JSON.parse(readFileSync('test/build-info.json','utf8'));
          const expected=manifest.task2.frontendSha,asset=manifest.task2.frontendScript,guideAsset=manifest.task2.guidanceScript;
          const url='https://ibclzdkxiozbzmniiygv.supabase.co/functions/v1/freight-api';
          const web='https://hakaru4i-afk.github.io/freight-quotes-web/test/';
          const r=await fetch(url+'/health');
          assert.equal(r.status,200,'health status '+r.status);
          const h=await r.json();
          assert.equal(h.environment,'staging');
          assert.equal(h.projectRef,'ibclzdkxiozbzmniiygv');
          const blocked=await fetch(url+'/api/task2');
          assert.equal(blocked.status,403,'anonymous access must be forbidden');
          console.log('PASS: staging backend health and anonymous task2 forbidden');
          let verified=false;
          for(let i=0;i<10;i++){
            const [html,js,css,guidance]=await Promise.all([
              fetch(web+'index.html?smoke='+i).then(r=>r.text()),
              fetch(web+asset+'?smoke='+i),
              fetch(web+'task2.css?smoke='+i),
              fetch(web+guideAsset+'?smoke='+i)
            ]);
            if(html.includes(asset)&&html.includes(guideAsset)&&js.ok&&css.ok&&guidance.ok){
              const body=await js.text();
              const b=Buffer.from(body,'utf8');
              const sha=createHash('sha1').update(Buffer.concat([Buffer.from('blob '+b.length),Buffer.from([0]),b])).digest('hex');
              if(body.includes('Issue #47 integrated staging UI')&&body.includes('data-t2-form')&&sha===expected&&html.includes(asset+'?v='+expected.slice(0,12))&&(await guidance.text()).includes('Task #2: field-level instructions')){
                console.log('PASS: staging static task2 JS/CSS served');
                verified=true;break;
              }
            }
            await new Promise(r=>setTimeout(r,6000));
          }
          assert.ok(verified,'GitHub Pages did not serve the task2 version');
          const production=await fetch('https://hakaru4i-afk.github.io/freight-quotes-web/index.html').then(r=>r.text());
          assert.ok(!production.includes('task2-panel.js'),'production interface changed');
          console.log('PASS: production UI not modified');
          NODE
