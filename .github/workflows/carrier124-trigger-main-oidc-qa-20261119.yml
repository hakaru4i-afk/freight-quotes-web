name: Carrier124 trigger main-only authorized OIDC E2E (single isolated run)
on:
  push:
    branches: ['fix/carrier-dashboard-124']
    paths: ['.github/workflows/carrier124-trigger-main-oidc-qa-20261119.yml']
permissions:
  contents: read
  actions: write
jobs:
  dispatch:
    if: github.repository == 'hakaru4i-afk/freight-quotes-web' && github.ref == 'refs/heads/fix/carrier-dashboard-124'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Start already-approved main branch OIDC isolated QA workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          body='{"ref":"main"}'
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}'             --request POST             -H "Authorization: Bearer $GH_TOKEN"             -H 'Accept: application/vnd.github+json'             -H 'X-GitHub-Api-Version: 2022-11-28'             -H 'Content-Type: application/json'             --data "$body"             https://api.github.com/repos/hakaru4i-afk/freight-quotes-web/actions/workflows/carrier124-main-oidc-smoke.yml/dispatches)
          if [ "$status" != 204 ]; then echo "OIDC_QA_DISPATCH_BLOCKED_HTTP_$status";exit 1;fi
          echo 'CARRIER124_MAIN_ONLY_OIDC_V5_WORKFLOW_DISPATCHED; NOT_A_RELEASE'
# Carrier124 v5 real-auth run with required synthetic document upload + browser 11 roles; QA only, no prod changes.
