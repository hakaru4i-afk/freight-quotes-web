name: Controlled owner-only publication (version independent)
on:
  pull_request:
    paths:
      - '.github/workflows/controlled-sh59-publish.yml'
      - '.github/workflows/task12-observer.yml'
      - '.github/workflows/reconcile-staging-provenance.yml'
      - '.github/workflows/sync-release-metadata.yml'
      - 'scripts/release/**'
      - 'tests/production-gate-negative.test.mjs'
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Exact reviewed business version, e.g. SH-01.30.73 v'
        type: string
        required: true
      frontend_sha:
        description: Reviewed exact frontend SHA
        type: string
        required: true
      backend_sha:
        description: Reviewed exact backend SHA
        type: string
        required: true
      frontend_run_id:
        description: Successful complete frontend regression
        type: string
        required: true
      backend_run_id:
        description: Successful backend security and schema regression
        type: string
        required: true
      e2e_run_id:
        description: Successful authenticated 37 of 37 E2E
        type: string
        required: true
      recovery_run_id:
        description: Successful real backup and independent restore
        type: string
        required: true
      owner_comment_id:
        description: Exact SHA approval comment by Owner
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: owner-portal-production-release
  cancel-in-progress: false
jobs:
  negative-test:
    if: >-
      (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == 'hakaru4i-afk')) &&
      github.event_name == 'pull_request'
    runs-on: [self-hosted, macOS, ARM64, freight-mac-qa]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check no CI workflow pushes to main
        run: |
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          for(const path of ['.github/workflows/task12-observer.yml','.github/workflows/reconcile-staging-provenance.yml','.github/workflows/sync-release-metadata.yml']){
            if(/git push origin HEAD:main|git push origin main/.test(readFileSync(path,'utf8')))
              throw Error('AUTOPUBLISH_MAIN_REMAINS:'+path);
          }
          JS
      - name: Check source syntax
        run: |
          node --check scripts/release/production-gate.mjs
          node --check scripts/release/assemble-production-evidence.mjs
          node --check scripts/release/build-pages-package.mjs
          node --check scripts/release/check-release-version.mjs
      - name: Test rejection of incompatible source, missing roles, missing restore and no Owner approval
        run: node --test tests/production-gate-negative.test.mjs
      - name: Confirm served production bytes unchanged by negative validation
        shell: bash
        run: |
          set -euo pipefail
          url=https://hakaru4i-afk.github.io/freight-quotes-web/build-info.json
          curl --retry 3 --fail --silent --show-error --location --max-time 25 "$url?before=$GITHUB_RUN_ID" -o /tmp/before.json
          node --test tests/production-gate-negative.test.mjs >/tmp/rejection-test.log
          curl --retry 3 --fail --silent --show-error --location --max-time 25 "$url?after=$GITHUB_RUN_ID" -o /tmp/after.json
          cmp -s /tmp/before.json /tmp/after.json || { echo "::error::Production changed during rejection test"; exit 1; }
          echo 'BLOCKING_TEST_PASS; SERVED_PRODUCTION_UNCHANGED; NO_DEPLOYMENT'
  verify-evidence:
    if: >-
      (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == 'hakaru4i-afk')) &&
      github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, macOS, ARM64, freight-mac-qa]
    timeout-minutes: 15
    outputs:
      accepted: ${{ steps.approval.outputs.accepted }}
    permissions:
      contents: read
      actions: read
    steps:
      - name: Reject non-Owner or non-main and invalid SHA
        shell: bash
        env:
          WEB_SHA: ${{ inputs.frontend_sha }}
          API_SHA: ${{ inputs.backend_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = hakaru4i-afk/freight-quotes-web
          test "$GITHUB_ACTOR" = hakaru4i-afk
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          [[ "$WEB_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$API_SHA" =~ ^[a-f0-9]{40}$ ]]
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.frontend_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Retrieve immutable GitHub runs and required evidence
        shell: bash
        env:
          WEB_TOKEN: ${{ github.token }}
          BACKEND_TOKEN: ${{ secrets.BACKEND_RELEASE_READ_TOKEN }}
          FRONTEND_RUN_ID: ${{ inputs.frontend_run_id }}
          BACKEND_RUN_ID: ${{ inputs.backend_run_id }}
          E2E_RUN_ID: ${{ inputs.e2e_run_id }}
          RECOVERY_RUN_ID: ${{ inputs.recovery_run_id }}
          OWNER_COMMENT_ID: ${{ inputs.owner_comment_id }}
        run: |
          set -euo pipefail
          test -n "$BACKEND_TOKEN" || { echo "::error::Backend token unavailable; release blocked"; exit 1; }
          for id in "$FRONTEND_RUN_ID" "$BACKEND_RUN_ID" "$E2E_RUN_ID" "$RECOVERY_RUN_ID" "$OWNER_COMMENT_ID"; do
            [[ "$id" =~ ^[1-9][0-9]*$ ]] || exit 1
          done
          mkdir -p gate-evidence/{meta,frontend,backend,e2e,recovery}
          GH_TOKEN="$WEB_TOKEN" gh api "repos/hakaru4i-afk/freight-quotes-web/actions/runs/$FRONTEND_RUN_ID" > gate-evidence/meta/frontend.json
          GH_TOKEN="$WEB_TOKEN" gh api "repos/hakaru4i-afk/freight-quotes-web/actions/runs/$E2E_RUN_ID" > gate-evidence/meta/e2e.json
          GH_TOKEN="$BACKEND_TOKEN" gh api "repos/hakaru4i-afk/freight-quotes/actions/runs/$BACKEND_RUN_ID" > gate-evidence/meta/backend.json
          GH_TOKEN="$BACKEND_TOKEN" gh api "repos/hakaru4i-afk/freight-quotes/actions/runs/$RECOVERY_RUN_ID" > gate-evidence/meta/recovery.json
          GH_TOKEN="$WEB_TOKEN" gh api "repos/hakaru4i-afk/freight-quotes-web/issues/comments/$OWNER_COMMENT_ID" > gate-evidence/meta/owner.json
          GH_TOKEN="$WEB_TOKEN" gh run download "$FRONTEND_RUN_ID" -R hakaru4i-afk/freight-quotes-web --name complete-frontend-regression --dir gate-evidence/frontend
          GH_TOKEN="$WEB_TOKEN" gh run download "$E2E_RUN_ID" -R hakaru4i-afk/freight-quotes-web --name carrier124-oidc-sh59-redacted-evidence --dir gate-evidence/e2e
          GH_TOKEN="$BACKEND_TOKEN" gh run download "$BACKEND_RUN_ID" -R hakaru4i-afk/freight-quotes --name release-migration-and-support-evidence --dir gate-evidence/backend
          GH_TOKEN="$BACKEND_TOKEN" gh run download "$RECOVERY_RUN_ID" -R hakaru4i-afk/freight-quotes --name sh59-production-recovery-receipt --dir gate-evidence/recovery
          for entry in 'frontend release-gate-regression.json' 'backend release-gate-backend.json' 'e2e release-gate-pair.json' 'e2e private-authenticated-e2e.json' 'recovery private-production-backup-evidence.json' 'recovery private-restore-evidence.json'; do
            set -- $entry
            dir="$1"; name="$2"
            if [ ! -f "gate-evidence/$dir/$name" ]; then
              matches="$(find "gate-evidence/$dir" -type f -name "$name" -print)"
              test "$(printf '%s\n' "$matches" | sed '/^$/d' | wc -l | tr -d ' ')" = 1 || { echo "::error::Missing trusted proof $name"; exit 1; }
              cp "$matches" "gate-evidence/$dir/$name"
            fi
          done
      - name: Verify GitHub provenance, actual 37 E2E, backup, restore and Owner consent
        id: approval
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          RELEASE_WEB_SHA: ${{ inputs.frontend_sha }}
          RELEASE_API_SHA: ${{ inputs.backend_sha }}
          FRONTEND_RUN_ID: ${{ inputs.frontend_run_id }}
          BACKEND_RUN_ID: ${{ inputs.backend_run_id }}
          E2E_RUN_ID: ${{ inputs.e2e_run_id }}
          RECOVERY_RUN_ID: ${{ inputs.recovery_run_id }}
          OWNER_COMMENT_ID: ${{ inputs.owner_comment_id }}
        run: |
          set -euo pipefail
          node scripts/release/check-release-version.mjs
          node scripts/release/assemble-production-evidence.mjs
          echo 'accepted=true' >> "$GITHUB_OUTPUT"
          echo 'OWNER_AND_EXACT_RELEASE_PAIR_VERIFIED; STILL_NOT_DEPLOYED'
  publish:
    if: >-
      (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == 'hakaru4i-afk')) &&
      github.event_name == 'workflow_dispatch' && needs.verify-evidence.result == 'success' && needs.verify-evidence.outputs.accepted == 'true'
    needs: [verify-evidence]
    runs-on: [self-hosted, macOS, ARM64, freight-mac-qa]
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.frontend_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check exact reviewed source again after Owner approval
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          RELEASE_WEB_SHA: ${{ inputs.frontend_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_WEB_SHA"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$RELEASE_WEB_SHA"
      - name: Package reviewed production and /test assets
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          node scripts/release/check-release-version.mjs
          node scripts/release/build-pages-package.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .release-pages
      - uses: actions/deploy-pages@v4
        id: deployment
