name: Task2 legacy CSV integrity staging
on:
  pull_request:
    paths:
      - 'test/task2-guidance.js'
      - 'tests/issue47-legacy-csv-integrity.test.mjs'
      - '.github/workflows/issue47-legacy-csv-integrity.yml'
  push:
    branches: [main]
    paths:
      - 'test/task2-guidance.js'
      - 'tests/issue47-legacy-csv-integrity.test.mjs'
      - '.github/workflows/issue47-legacy-csv-integrity.yml'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  csv-regression:
    if: >-
      (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == 'hakaru4i-afk'))
    runs-on: [self-hosted, macOS, ARM64, freight-mac-qa]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          package-manager-cache: false
          node-version: '24'
      - run: node --check test/task2-guidance.js
      - run: node --test tests/issue47-legacy-csv-integrity.test.mjs tests/issue47-task2-csv.test.mjs
