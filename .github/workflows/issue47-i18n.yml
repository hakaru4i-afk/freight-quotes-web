name: Issue47 Task2 RU EN ZH language staging
on:
  pull_request:
    paths:
      - 'test/task2-i18n.js'
      - 'test/index.html'
      - 'tests/issue47-task2-i18n.test.mjs'
      - '.github/workflows/issue47-i18n.yml'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'test/task2-i18n.js'
      - 'test/index.html'
      - 'tests/issue47-task2-i18n.test.mjs'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  language:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check test/task2-i18n.js
      - name: RU/EN/ZH language functionality (blocking)
        run: >-
          node --test
          --test-name-pattern='^(translation catalog covers major screens|switching language preserves original labels)'
          tests/issue47-task2-i18n.test.mjs
      - name: Immutable production release integrity (advisory for PR/push; blocking on manual run)
        continue-on-error: ${{ github.event_name != 'workflow_dispatch' }}
        run: >-
          node --test
          --test-name-pattern='^translation loader stays pinned and production promotion requires its integrity manifest

          tests/issue47-task2-i18n.test.mjs
