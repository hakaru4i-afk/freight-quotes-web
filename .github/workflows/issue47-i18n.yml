name: Issue47 Task2 RU EN ZH language staging
on:
  pull_request:
    paths:
      - 'test/task2-i18n.js'
      - 'test/index.html'
      - 'tests/issue47-task2-i18n.test.mjs'
      - '.github/workflows/issue47-i18n.yml'
  push:
    branches: [main]
    paths:
      - 'test/task2-i18n.js'
      - 'test/index.html'
      - 'tests/issue47-task2-i18n.test.mjs'
permissions:
  contents: read
jobs:
  language:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check test/task2-i18n.js
      - run: node --test tests/issue47-task2-i18n.test.mjs
