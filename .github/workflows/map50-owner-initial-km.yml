name: MAP50 Owner initial km and third-station regression
on:
  push:
    branches: [main]
    paths:
      - 'global-view/**'
      - 'test/global-view/**'
      - 'tests/map50-owner-km-before-bid.test.mjs'
      - '.github/workflows/map50-owner-initial-km.yml'
  pull_request:
    paths:
      - 'global-view/**'
      - 'test/global-view/**'
      - 'tests/map50-owner-km-before-bid.test.mjs'
      - '.github/workflows/map50-owner-initial-km.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  node-regression:
    if: >-
      (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == 'hakaru4i-afk'))
    runs-on: [self-hosted, macOS, ARM64, freight-mac-qa]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          package-manager-cache: false
          node-version: '24'
      - name: Owner 2 points, carrier third station, rail safety
        run: node --test tests/map50-owner-km-before-bid.test.mjs
      - name: Frontend and staging use matching map logic
        run: |
          cmp global-view/view.mjs test/global-view/view.mjs
          cmp global-view/distance.mjs test/global-view/distance.mjs
          cmp global-view/route-model.mjs test/global-view/route-model.mjs
