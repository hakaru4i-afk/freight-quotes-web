name: Locked QA staging only
on:
  pull_request:
    paths:
      - '.github/workflows/locked-qa-staging.yml'
      - 'scripts/release/locked-staging.mjs'
      - 'tests/locked-staging.test.mjs'
      - 'test/staging-transport-20261111.js'
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Staging only; no production release authorization'
        type: choice
        options: ['STAGING ONLY']
        required: true
permissions:
  contents: read
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('locked-staging-pr-{0}', github.event.pull_request.number) || 'owner-portal-production-release' }}
  cancel-in-progress: false
jobs:
  source-tests:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == 'hakaru4i-afk'
    runs-on: [self-hosted, macOS, ARM64, freight-mac-qa]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          set -euo pipefail
          git sparse-checkout disable
          git restore --source=HEAD --worktree -- .
          node --test tests/locked-staging.test.mjs
      - name: Read-only complete live production inventory preflight (no credentials or deployment)
        run: node --input-type=module -e 'import {captureRoot} from "./scripts/release/locked-staging.mjs"; console.log("LIVE_ROOT_INVENTORY_PASS",(await captureRoot()).size)'
  prepare:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'hakaru4i-afk/freight-quotes-web' && github.ref == 'refs/heads/main' && github.actor == 'hakaru4i-afk' && github.triggering_actor == 'hakaru4i-afk' && inputs.confirmation == 'STAGING ONLY'
    environment: isolated-qa
    runs-on: [self-hosted, macOS, ARM64, freight-mac-qa]
    timeout-minutes: 30
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - id: lock
        name: Verify immutable candidate ancestry and resolve exact pair
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/locked-staging.test.mjs
          frontend=$(node --input-type=module -e 'import {readLock} from "./scripts/release/locked-release.mjs"; console.log(readLock().frontendSha)')
          backend=$(node --input-type=module -e 'import {readLock} from "./scripts/release/locked-release.mjs"; console.log(readLock().backendSha)')
          git merge-base --is-ancestor "$frontend" "$GITHUB_SHA"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "backend=$backend" >> "$GITHUB_OUTPUT"
      - name: Verify main-only QA environment and existing credential
        env:
          GH_TOKEN: ${{ github.token }}
          BACKEND_QA_READ_TOKEN: ${{ secrets.BACKEND_QA_READ_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          node tests/task12-ci-environment-policy.mjs
          node scripts/release/check-qa-credentials.mjs e2e
          test "$(gh api repos/hakaru4i-afk/freight-quotes-web/pages --jq '.build_type')" = workflow
      - uses: actions/checkout@v4
        with:
          path: candidate-web
          ref: ${{ steps.lock.outputs.frontend }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: hakaru4i-afk/freight-quotes
          path: candidate-backend
          ref: ${{ steps.lock.outputs.backend }}
          token: ${{ secrets.BACKEND_QA_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
      - name: Assemble exact QA bundle and preserve every inventoried live production asset
        shell: bash
        run: |
          set -euo pipefail
          for dir in candidate-web candidate-backend; do
            git -C "$dir" sparse-checkout disable
            git -C "$dir" restore --source=HEAD --worktree -- .
          done
          work=$(mktemp -d "$RUNNER_TEMP/locked-staging.XXXXXX")
          echo "LOCKED_STAGE_DIR=$work" >> "$GITHUB_ENV"
          node scripts/release/locked-qa-runtime.mjs build candidate-backend "$work/api"
          node scripts/release/locked-staging.mjs package candidate-web "$work/pages" "$work/root-proof.json"
          node scripts/release/locked-staging.mjs verify-root "$work/root-proof.json"
      - name: Deploy and independently read back only the existing isolated QA function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          node scripts/release/locked-staging.mjs deploy-api "$LOCKED_STAGE_DIR/api"
          node scripts/release/locked-staging.mjs verify-root "$LOCKED_STAGE_DIR/root-proof.json"
      - uses: actions/upload-artifact@v4
        with:
          name: locked-staging-root-proof
          path: ${{ env.LOCKED_STAGE_DIR }}/root-proof.json
          if-no-files-found: error
          retention-days: 2
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ env.LOCKED_STAGE_DIR }}/pages
      - name: Remove private backend package
        if: always() && env.LOCKED_STAGE_DIR != ''
        run: |
          set -euo pipefail
          case "$LOCKED_STAGE_DIR" in "$RUNNER_TEMP"/locked-staging.*) rm -rf "$LOCKED_STAGE_DIR";; *) exit 1;; esac
  deploy:
    needs: prepare
    if: needs.prepare.result == 'success'
    runs-on: [self-hosted, macOS, ARM64, freight-mac-qa]
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: locked-staging-root-proof
          path: verified-stage
      - name: Confirm unchanged production root immediately before Pages deployment
        run: node scripts/release/locked-staging.mjs verify-root verified-stage/root-proof.json
      - uses: actions/deploy-pages@v4
        id: pages
      - name: Verify the production root still matches its published inventory
        run: node scripts/release/locked-staging.mjs verify-root verified-stage/root-proof.json
  verify:
    needs: deploy
    if: needs.deploy.result == 'success'
    environment: isolated-qa
    runs-on: [self-hosted, macOS, ARM64, freight-mac-qa]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - id: lock
        run: |
          set -euo pipefail
          node --input-type=module <<'JS' >> "$GITHUB_OUTPUT"
          import {readLock} from './scripts/release/locked-release.mjs';
          const lock=readLock();
          console.log('frontend='+lock.frontendSha);
          console.log('backend='+lock.backendSha);
          JS
      - name: Verify existing QA credential and protected environment
        env:
          GH_TOKEN: ${{ github.token }}
          BACKEND_QA_READ_TOKEN: ${{ secrets.BACKEND_QA_READ_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          node tests/task12-ci-environment-policy.mjs
          node scripts/release/check-qa-credentials.mjs e2e
      - uses: actions/checkout@v4
        with:
          path: candidate-web
          ref: ${{ steps.lock.outputs.frontend }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: hakaru4i-afk/freight-quotes
          path: candidate-backend
          ref: ${{ steps.lock.outputs.backend }}
          token: ${{ secrets.BACKEND_QA_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
      - name: Independently rebuild and attest served staging assets and QA API
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          for dir in candidate-web candidate-backend; do
            git -C "$dir" sparse-checkout disable
            git -C "$dir" restore --source=HEAD --worktree -- .
          done
          work=$(mktemp -d "$RUNNER_TEMP/locked-stage-verify.XXXXXX")
          trap 'rm -rf "$work"' EXIT
          node scripts/release/locked-qa-runtime.mjs build candidate-backend "$work/api"
          node scripts/release/locked-qa-runtime.mjs attest candidate-web "$work/api" "$work/proof.json"
          cp "$work/proof.json" locked-staging-attestation.json
          echo STAGING_PAIR_ATTESTED_NOT_PRODUCTION_APPROVAL
      - uses: actions/upload-artifact@v4
        with:
          name: locked-staging-attestation
          path: locked-staging-attestation.json
          if-no-files-found: error
          retention-days: 2
