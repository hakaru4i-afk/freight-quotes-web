name: Owner acceptance journal regression
on:
  push:
    branches: [main]
    paths:
      - 'owner-registers-20261111.js'
      - 'test/owner-registers-20261111.js'
      - 'index.html'
      - 'test/index.html'
      - 'tests/owner-acceptance-regression.test.mjs'
      - '.github/workflows/owner-acceptance-regression.yml'
  pull_request:
    paths:
      - 'owner-registers-20261111.js'
      - 'test/owner-registers-20261111.js'
      - 'index.html'
      - 'test/index.html'
      - 'tests/owner-acceptance-regression.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  acceptance-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax and exact prod/test file parity
        run: |
          node --check owner-registers-20261111.js
          node --check test/owner-registers-20261111.js
          cmp owner-registers-20261111.js test/owner-registers-20261111.js
      - name: Acceptance workflow regression
        run: node --test tests/owner-acceptance-regression.test.mjs
