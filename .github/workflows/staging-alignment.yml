name: Canonical staging alignment
on:
  pull_request:
    paths: ['test/**','scripts/**','tests/**','docs/**','.github/workflows/**']
  workflow_dispatch:
  workflow_run:
    workflows: ["Reconcile staging provenance without promoting production"]
    types: [completed]
    branches: [main]
permissions:
  contents: read
jobs:
  coherence:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify the indexed source candidate without declaring runtime acceptance
        run: node scripts/check-staging-alignment.mjs --source-only
      - run: node scripts/stamp-staging-rc.mjs --check
      - run: node scripts/build-process-maps.mjs --check
      - run: node scripts/check-runtime-parity.mjs --modules global-view/view.mjs global-view/distance.mjs global-view/route-model.mjs global-view/globe.mjs global-view/map.mjs
      - name: Require verified runtime provenance separately; a candidate remains blocked
        run: node scripts/check-staging-alignment.mjs
      - run: node scripts/check-runtime-parity.mjs --allow-staging-candidate
