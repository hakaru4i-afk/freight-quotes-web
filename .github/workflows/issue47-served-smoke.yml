name: Verify served staging Issue47 and production isolation
on:
  push:
    branches: [main]
    paths:
      - 'test/app.js'
      - 'test/build-info.json'
      - 'test/index.html'
      - '.github/workflows/issue47-served-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  served-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify live GitHub Pages staging and independent production
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          const base='https://hakaru4i-afk.github.io/freight-quotes-web/';
          const expected=JSON.parse(readFileSync('test/build-info.json','utf8'));
          const production=JSON.parse(readFileSync('build-info.json','utf8'));
          async function get(path) {
            const r=await fetch(base+path, {headers: {'cache-control':'no-cache'}});
            assert.equal(r.status,200,path+' returned '+r.status);
            return new Uint8Array(await r.arrayBuffer());
          }
          const decode=(bytes)=>new TextDecoder().decode(bytes);
          let verified=false;
          for(let attempt=0; attempt<9; attempt++){
            try {
              const [stgBytes,stgHtmlBytes,stgJsBytes,prodBytes]=await Promise.all([
                get('test/build-info.json?proof='+attempt),
                get('test/index.html?proof='+attempt),
                get('test/app.js?proof='+attempt),
                get('build-info.json?proof='+attempt)
              ]);
              const stg=JSON.parse(decode(stgBytes));
              const prod=JSON.parse(decode(prodBytes));
              assert.equal(stg.build, expected.build);
              assert.equal(stg.projectRef, 'ibclzdkxiozbzmniiygv');
              assert.equal(stg.task2Complete, false);
              assert.equal(prod.build, production.build);
              assert.equal(prod.projectRef,'ooclsrndeygojtofuyte');
              assert.ok(decode(stgHtmlBytes).includes('./app.js?v='+expected.servedAppBlobSha.slice(0,12)));
              const prefix=new TextEncoder().encode('blob '+stgJsBytes.length+'\\0');
              const bytes=new Uint8Array(prefix.length+stgJsBytes.length);
              bytes.set(prefix);bytes.set(stgJsBytes,prefix.length);
              const blobSha=createHash('sha1').update(bytes).digest('hex');
              assert.equal(blobSha,expected.servedAppBlobSha,'served test/app.js does not match version manifest');
              console.log('PASS: served staging build '+stg.build+' and app blob '+blobSha.slice(0,12));
              console.log('PASS: production remains at '+prod.build);
              verified=true;
              break;
            }catch(e){
              if(attempt===8)throw e;
              console.log('Staging not propagated yet (attempt '+(attempt+1)+'); recheck');
              await new Promise(r=>setTimeout(r,6000));
            }
          }
          assert.ok(verified);
          NODE
