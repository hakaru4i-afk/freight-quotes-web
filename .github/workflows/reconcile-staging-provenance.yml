name: Staging provenance audit (read-only, no production updates)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: [self-hosted, macOS, ARM64, freight-mac-qa]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          package-manager-cache: false
          node-version: '24'
      - name: Check existing provenance without writing to main
        run: |
          node scripts/check-staging-alignment.mjs --source-only
          node scripts/stamp-staging-rc.mjs --check
          node scripts/build-process-maps.mjs --check
      - name: Declare candidate audit never approves a release
        run: echo "SOURCE_AUDIT_ONLY; production publication requires gated manual workflow"
