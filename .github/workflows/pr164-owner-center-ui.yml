name: PR164 Owner Center compact status controls
on:
  push:
    branches: [fix/im000007-handoff-ui-20261122]
  pull_request:
    branches: [main]
    paths:
      - 'portal-feedback-center-20261107.js'
      - 'test/portal-feedback-center-20261107.js'
      - 'owner-register-task-actions-20261121.js'
      - 'test/owner-register-task-actions-20261121.js'
      - 'tests/owner-center-advanced-actions-20261122.test.mjs'
      - '.github/workflows/pr164-owner-center-ui.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pr164-center-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate exact source and browser syntax
        run: |
          set -euo pipefail
          cmp portal-feedback-center-20261107.js test/portal-feedback-center-20261107.js
          cmp owner-register-task-actions-20261121.js test/owner-register-task-actions-20261121.js
          node --check portal-feedback-center-20261107.js
          node --check test/portal-feedback-center-20261107.js
          node --check owner-register-task-actions-20261121.js
          node --test tests/owner-register-action-lock-regression.test.mjs
          node --test tests/owner-center-advanced-actions-20261122.test.mjs
          node --test tests/owner-ci-release-control.test.mjs
