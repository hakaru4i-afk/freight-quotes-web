name: Owner Codex execution (separate Owner action)
run-name: Codex task ${{ inputs.dispatch_key }}
on:
  workflow_dispatch:
    inputs:
      dispatch_key:
        required: true
        type: string
      register:
        required: true
        type: string
      record_id:
        required: true
        type: string
      source_key:
        required: true
        type: string
      feedback_id:
        required: true
        type: string
      deadline:
        required: true
        type: string
      base_sha:
        required: true
        type: string
      task_title:
        required: true
        type: string
      task_description:
        required: true
        type: string
permissions:
  contents: write
  issues: write
  pull-requests: write
concurrency:
  group: owner-codex-${{ inputs.dispatch_key }}
  cancel-in-progress: false
jobs:
  codex:
    runs-on: [self-hosted, macOS, ARM64, freight-mac-qa]
    timeout-minutes: 110
    env:
      TASK_UUID: ${{ inputs.dispatch_key }}
      TASK_REGISTER: ${{ inputs.register }}
      TASK_RECORD_ID: ${{ inputs.record_id }}
      TASK_SOURCE: ${{ inputs.source_key }}
      TASK_FEEDBACK_ID: ${{ inputs.feedback_id }}
      TASK_DEADLINE: ${{ inputs.deadline }}
      TASK_BASE_SHA: ${{ inputs.base_sha }}
      TASK_TITLE: ${{ inputs.task_title }}
      TASK_DESCRIPTION: ${{ inputs.task_description }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Find Codex and GitHub CLI for runner user
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          if ! command -v gh >/dev/null 2>&1 && [ ! -x "$HOME/.local/bin/gh" ]; then
            version=2.105.0
            archive="$RUNNER_TEMP/gh.zip"
            curl --fail --location --retry 3 --max-time 90 -sS \
              "https://github.com/cli/cli/releases/download/v${version}/gh_${version}_macOS_arm64.zip" -o "$archive"
            unzip -q "$archive" -d "$RUNNER_TEMP"
            bin="$(find "$RUNNER_TEMP" -type f -path '*/bin/gh' -print -quit)"
            test -n "$bin"
            install -m 0755 "$bin" "$HOME/.local/bin/gh"
          fi
      - name: Verify Owner-issued branch, issue and Codex login
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TASK_UUID" =~ ^[a-f0-9]{8}-[a-f0-9-]{27}$ ]]
          [[ "$TASK_FEEDBACK_ID" =~ ^[a-f0-9]{8}-[a-f0-9-]{27}$ ]]
          [[ "$TASK_BASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$TASK_REGISTER" =~ ^(developments|remarks|updates)$ ]]
          [[ "$TASK_RECORD_ID" =~ ^[A-Za-z0-9_.:-]{1,120}$ ]]
          test -n "$TASK_TITLE" && test -n "$TASK_DESCRIPTION"
          test "${#TASK_DESCRIPTION}" -le 3000
          command -v gh
          gh auth status
          command -v codex
          codex --version
          codex login status
          gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/owner-task/$TASK_UUID" >/dev/null
          ISSUE="$(gh issue list --state all --search "$TASK_UUID in:title" --json number,title --jq '.[0].number // empty')"
          if [ -z "$ISSUE" ]; then
            echo "::error::GITHUB_HANDOFF_REQUIRED: no authorized branch/Issue for this task"
            exit 1
          fi
          echo "TASK_ISSUE=$ISSUE" >> "$GITHUB_ENV"
          echo "TASK_BRANCH=owner-task/$TASK_UUID" >> "$GITHUB_ENV"
          echo 'CODEX_AUTH_AND_GITHUB_HANDOFF_VERIFIED'
      - name: Run Codex (non-interactive)
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "refs/heads/$TASK_BRANCH:refs/remotes/origin/$TASK_BRANCH"
          git switch --create "$TASK_BRANCH" --track "origin/$TASK_BRANCH"
          {
            printf '%s\n' 'Implement the approved Owner task. Change actual source and only relevant fast tests. Keep RU/EN/ZH help synchronized and verify business-process notes when applicable.'
            printf '%s\n' 'Do not deploy, publish, or modify production or databases. No paid services or subscription changes.'
            printf 'Task: %s\n' "$TASK_TITLE"
            printf 'Record: %s | Deadline: %s\n' "$TASK_RECORD_ID" "$TASK_DEADLINE"
            printf 'Owner brief:\n%s\n' "$TASK_DESCRIPTION"
            printf '\nFinish after code and fast tests. GitHub will create a draft PR.\n'
          } > "$RUNNER_TEMP/owner-codex-prompt.txt"
          echo "CODEX_STARTED: issue=$TASK_ISSUE, prompt_bytes=$(wc -c < "$RUNNER_TEMP/owner-codex-prompt.txt")"
          set +e
          env -u GH_TOKEN -u GITHUB_TOKEN codex exec --ephemeral --sandbox workspace-write - \
            < "$RUNNER_TEMP/owner-codex-prompt.txt" > "$RUNNER_TEMP/owner-codex-output.log" 2>&1
          result=$?
          set -e
          if [ "$result" -ne 0 ]; then
            reason=CODEX_EXEC_FAILED
            if grep -Eqi '403 Forbidden|Unable to load site|workspace routing discovery failed' "$RUNNER_TEMP/owner-codex-output.log"; then
              reason=CODEX_NETWORK_BLOCKED_403
            elif grep -Eqi '429 Too Many Requests|rate limit' "$RUNNER_TEMP/owner-codex-output.log"; then
              reason=CODEX_RATE_LIMITED
            elif grep -Eqi 'not logged in|authentication required|unauthorized' "$RUNNER_TEMP/owner-codex-output.log"; then
              reason=CODEX_AUTH_EXPIRED
            elif grep -Eqi 'sandbox.*denied|permission denied' "$RUNNER_TEMP/owner-codex-output.log"; then
              reason=CODEX_SANDBOX_DENIED
            fi
            echo "$reason" > "$RUNNER_TEMP/owner-codex-failure.code"
            echo "::error::$reason: Codex exited with $result on Mac runner; workflow run $GITHUB_RUN_ID"
            echo "Codex failed: $reason (exit $result). See run $GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo CODEX_NO_CODE_CHANGES > "$RUNNER_TEMP/owner-codex-failure.code"
            echo "::error::CODEX_NO_CODE_CHANGES: model returned but produced no source changes"
            exit 1
          fi
          echo "CODEX_CODE_CHANGED"
      - name: Commit code and open draft PR
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --quiet && { echo CODEX_NO_CODE_CHANGES > "$RUNNER_TEMP/owner-codex-failure.code"; exit 1; }
          git -c user.name="freight-owner-codex" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "feat(owner-task): implement $TASK_RECORD_ID"
          gh auth setup-git
          git push origin "HEAD:refs/heads/$TASK_BRANCH"
          EXISTING="$(gh pr list --state all --head "$TASK_BRANCH" --json number --jq '.[0].number // empty')"
          if [ -z "$EXISTING" ]; then
            gh pr create --draft --base main --head "$TASK_BRANCH" \
              --title "Owner task $TASK_RECORD_ID — $TASK_TITLE" \
              --body "Codex implementation for Owner-approved Issue #$TASK_ISSUE. Inspect PR and checks before merging. No production publish."
          else
            echo "DRAFT_PR_ALREADY_EXISTS=$EXISTING"
          fi
          echo "CODEX_PR_READY: branch=$TASK_BRANCH" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish concise Codex failure to GitHub Issue for CRM UI
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          reason="$(cat "$RUNNER_TEMP/owner-codex-failure.code" 2>/dev/null || echo CODEX_WORKFLOW_FAILED)"
          echo "::error::$reason"
          if [ -n "${TASK_ISSUE:-}" ]; then
            gh issue comment "$TASK_ISSUE" --body "CODEX_FAILURE_CODE: $reason
          CODEX_RUN_ID: $GITHUB_RUN_ID
          Explanation: Codex did not finish writing code. See GitHub Actions run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. No completion is claimed." || true
          fi
