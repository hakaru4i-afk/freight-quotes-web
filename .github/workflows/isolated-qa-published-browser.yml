name: Isolated QA published role browser
on:
  workflow_dispatch:
concurrency:
  group: task12-staging-observer
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  real-qa:
    if: github.ref == 'refs/heads/main'
    environment: isolated-qa
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      QA_SESSIONS_FILE: /tmp/freight-ci-qa/sessions.json
      QA_BROWSER_PUBLISHED: 'true'
      QA_SCENARIO_STATE_DIR: /tmp/freight-ci-qa
      AXE_CORE_PATH: node_modules/axe-core/axe.min.js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify real QA sessions and role identities
        env:
          QA_OWNER_LOGIN: ${{ secrets.QA_OWNER_LOGIN }}
          QA_OWNER_PASSWORD: ${{ secrets.QA_OWNER_PASSWORD }}
          QA_CARRIER_A_LOGIN: ${{ secrets.QA_CARRIER_A_LOGIN }}
          QA_CARRIER_A_PASSWORD: ${{ secrets.QA_CARRIER_A_PASSWORD }}
          QA_CARRIER_B_LOGIN: ${{ secrets.QA_CARRIER_B_LOGIN }}
          QA_CARRIER_B_PASSWORD: ${{ secrets.QA_CARRIER_B_PASSWORD }}
          QA_VED_LOGIN: ${{ secrets.QA_VED_LOGIN }}
          QA_VED_PASSWORD: ${{ secrets.QA_VED_PASSWORD }}
          QA_LOGISTIC_LOGIN: ${{ secrets.QA_LOGISTIC_LOGIN }}
          QA_LOGISTIC_PASSWORD: ${{ secrets.QA_LOGISTIC_PASSWORD }}
          QA_SUPPLIER_LOGIN: ${{ secrets.QA_SUPPLIER_LOGIN }}
          QA_SUPPLIER_PASSWORD: ${{ secrets.QA_SUPPLIER_PASSWORD }}
          QA_DESIGNER_LOGIN: ${{ secrets.QA_DESIGNER_LOGIN }}
          QA_DESIGNER_PASSWORD: ${{ secrets.QA_DESIGNER_PASSWORD }}
          QA_CONTENT_LOGIN: ${{ secrets.QA_CONTENT_LOGIN }}
          QA_CONTENT_PASSWORD: ${{ secrets.QA_CONTENT_PASSWORD }}
          QA_PURCHASING_LOGIN: ${{ secrets.QA_PURCHASING_LOGIN }}
          QA_PURCHASING_PASSWORD: ${{ secrets.QA_PURCHASING_PASSWORD }}
          QA_CERTIFICATION_LOGIN: ${{ secrets.QA_CERTIFICATION_LOGIN }}
          QA_CERTIFICATION_PASSWORD: ${{ secrets.QA_CERTIFICATION_PASSWORD }}
        run: node tests/task12-ci-auth.mjs
      - run: npm install --no-save --ignore-scripts playwright@1.56.1 axe-core@4.10.2
      - run: npx playwright install --with-deps chromium
      - name: Read all role cabinets from actual published assets
        run: node tests/task12-isolated-browser.e2e.mjs
      - name: Owner creates an isolated request through published UI
        env:
          QA_BROWSER_ACTORS: owner
          QA_BROWSER_CREATE: 'true'
        run: node tests/task12-isolated-browser.e2e.mjs
      - name: Carrier A imports CSV and submits a real isolated bid
        env:
          QA_BROWSER_ACTORS: carrierA
          QA_BROWSER_BID: 'true'
          QA_BROWSER_IMPORT: csv
        run: node tests/task12-isolated-browser.e2e.mjs
      - name: Carrier submits a real isolated bid through published UI
        env:
          QA_BROWSER_ACTORS: carrierB
          QA_BROWSER_BID: 'true'
          QA_BROWSER_IMPORT: xlsx
        run: node tests/task12-isolated-browser.e2e.mjs
      - name: Owner compares both offers and chooses one winner
        id: selection
        env:
          QA_BROWSER_ACTORS: owner
          QA_BROWSER_SELECT: 'true'
        run: |
          node tests/task12-isolated-browser.e2e.mjs
          node --input-type=module <<'JS'
          import {readFileSync,appendFileSync} from 'node:fs';
          const winner=JSON.parse(readFileSync('reports/isolated-rc/browser-results-owner.json','utf8')).roles[0].selection.winnerActor;
          if(!['carrierA','carrierB'].includes(winner))throw Error('INVALID_WINNER_ACTOR');
          appendFileSync(process.env.GITHUB_OUTPUT,'winner_actor='+winner+'\n');
          JS
      - name: Winning carrier accepts; loser and premature VED access are denied
        env:
          QA_BROWSER_ACTORS: ${{ steps.selection.outputs.winner_actor }}
          QA_BROWSER_ACCEPT: 'true'
        run: node tests/task12-isolated-browser.e2e.mjs
      - name: Winning carrier tracks dates, four changes and containers without duplicate history
        env:
          QA_BROWSER_ACTORS: ${{ steps.selection.outputs.winner_actor }}
          QA_BROWSER_TRACK: 'true'
        run: node tests/task12-isolated-browser.e2e.mjs
      - name: VED assigns documents and sends a real shared message with attachment
        env:
          QA_BROWSER_ACTORS: ved
          QA_BROWSER_VED_WORK: 'true'
        run: node tests/task12-isolated-browser.e2e.mjs
      - name: Addressed Logistic uploads documents and confirms the handoff
        env:
          QA_BROWSER_ACTORS: logistic
          QA_BROWSER_LOGISTIC_DOCUMENT: 'true'
        run: node tests/task12-isolated-browser.e2e.mjs
      - name: Verify VED draft persistence, reload and no repeated submissions
        env:
          QA_BROWSER_ACTORS: ved
          QA_BROWSER_VED_VERIFY: 'true'
        run: node tests/task12-isolated-browser.e2e.mjs
      - name: Verify private registers, proposals and draft editor as Owner
        env:
          QA_BROWSER_ACTORS: owner
          QA_BROWSER_ALIGNMENT: 'true'
        run: node tests/task12-isolated-browser.e2e.mjs
      - name: Verify all other roles cannot read private engineering archives
        env:
          QA_BROWSER_ACTORS: carrierA,carrierB,ved,logistic,supplier,designer,content,purchasing,certification
          QA_BROWSER_ALIGNMENT: 'true'
        run: node tests/task12-isolated-browser.e2e.mjs
      - name: Verify ten cabinets in RU EN ZH on desktop and mobile
        env:
          QA_BROWSER_MATRIX: 'true'
        run: node tests/task12-isolated-browser.e2e.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-qa-redacted-evidence
          path: |
            reports/ci-qa-auth.json
            reports/isolated-rc/browser-results-*.json
          retention-days: 7
      - name: Revoke sessions and remove private runner files
        if: always()
        run: node tests/task12-ci-auth.mjs --logout
