name: "Issue 28 | Staging document and execution separation"
on:
  push:
    branches: [main]
    paths:
      - 'test/index.html'
      - 'test/app.js'
      - 'test/task2-panel-sidebar-only-20261107.js'
      - 'test/issue28-document-navigation-20261107.js'
      - 'test/task2-process-split-20261107.css'
      - 'test/build-info.json'
      - 'tests/issue28-workflow-separation.test.mjs'
      - 'tests/issue28-document-only.test.mjs'
      - 'tests/issue28-served-staging.test.mjs'
      - '.github/workflows/issue28-separated-processes.yml'
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  workflow-separation:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check staging app and execution syntax
        run: |
          node --check test/app.js
          node --check test/task2-panel-sidebar-only-20261107.js
      - name: Verify process boundaries and cache-safe assets
        run: node --test tests/issue28-workflow-separation.test.mjs tests/issue28-document-only.test.mjs
      - name: Verify deployed GitHub Pages serves latest staging build
        run: node --test tests/issue28-served-staging.test.mjs
