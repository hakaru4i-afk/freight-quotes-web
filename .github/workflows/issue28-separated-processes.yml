name: "Issue 28 | Staging document and execution separation"
on:
  push:
    branches: [main]
    paths:
      - 'test/index.html'
      - 'test/task2-panel-processes-20261107-3ccb1c05.js'
      - 'test/task2-process-split-20261107.css'
      - 'test/build-info.json'
      - 'tests/issue28-workflow-separation.test.mjs'
      - '.github/workflows/issue28-separated-processes.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  workflow-separation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check staging execution script syntax
        run: node --check test/task2-panel-processes-20261107-3ccb1c05.js
      - name: Verify process boundaries and cache-safe assets
        run: node --test tests/issue28-workflow-separation.test.mjs
