name: Stamp reviewed staging landing visuals
on:
  push:
    branches:
      - fix/staging-landing-image-seams-20261111
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restamp:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Stamp real staging asset digests without touching production
        run: |
          node scripts/stamp-staging-rc.mjs --write
          node scripts/stamp-staging-rc.mjs --check
      - name: Commit generated test/ digests only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/app.js test/index.html test/build-info.json test/site-status.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(staging): refresh landing asset build ID and checksums"
            git push origin HEAD:fix/staging-landing-image-seams-20261111
          fi
