
name: LW no-glare hover · all roles staging QA

on:
  push:
    branches: [main]
    paths:
      - test/lw-hover-safe-20261108.css
      - test/index.html
      - tests/lw-hover-safe.test.mjs
      - tests/lw-hover-safe-browser.test.mjs
      - .github/workflows/lw-hover-safe.yml

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lw-hover-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  source:
    name: Fast CSS and production boundary checks
    runs-on: [self-hosted, macOS, ARM64, freight-mac-qa]
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Staging CSS checks (blocking)
        run: |
          node --test \
            --test-name-pattern='^(staging loads hover shield|shimmer and high-brightness hover)' \
            tests/lw-hover-safe.test.mjs

      - name: Production isolation (advisory on push, blocking on manual run)
        continue-on-error: ${{ github.event_name == 'push' }}
        run: |
          node --test \
            --test-name-pattern='^hover changes enter production only through the verified release manifest$' \
            tests/lw-hover-safe.test.mjs

      - name: Explain non-release status
        if: github.event_name == 'push'
        run: |
          echo "STAGING_CSS_CHECK_COMPLETE"
          echo "Production isolation remains mandatory for manual validation."
          echo "This workflow never authorizes a production release."

  served:
    name: Verify exact published staging CSS
    if: github.event_name == 'workflow_dispatch'
    needs: source
    runs-on: [self-hosted, macOS, ARM64, freight-mac-qa]
    timeout-minutes: 3

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify published hover CSS without polling
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';

          const base = 'https://hakaru4i-afk.github.io/freight-quotes-web/test';

          async function get(file) {
            const response = await fetch(
              `${base}/${file}?qa=${process.env.GITHUB_SHA}`,
              {
                headers: {'Cache-Control': 'no-cache'},
                signal: AbortSignal.timeout(12000)
              }
            );

            assert.equal(response.status, 200, `HTTP failure: ${file}`);
            return Buffer.from(await response.arrayBuffer());
          }

          const entry = 'lw-hover-safe-20261108.css';
          const source = readFileSync(`test/${entry}`);

          const sha = createHash('sha1')
            .update(`blob ${source.length}\0`)
            .update(source)
            .digest('hex')
            .slice(0, 12);

          const html = (await get('index.html')).toString('utf8');

          const links = [
            ...html.matchAll(
              /(?:src|href)=["']\.\/([^"'?]+)\?v=([a-f0-9]{12})["']/g
            )
          ];

          assert.ok(
            links.some(m => m[1] === entry && m[2] === sha),
            'STAGING_CACHE_KEY_MISMATCH'
          );

          const published = await get(entry);

          assert.ok(
            published.equals(source),
            'HOVER_STAGING_ASSET_MISMATCH'
          );

          console.log('LW_HOVER_STAGING_READBACK_PASS');
          JS

  browser:
    name: Manual Chromium visual verification
    if: github.event_name == 'workflow_dispatch'
    needs: served
    runs-on: [self-hosted, macOS, ARM64, freight-mac-qa]
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Cache npm and Chromium
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-node24-playwright-1.56.1-v1

      - name: Install Playwright package
        run: npm install --no-save --ignore-scripts playwright@1.56.1

      - name: Ensure Chromium system dependencies
        run: npx playwright install-deps chromium

      - name: Download Chromium on cache miss
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Isolated eight-role matrix and served sign-in hover
        run: node --test tests/lw-hover-safe-browser.test.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lw-hover-safe-screens
          path: lw-hover-safe-*.png
          if-no-files-found: ignore
