# One bounded PR gate. Release/security evidence remains in dedicated protected workflows.
name: PR quick checks
on:
  pull_request:
    paths:
      - '**'
      - '!test/process-history/**'
      - '!test/processes/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pr-quick-linux-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  fast:
    name: Syntax and fast Node tests
    if: >-
      (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == 'hakaru4i-afk'))
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          package-manager-cache: false
          node-version: '24'
      # No package-lock exists in this static-site repository. Cache npm downloads
      # by the pinned Node/Playwright toolchain; never cache mutable node_modules.
      - name: Cache npm downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node24-pr-npm-v1
          restore-keys: |
            ${{ runner.os }}-node24-pr-npm-
      - name: Syntax-check only changed JavaScript modules
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$HEAD_SHA" -- '*.js' '*.mjs' '*.cjs' > /tmp/changed-js.txt
          else
            git ls-files '*.js' '*.mjs' '*.cjs' > /tmp/changed-js.txt
          fi
          count=0
          while IFS= read -r file; do
            [ -f "$file" ] || continue
            node --check "$file"
            count=$((count+1))
          done < /tmp/changed-js.txt
          echo "SYNTAX_PASS: $count changed JavaScript files"
      - name: Classify quick CRM UI or wider change
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          scope=full
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            scope=$(node scripts/release/task-change-scope.mjs classify "$BASE_SHA" "$HEAD_SHA")
          fi
          case "$scope" in lightweight|full) ;; *) exit 1 ;; esac
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
          echo "CRM_QA_SCOPE=$scope"
      - name: Verify the exact-pair QA impact planner and fail-closed receipts
        run: node --test tests/qa-impact-plan.test.mjs
      - name: Validate release and evidence contracts before acceptance
        if: steps.scope.outputs.scope == 'full'
        run: node --test --test-concurrency=2 tests/locked-release.test.mjs tests/locked-staging.test.mjs tests/isolated-qa-acceptance.test.mjs tests/locked-qa-package.test.mjs
      - name: Reject stale generated asset identity before merge
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != pull_request ] || git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -Eq '^(test/|scripts/stamp-staging-rc\.mjs$)'; then
            node scripts/stamp-staging-rc.mjs --check
          fi
      - name: Reject stale reviewed process diagrams before expensive QA
        run: node scripts/build-process-maps.mjs --check
      - name: Fast deterministic regressions (no network, browser or deployment)
        if: steps.scope.outputs.scope == 'full'
        run: |
          node --test --test-concurrency=2 \
            tests/issue47-late-ui.test.mjs \
            tests/issue47-task2-csv.test.mjs \
            tests/issue17-formal-document-ui.test.mjs \
            tests/issue49-staging-check.test.mjs \
            tests/map50-owner-km-before-bid.test.mjs \
            tests/task2-contrast.test.mjs \
            tests/issue47-owner-optional-reason.test.mjs \
            tests/owner-ci-release-control.test.mjs \
            tests/owner-feedback-navigation-archive.test.mjs \
            tests/feedback-deadline-issue173.test.mjs \
            tests/carrier-multirow-import.test.mjs \
            tests/lw-carrier-winner-only-sh71.test.mjs \
            tests/owner-process-control-ui.test.mjs \
            tests/owner-offer-status-clarity-sh70.test.mjs \
            tests/owner-offer-scoring-r3.test.mjs
      - name: Consolidated legacy candidate VED document and chat regression (offline)
        if: github.event_name == 'pull_request' && github.head_ref == 'integration/issue94-legacy'
        run: node --test tests/qa014-017-behavior.test.mjs tests/ved-shared-chat-and-requests.test.mjs tests/chat-unread-contrast.test.mjs
      - name: Verify transport dashboard mode classification
        run: node --test tests/lw2-transport-classification.test.mjs
      - name: Verify role report charts, date handling and localization
        run: node --test tests/role-report-charts.test.mjs
      - name: Verify Owner intake action locks and async retries
        run: node --test tests/owner-register-action-lock-regression.test.mjs
      - name: Verify feedback archive filters and terminal controls
        run: node --test tests/feedback-archive-single-filter.test.mjs
      - name: Verify monotonic production release notifications
        run: node --test tests/release-banner-monotonic.test.mjs
      - name: Verify required release notes and history recovery
        run: node --test tests/release-notes-history.test.mjs
      - name: Validate generated CSS bundle and asset ordering
        run: |
          if [ -f scripts/build-css-bundle.mjs ]; then
            node --check scripts/build-css-bundle.mjs
            node scripts/build-css-bundle.mjs --check
          fi
      - name: Prevent accidental return of heavy PR triggers
        run: |
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          const manual=[
            'release-stabilization',
            'issue47-live-mobile',
            'lw-hover-safe','lw-public-guide-qa','lw2-dashboard-visual',
            'owner-command-center','owner-registers-20261111',
            'owner-workspace-compact','portal-contrast-accessibility',
            'task12-observer'
          ];
          for (const name of manual){
            const content=readFileSync('.github/workflows/'+name+'.yml','utf8');
            if (/^  pull_request:/m.test(content)) throw Error('HEAVY_PR_TRIGGER:'+name);
          }
          console.log('HEAVY_PR_TRIGGER_GUARD_PASS; manual/scheduled browser runs only');
          JS

  browser-fixture-regression:
    name: Targeted browser fixture regression
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == 'hakaru4i-afk'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Identify changes to browser fixtures
        id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_SHA...$HEAD_SHA" > /tmp/fixture-diff.txt
          if grep -Eq '^tests/(public-entry-browser|task1-create-form-browser|task12-role-robots)\.test\.mjs$' /tmp/fixture-diff.txt; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -Eq '^(test/)?lw2-staging-20261107\.js$|^tests/lw2-dashboard-browser\.test\.mjs$' /tmp/fixture-diff.txt; then
            echo "transport=true" >> "$GITHUB_OUTPUT"
          else
            echo "transport=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        if: steps.changed.outputs.run == 'true' || steps.changed.outputs.transport == 'true'
        with:
          package-manager-cache: false
          node-version: '24'
      - name: Install existing browser test toolchain
        if: steps.changed.outputs.run == 'true' || steps.changed.outputs.transport == 'true'
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run three affected browser files with unchanged assertions
        if: steps.changed.outputs.run == 'true'
        run: |
          mkdir -p reports
          node --test --test-concurrency=2 tests/public-entry-browser.test.mjs tests/task1-create-form-browser.test.mjs tests/task12-role-robots.test.mjs

      - name: Verify changed transport dashboard in Chromium
        if: steps.changed.outputs.transport == 'true'
        run: node --test tests/lw2-dashboard-browser.test.mjs
      - name: Consolidated legacy candidate staff and shared chat browser fixtures
        if: github.head_ref == 'integration/issue94-legacy' && (steps.changed.outputs.run == 'true' || steps.changed.outputs.transport == 'true')
        run: node --test --test-concurrency=2 tests/owner-team-users-browser.test.mjs tests/emergency-chat-preservation-browser.test.mjs
