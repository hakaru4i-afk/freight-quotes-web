name: Refresh verified staging process-source signatures
on:
  push:
    branches:
      - fix/staging-landing-image-seams-20261111
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Review source identity and regenerate unchanged process logic
        run: |
          node scripts/build-process-maps.mjs --record-reviewed-sources
          node scripts/build-process-maps.mjs --check
          node scripts/stamp-staging-rc.mjs --check
      - name: Commit refreshed staging visual source signatures
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/business-process-model.json test/business-process-current.svg test/business-process-current.drawio test/process-map.html test/processes/
          if ! git diff --cached --quiet; then
            git commit -m "docs(staging): align process evidence with visual asset build"
            git push origin HEAD:fix/staging-landing-image-seams-20261111
          fi
