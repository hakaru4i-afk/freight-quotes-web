name: Issue47 live mobile and login locales
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  browser:
    runs-on: [self-hosted, macOS, ARM64, freight-mac-qa]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Cache npm and Playwright Chromium
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-node24-playwright-1.56.1-v2
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install chromium
      - run: node --test tests/issue47-live-mobile.test.mjs
