name: Issue47 live mobile and login locales
on:
  pull_request:
    paths:
      - 'tests/issue47-live-mobile.test.mjs'
      - '.github/workflows/issue47-live-mobile.yml'
  push:
    branches: [main]
    paths:
      - 'test/**'
      - 'tests/issue47-live-mobile.test.mjs'
      - '.github/workflows/issue47-live-mobile.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node --test tests/issue47-live-mobile.test.mjs
