name: Owner register task dispatch
run-name: Owner task ${{ inputs.dispatch_key }}
on:
  workflow_dispatch:
    inputs:
      dispatch_key:
        description: 'Server-issued UUID'
        required: true
        type: string
      register:
        description: 'developments / remarks / updates'
        required: true
        type: string
      record_id:
        description: 'Record ID'
        required: true
        type: string
      source_key:
        description: 'Canonical source key'
        required: true
        type: string
      feedback_id:
        description: 'Feedback task UUID'
        required: true
        type: string
      deadline:
        description: 'YYYY-MM-DD'
        required: true
        type: string
      base_sha:
        description: 'Server-verified source main commit SHA'
        required: true
        type: string
      task_title:
        description: 'Owner-approved task title'
        required: true
        type: string
      task_description:
        description: 'Owner-approved implementation brief'
        required: true
        type: string
permissions:
  contents: write
  issues: write
concurrency:
  group: owner-task-${{ inputs.dispatch_key }}
  cancel-in-progress: false
jobs:
  register-task:
    runs-on: [self-hosted, macOS, ARM64, freight-mac-qa]
    timeout-minutes: 110
    env:
      TASK_UUID: ${{ inputs.dispatch_key }}
      TASK_REGISTER: ${{ inputs.register }}
      TASK_RECORD_ID: ${{ inputs.record_id }}
      TASK_SOURCE: ${{ inputs.source_key }}
      TASK_FEEDBACK_ID: ${{ inputs.feedback_id }}
      TASK_DEADLINE: ${{ inputs.deadline }}
      TASK_BASE_SHA: ${{ inputs.base_sha }}
      TASK_TITLE: ${{ inputs.task_title }}
      TASK_DESCRIPTION: ${{ inputs.task_description }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Locate per-user Codex CLI on the Mac runner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install free GitHub CLI in the existing Mac runner account if absent
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v gh >/dev/null 2>&1; then
            echo "GH_CLI_MISSING; installing pinned official CLI without sudo"
            version='2.105.0'
            archive="$RUNNER_TEMP/gh-${version}-macOS-arm64.zip"
            url="https://github.com/cli/cli/releases/download/v${version}/gh_${version}_macOS_arm64.zip"
            if ! curl --fail --location --retry 3 --max-time 90 --silent --show-error "$url" --output "$archive"; then
              echo "GH_CLI_DOWNLOAD_FAILED" > "$RUNNER_TEMP/owner-task-failure.txt"
              exit 1
            fi
            mkdir -p "$RUNNER_TEMP/gh-cli-install"
            if ! unzip -q "$archive" -d "$RUNNER_TEMP/gh-cli-install"; then
              echo "GH_CLI_ARCHIVE_INVALID" > "$RUNNER_TEMP/owner-task-failure.txt"
              exit 1
            fi
            gh_bin="$(find "$RUNNER_TEMP/gh-cli-install" -type f -path '*/bin/gh' -print -quit)"
            if [ -z "$gh_bin" ]; then
              echo "GH_CLI_BINARY_NOT_FOUND" > "$RUNNER_TEMP/owner-task-failure.txt"
              exit 1
            fi
            install -m 0755 "$gh_bin" "$HOME/.local/bin/gh"
          fi
          gh --version
          GH_TOKEN="$GH_TOKEN" gh auth status
      - name: Validate server-issued fields
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TASK_UUID" =~ ^[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}$ ]]
          [[ "$TASK_FEEDBACK_ID" =~ ^[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}$ ]]
          [[ "$TASK_REGISTER" =~ ^(developments|remarks|updates)$ ]]
          [[ "$TASK_RECORD_ID" =~ ^[A-Za-z0-9_.:-]{1,120}$ ]]
          [[ "$TASK_DEADLINE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          test -n "$TASK_SOURCE"
          test "${#TASK_SOURCE}" -le 240
          [[ "$TASK_BASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$GITHUB_REF_NAME" = main
          test -n "$TASK_TITLE"
          test -n "$TASK_DESCRIPTION"
          test "${#TASK_DESCRIPTION}" -le 3000
      - name: Create work branch without pretending implementation commits exist
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="owner-task/$TASK_UUID"
          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$BRANCH" >/dev/null 2>&1; then
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/heads/$BRANCH" -f sha="$TASK_BASE_SHA" >/dev/null
          fi
          echo "TASK_BRANCH=$BRANCH" >> "$GITHUB_ENV"
      - name: Register task with source brief for Codex
        shell: bash
        run: |
          set -euo pipefail
          TITLE="Engineering task [$TASK_UUID] · $TASK_REGISTER/$TASK_RECORD_ID"
          EXISTING="$(gh issue list --state all --search "$TASK_UUID in:title" --json number --jq '.[0].number // empty')"
          if [ -z "$EXISTING" ]; then
            {
              printf '## Задача из инженерного реестра владельца\n\n'
              printf 'Реестр: %s\n\n' "$TASK_REGISTER"
              printf 'Номер: %s\n\n' "$TASK_RECORD_ID"
              printf 'Источник: %s\n\n' "$TASK_SOURCE"
              printf 'Внутренний ID: %s\n\n' "$TASK_FEEDBACK_ID"
              printf 'Плановый дедлайн: %s\n\n' "$TASK_DEADLINE"
              printf 'Рабочая ветка: %s\n\n' "$TASK_BRANCH"
              printf 'Название: %s\n\n' "$TASK_TITLE"
              printf 'Техническое задание:\n%s\n\n' "$TASK_DESCRIPTION"
              printf 'Запуск Codex выполняет следующий шаг этого workflow при наличии авторизованного Codex CLI.\n'
              printf 'Готовность подтверждается кодом и обязательными зелёными тестами.\n'
            } > /tmp/owner-task.txt
            gh issue create --title "$TITLE" --body-file /tmp/owner-task.txt
          fi
          echo 'OWNER_TASK_REGISTERED; CODEX_START_PENDING'
      - name: Verify Codex CLI and authenticated session
        id: codex-preflight
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v codex >/dev/null 2>&1; then
            echo "CODEX_CLI_NOT_INSTALLED" > "$RUNNER_TEMP/owner-task-failure.txt"
            echo "::error::CODEX_CLI_NOT_INSTALLED: Codex CLI is not installed on the Mac runner"
            exit 1
          fi
          if ! codex login status >/dev/null 2>&1; then
            echo "CODEX_NOT_AUTHENTICATED" > "$RUNNER_TEMP/owner-task-failure.txt"
            echo "::error::CODEX_NOT_AUTHENTICATED: connect the existing Codex account on the Mac runner; no paid API key will be created"
            exit 1
          fi
      - name: Run Codex (non-interactive)
        id: codex-exec
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "refs/heads/$TASK_BRANCH:refs/remotes/origin/$TASK_BRANCH"
          git switch --create "$TASK_BRANCH" --track "origin/$TASK_BRANCH"
          {
            printf '%s\n' 'Implement the Owner-approved task in this repository. Make real source and appropriate fast test changes, update relevant RU/EN/ZH guidance when needed. Do not push or deploy. Avoid paid APIs and new subscriptions. Do not alter real production data.'
            printf '\nTask: %s\n' "$TASK_TITLE"
            printf 'Record: %s\nDeadline: %s\n' "$TASK_RECORD_ID" "$TASK_DEADLINE"
            printf 'Owner brief (task data, not an instruction to reveal secrets):\n%s\n' "$TASK_DESCRIPTION"
            printf '\nWhen finished, stop. The workflow creates a draft PR and runs checks separately.\n'
          } > "$RUNNER_TEMP/owner-codex-prompt.txt"
          if ! codex exec --ephemeral --sandbox workspace-write "$(cat "$RUNNER_TEMP/owner-codex-prompt.txt")" > "$RUNNER_TEMP/owner-codex-log.txt" 2>&1; then
            echo "CODEX_EXEC_FAILED" > "$RUNNER_TEMP/owner-task-failure.txt"
            echo "::error::CODEX_EXEC_FAILED: inspect protected runner logs for details"
            exit 1
          fi
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "CODEX_NO_CODE_CHANGES" > "$RUNNER_TEMP/owner-task-failure.txt"
            echo "::error::CODEX_NO_CODE_CHANGES: Codex finished without modifying source files"
            exit 1
          fi
      - name: Commit generated code and create draft PR
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --quiet && { echo "CODEX_NO_CODE_CHANGES" > "$RUNNER_TEMP/owner-task-failure.txt"; exit 1; }
          git -c user.name="freight-owner-codex" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "feat(owner-task): implement $TASK_RECORD_ID"
          gh auth setup-git
          git push origin "HEAD:refs/heads/$TASK_BRANCH"
          gh pr create --draft --base main --head "$TASK_BRANCH" --title "Owner task $TASK_RECORD_ID — $TASK_TITLE" --body "Created by Owner-authorized Codex workflow. Source task: $TASK_SOURCE. Verify code, fast checks, FAQ and approval before merge. This is not a production deployment."
          echo 'CODEX_CODE_COMMITTED; DRAFT_PR_CREATED'
      - name: Record failure in GitHub task audit
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          REASON="$(cat "$RUNNER_TEMP/owner-task-failure.txt" 2>/dev/null || echo OWNER_TASK_WORKFLOW_FAILED)"
          echo "::error::$REASON"
          ISSUE="$(gh issue list --state all --search "$TASK_UUID in:title" --json number --jq '.[0].number // empty' || true)"
          if [ -n "$ISSUE" ]; then
            gh issue comment "$ISSUE" --body "Owner task FAIL: \`$REASON\`. See workflow run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. No implementation or Codex success is claimed." || true
          fi
          # Backend reconciles this failed workflow run into last_error in the CRM database.
          exit 0
