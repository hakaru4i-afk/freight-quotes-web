name: Finalize staging landing visual candidate
on:
  push:
    branches:
      - fix/staging-landing-image-seams-20261111
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate and verify exact asset and business-source provenance
        run: |
          node scripts/stamp-staging-rc.mjs --write
          node scripts/build-process-maps.mjs --record-reviewed-sources
          node scripts/stamp-staging-rc.mjs --check
          node scripts/build-process-maps.mjs --check
      - name: Commit staging-only verified metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/app.js test/index.html test/build-info.json test/site-status.json test/business-process-model.json test/business-process-current.svg test/business-process-current.drawio test/process-map.html test/processes/
          if ! git diff --cached --quiet; then
            git commit -m "chore(staging): verify final home-artwork cache and model signatures"
            git push origin HEAD:fix/staging-landing-image-seams-20261111
          fi
