name: Issue47 owner optional reason staging regression
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  validate:
    runs-on: [self-hosted, macOS, ARM64, freight-mac-qa]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          package-manager-cache: false
          node-version: '24'
      - run: node --check test/app.js
      - run: node --test tests/issue47-owner-optional-reason.test.mjs tests/issue47-late-ui.test.mjs tests/issue47-task2-csv.test.mjs
