name: P0 source stamp on staging repair branch only
on:
  push:
    branches: [fix/p0-196-locked-staging]
    paths: ['.github/workflows/p0-stage-source-stamp.yml']
permissions:
  contents: read
concurrency:
  group: p0-stage-source-stamp
  cancel-in-progress: false
jobs:
  source-stamp:
    if: github.repository == 'hakaru4i-afk/freight-quotes-web' && github.ref == 'refs/heads/fix/p0-196-locked-staging' && github.actor == 'hakaru4i-afk'
    permissions:
      contents: write
    runs-on: [self-hosted, macOS, ARM64, freight-mac-qa]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p0-196-locked-staging
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Regenerate candidate asset identities without any runtime or release claim
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/fix/p0-196-locked-staging
          git sparse-checkout disable
          git restore --source=HEAD --worktree -- .
          test -z "$(git status --porcelain)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/stamp-staging-rc.mjs --write
          node scripts/stamp-staging-rc.mjs --check
          node --test tests/locked-staging.test.mjs
          git diff --check
          while IFS= read -r path; do
            case "$path" in
              test/index.html|test/app.js|test/build-info.json|test/site-status.json|test/process-model-diff.mjs|test/process-editor-20261111.mjs|test/global-view/globe.mjs|test/global-view/map.mjs|test/global-view/view.mjs) ;;
              *) echo "UNEXPECTED_SOURCE_STAMP_DIFF:$path"; exit 1;;
            esac
          done < <(git diff --name-only)
          git add -- test
          if ! git diff --cached --quiet; then
            git commit -m "P0: regenerate candidate cache and source asset identities"
          fi
          tmp=$(mktemp)
          node scripts/release/refresh-pr157-staging-manifest.mjs --stdout > "$tmp"
          cp "$tmp" test/staging-manifest.json
          rm "$tmp"
          git add -- test/staging-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "P0: index exact staging source without runtime attestation"
          fi
          node --input-type=module <<'JS'
          import {execFileSync} from 'node:child_process';
          import {readFileSync,writeFileSync} from 'node:fs';
          const lock=JSON.parse(readFileSync('release-lock.json','utf8'));
          if(!/^[a-f0-9]{40}$/.test(lock.backendSha))throw Error('INVALID_BACKEND_LOCK');
          lock.frontendSha=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
          writeFileSync('release-lock.json',JSON.stringify(lock,null,2)+'\n');
          JS
          git add -- release-lock.json
          git commit -m "P0: lock exact stamped staging source; not release approval"
          git push origin HEAD:refs/heads/fix/p0-196-locked-staging
