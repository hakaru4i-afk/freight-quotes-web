name: Carrier124 refresh candidate process-map provenance (no deploy)
on:
  push:
    branches: ['fix/carrier-dashboard-124']
    paths: ['.github/workflows/carrier124-process-map-candidate-refresh.yml']
permissions:
  contents: write
jobs:
  refresh:
    if: github.ref == 'refs/heads/fix/carrier-dashboard-124'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Source review receipt and generated process maps (draft only)
        run: |
          set -euo pipefail
          node scripts/stamp-staging-rc.mjs --check
          node scripts/build-process-maps.mjs --record-reviewed-sources
          node scripts/build-process-maps.mjs --check
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          const m=JSON.parse(readFileSync('test/business-process-model.json'));
          if(m.releaseStatus!=='RELEASE_BLOCKED')throw Error('RELEASE_STATUS_NOT_BLOCKED');
          const b=JSON.parse(readFileSync('test/build-info.json'));
          if(b.carrierDashboard124?.ownerAccepted!==false||b.carrierDashboard124?.releaseGate!=='BLOCKED')throw Error('OWNER_APPROVAL_UNVERIFIED');
          console.log('CANDIDATE_PROCESS_MAP_RECORDED_NOT_OWNER_APPROVAL');
          JS
      - name: Commit candidate diagrams and source signatures only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- test/business-process-model.json test/business-process-current.svg test/business-process-current.drawio test/process-map.html test/processes
          if git diff --cached --quiet; then echo 'UNCHANGED'; exit 0; fi
          if git diff --cached --name-only | grep -Ev '^test/(business-process-model\.json|business-process-current\.(svg|drawio)|process-map\.html|processes/[^/]+\.(svg|mmd|json))$'; then echo 'INVALID_OUTPUT_SET'; exit 2; fi
          git commit -m 'build(staging): candidate process source receipts and maps, release blocked [skip ci]'
          git push origin HEAD:refs/heads/fix/carrier-dashboard-124

# 2026-11-19 refresh source map for translated Owner and carrier request fields.
