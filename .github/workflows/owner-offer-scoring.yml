name: Owner multi-criteria scoring
on:
  push:
    branches: [main]
    paths:
      - 'offer-scoring.mjs'
      - 'test/offer-scoring.mjs'
      - 'owner-offer-evaluation-20261117.mjs'
      - 'test/owner-offer-evaluation-20261117.mjs'
      - 'owner-offer-evaluation-20261117.css'
      - 'test/owner-offer-evaluation-20261117.css'
      - 'tests/owner-offer-scoring-r3.test.mjs'
      - '.github/workflows/owner-offer-scoring.yml'
  pull_request:
    paths:
      - 'offer-scoring.mjs'
      - 'test/offer-scoring.mjs'
      - 'owner-offer-evaluation-20261117.mjs'
      - 'test/owner-offer-evaluation-20261117.mjs'
      - 'tests/owner-offer-scoring-r3.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  scoring:
    if: >-
      (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == 'hakaru4i-afk'))
    runs-on: [self-hosted, macOS, ARM64, freight-mac-qa]
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          package-manager-cache: false
          node-version: '22'
      - name: Syntax and production/test parity
        run: |
          node --check offer-scoring.mjs
          node --check test/offer-scoring.mjs
          node --check owner-offer-evaluation-20261117.mjs
          node --check test/owner-offer-evaluation-20261117.mjs
          cmp offer-scoring.mjs test/offer-scoring.mjs
          cmp owner-offer-evaluation-20261117.mjs test/owner-offer-evaluation-20261117.mjs
          cmp owner-offer-evaluation-20261117.css test/owner-offer-evaluation-20261117.css
      - name: Run scoring regression
        run: node --test tests/owner-offer-scoring-r3.test.mjs
