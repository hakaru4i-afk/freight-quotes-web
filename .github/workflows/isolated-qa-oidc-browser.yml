name: Isolated QA browser with GitHub OIDC
on:
  workflow_dispatch:
concurrency:
  # Hold the same lease as staging and production publication throughout QA.
  group: owner-portal-production-release
  cancel-in-progress: false
permissions:
  actions: read
  contents: read
  id-token: write
jobs:
  real-qa:
    if: github.repository == 'hakaru4i-afk/freight-quotes-web' && github.ref == 'refs/heads/main' && github.actor == 'hakaru4i-afk' && github.triggering_actor == 'hakaru4i-afk'
    environment: isolated-qa
    # The isolated credentials broker requires a GitHub-hosted OIDC identity.
    runs-on: ubuntu-24.04 # Playwright 1.56.1 supports Ubuntu 24.04; avoid rolling image incompatibility
    timeout-minutes: 50
    env:
      QA_SESSIONS_FILE: /tmp/freight-ci-qa/sessions.json
      QA_BROWSER_PUBLISHED: 'true'
      QA_SCENARIO_STATE_DIR: /tmp/freight-ci-qa
      AXE_CORE_PATH: node_modules/axe-core/axe.min.js
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          package-manager-cache: false
          node-version: '24'
      - name: Resolve the immutable candidate from the trusted main lock
        id: lock
        run: |
          node --input-type=module <<'JS' >> "$GITHUB_OUTPUT"
          import {readLock} from './scripts/release/locked-release.mjs';
          const lock = readLock();
          console.log('frontend=' + lock.frontendSha);
          console.log('backend=' + lock.backendSha);
          JS
          frontend=$(node --input-type=module -e 'import {readLock} from "./scripts/release/locked-release.mjs"; console.log(readLock().frontendSha)')
          git merge-base --is-ancestor "$frontend" "$GITHUB_SHA"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ steps.lock.outputs.frontend }}
          path: candidate-web
          persist-credentials: false
      - name: Fail early on malformed browser scenarios before runtime attestation or QA sessions
        shell: bash
        run: |
          set -euo pipefail
          for file in tests/*.e2e.mjs tests/task12-ci-*.mjs scripts/release/locked-*.mjs; do
            test -f "$file"
            node --check "$file"
          done
      - name: Verify main-only QA environment before private checkout
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tests/task12-ci-environment-policy.mjs
      - name: Verify read-only backend credential for exact source
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          BACKEND_QA_READ_TOKEN: ${{ secrets.BACKEND_QA_READ_TOKEN }}
        run: node scripts/release/check-qa-credentials.mjs e2e
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: hakaru4i-afk/freight-quotes
          ref: ${{ steps.lock.outputs.backend }}
          path: candidate-backend
          token: ${{ secrets.BACKEND_QA_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the live staging assets and deployed isolated API before opening sessions
        env:
          GH_TOKEN: ${{ github.token }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          output=$(mktemp -d)
          node scripts/release/locked-qa-runtime.mjs select-and-attest candidate-web candidate-backend \
            "$output/staging-proof.json" "$output/before.json"
          rm -rf reports
          {
            echo "LOCKED_QA_DIR=$output"
            echo "QA_LOCKED_FRONTEND_DIR=$GITHUB_WORKSPACE/candidate-web"
            echo "QA_BROWSER_BACKEND_PROOF_FILE=$output/before.json"
          } >> "$GITHUB_ENV"
      - name: Issue scoped synthetic QA credentials through GitHub OIDC
        run: node tests/task12-ci-oidc-bindings.mjs
      - name: Verify real QA sessions and role identities
        run: node tests/task12-ci-auth.mjs
      - name: Verify carrier eligibility before launching the real browser suite
        run: node tests/task12-business-api.e2e.mjs --preflight
      - run: npm install --no-save --ignore-scripts playwright@1.56.1 axe-core@4.10.2
      - run: npx playwright install --with-deps chromium
      - name: Install final protocol PDF text verifier
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Read all role cabinets from actual published assets
        run: node tests/task12-isolated-browser.e2e.mjs
      - name: Full published railway and VED review lifecycle for 14 November
        env:
          QA_MAP_ORDER: QA-NOV14-${{ github.run_id }}-${{ github.run_attempt }}
          QA_NOV14_INCLUDE_ORDINARY: 'true'
        run: node tests/nov14-published-chain.e2e.mjs
      - name: Verify parallel shipment, VED document and chat reads after the full lifecycle
        id: api_performance
        continue-on-error: true
        run: node tests/issue99-real-performance.mjs
      - name: Owner creates an isolated request through published UI
        env:
          QA_BROWSER_ACTORS: owner
          QA_BROWSER_CREATE: 'true'
        run: node tests/task12-isolated-browser.e2e.mjs
      - name: Carrier A imports CSV and submits a real isolated bid
        env:
          QA_BROWSER_ACTORS: carrierA
          QA_BROWSER_BID: 'true'
          QA_BROWSER_IMPORT: csv
        run: node tests/task12-isolated-browser.e2e.mjs
      - name: Carrier submits a real isolated bid through published UI
        env:
          QA_BROWSER_ACTORS: carrierB
          QA_BROWSER_BID: 'true'
          QA_BROWSER_IMPORT: xlsx
        run: node tests/task12-isolated-browser.e2e.mjs
      - name: Owner compares both offers and chooses one winner
        id: selection
        env:
          QA_BROWSER_ACTORS: owner
          QA_BROWSER_SELECT: 'true'
        run: |
          node tests/task12-isolated-browser.e2e.mjs
          node --input-type=module <<'JS'
          import {readFileSync,appendFileSync} from 'node:fs';
          const winner=JSON.parse(readFileSync('reports/isolated-rc/browser-results-owner.json','utf8')).roles[0].selection.winnerActor;
          if(!['carrierA','carrierB'].includes(winner))throw Error('INVALID_WINNER_ACTOR');
          appendFileSync(process.env.GITHUB_OUTPUT,'winner_actor='+winner+'\n');
          JS
      - name: Winning carrier accepts; loser and premature VED access are denied
        env:
          QA_BROWSER_ACTORS: ${{ steps.selection.outputs.winner_actor }}
          QA_BROWSER_ACCEPT: 'true'
        run: node tests/task12-isolated-browser.e2e.mjs
      - name: Winning carrier tracks dates, four changes and containers without duplicate history
        env:
          QA_BROWSER_ACTORS: ${{ steps.selection.outputs.winner_actor }}
          QA_BROWSER_TRACK: 'true'
        run: node tests/task12-isolated-browser.e2e.mjs
      - name: VED assigns documents and sends a real shared message with attachment
        env:
          QA_BROWSER_ACTORS: ved
          QA_BROWSER_VED_WORK: 'true'
        run: node tests/task12-isolated-browser.e2e.mjs
      - name: Addressed Logistic uploads documents and confirms the handoff
        env:
          QA_BROWSER_ACTORS: logistic
          QA_BROWSER_LOGISTIC_DOCUMENT: 'true'
        run: node tests/task12-isolated-browser.e2e.mjs
      - name: Verify VED draft persistence, reload and no repeated submissions
        env:
          QA_BROWSER_ACTORS: ved
          QA_BROWSER_VED_VERIFY: 'true'
        run: node tests/task12-isolated-browser.e2e.mjs
      - name: Verify addressed Logistic file isolation and duplicate submission protection
        env:
          QA_BROWSER_ACTORS: logistic
          QA_BROWSER_LOGISTIC_SECURITY: 'true'
        run: node tests/task12-isolated-browser.e2e.mjs
      - name: Run real Carrier A B and Supplier A B privacy gate
        id: security
        continue-on-error: true
        run: node tests/security-gate-real.e2e.mjs
      - name: Verify private registers, proposals and draft editor as Owner
        id: owner_alignment
        continue-on-error: true
        env:
          QA_BROWSER_ACTORS: owner
          QA_BROWSER_ALIGNMENT: 'true'
        run: node tests/task12-isolated-browser.e2e.mjs
      - name: Verify all other roles cannot read private engineering archives
        id: private_denials
        continue-on-error: true
        env:
          QA_BROWSER_ACTORS: carrierA,carrierB,ved,logistic,supplier,supplierB,designer,content,purchasing,certification
          QA_BROWSER_ALIGNMENT: 'true'
        run: node tests/task12-isolated-browser.e2e.mjs
      - name: Verify eleven cabinets in RU EN ZH on desktop and mobile
        id: cabinet_matrix
        continue-on-error: true
        env:
          QA_BROWSER_MATRIX: 'true'
        run: node tests/task12-isolated-browser.e2e.mjs
      - name: MAP50 published Owner two carriers winner and two weekly reports
        id: map50
        continue-on-error: true
        run: node tests/map50-published-chain.e2e.mjs
      - name: Verify additional required fields, variants, late preparation, tender and session policy
        id: business_api
        continue-on-error: true
        run: node tests/task12-business-api.e2e.mjs
      - name: Verify sea air and multimodal tracking through published Carrier UI
        id: mode_matrix
        if: steps.business_api.outputs.mode_ready == 'true'
        continue-on-error: true
        env:
          QA_BROWSER_ACTORS: carrierA
          QA_BROWSER_MODE_MATRIX: 'true'
          QA_MAP50: 'true'
        run: node tests/task12-isolated-browser.e2e.mjs
      - name: Verify previous production UI against candidate API using read-only QA sessions
        id: previous_ui_compatibility
        continue-on-error: true
        run: node tests/production-previous-ui-compatibility.e2e.mjs
      - name: Verify final tender protocol PDF through published Owner UI
        id: tender_pdf
        if: steps.business_api.outputs.tender_ready == 'true'
        continue-on-error: true
        env:
          QA_BROWSER_ACTORS: owner
          QA_BROWSER_TENDER: 'true'
        run: node tests/task12-isolated-browser.e2e.mjs
      - name: Verify actual audit records for every QA cabinet and business operations
        id: site_audit
        run: node tests/site-audit-real.e2e.mjs
      - name: Require every independent acceptance result before declaring success
        if: always() && env.LOCKED_QA_DIR != ''
        env:
          QA_RESULT_SITE_AUDIT: ${{ steps.site_audit.outcome }}
          QA_RESULT_SECURITY: ${{ steps.security.outcome }}
          QA_RESULT_OWNER_ALIGNMENT: ${{ steps.owner_alignment.outcome }}
          QA_RESULT_PRIVATE_DENIALS: ${{ steps.private_denials.outcome }}
          QA_RESULT_CABINET_MATRIX: ${{ steps.cabinet_matrix.outcome }}
          QA_RESULT_MAP50: ${{ steps.map50.outcome }}
          QA_RESULT_BUSINESS_API: ${{ steps.business_api.outcome }}
          QA_RESULT_MODE_MATRIX: ${{ steps.mode_matrix.outcome }}
          QA_RESULT_PREVIOUS_UI_COMPATIBILITY: ${{ steps.previous_ui_compatibility.outcome }}
          QA_RESULT_TENDER_PDF: ${{ steps.tender_pdf.outcome }}
          QA_RESULT_API_PERFORMANCE: ${{ steps.api_performance.outcome }}
        run: |
          node --input-type=module <<'JS'
          const failed=Object.entries(process.env).filter(([k,v])=>k.startsWith('QA_RESULT_')&&v!=='success').map(([k,v])=>({check:k,outcome:v}));
          if(failed.length){console.log('QA_ACCEPTANCE_BLOCKED',JSON.stringify(failed));process.exit(1);}
          console.log('QA_INDEPENDENT_ACCEPTANCE_ALL_PASS');
          JS
      - name: Verify the same live runtime and compile 37 browser and API receipts
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          node scripts/release/locked-qa-runtime.mjs attest candidate-web candidate-backend \
            "$LOCKED_QA_DIR/staging-proof.json" "$LOCKED_QA_DIR/after.json"
          node scripts/release/locked-e2e-evidence.mjs "$LOCKED_QA_DIR/before.json" "$LOCKED_QA_DIR/after.json" reports "$LOCKED_QA_DIR/evidence"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: locked-release-evidence-attempt-${{ github.run_attempt }}
          path: ${{ env.LOCKED_QA_DIR }}/evidence/*.json
          if-no-files-found: error
          retention-days: 2
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: isolated-qa-redacted-evidence-attempt-${{ github.run_attempt }}
          path: |
            reports/isolated-rc/site-audit-real.json
            reports/isolated-rc/security-gate-real.json
            reports/isolated-rc/business-api-real.json
            reports/isolated-rc/business-fixture-preflight.json
            reports/isolated-rc/previous-production-ui-compatibility.json
            reports/isolated-rc/issue99-real-performance.json
            reports/isolated-rc/*-previous-production-compatibility.png
            reports/isolated-rc/SEA-*.png
            reports/isolated-rc/AIR-*.png
            reports/isolated-rc/MULTI-*.png
            reports/map50-published/*.json
            reports/map50-published/*.png
            reports/nov14-ordinary/*.json
            reports/nov14-ordinary/*.png
            reports/nov14-published/*.json
            reports/nov14-published/*.png
            !reports/nov14-published/owner-register-*.png
            !reports/nov14-published/owner-cabinet-read*.png
            !reports/nov14-ordinary/owner-register-*.png
            !reports/nov14-ordinary/owner-cabinet-read*.png
            reports/ci-qa-auth.json
            reports/ci-qa-environment-policy.json
            reports/isolated-rc/browser-results-*.json
          retention-days: 7
      - name: Revoke sessions and remove private runner files
        if: always()
        run: node tests/task12-ci-auth.mjs --logout
      - name: Close issued synthetic QA credentials and revoke their sessions
        if: always()
        run: node tests/task12-ci-oidc-bindings.mjs --finish
