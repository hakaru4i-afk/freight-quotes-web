name: Owner audit log explanations
on:
  pull_request:
    paths:
      - 'owner-audit-explanations-20261117.mjs'
      - 'test/owner-audit-explanations-20261117.mjs'
      - 'tests/owner-audit-explanations-20261117.test.mjs'
      - '.github/workflows/owner-audit-explanations.yml'
  push:
    branches: [main]
    paths:
      - 'owner-audit-explanations-20261117.mjs'
      - 'test/owner-audit-explanations-20261117.mjs'
      - 'owner-audit-explanations-20261117.css'
      - 'test/owner-audit-explanations-20261117.css'
      - 'tests/owner-audit-explanations-20261117.test.mjs'
      - '.github/workflows/owner-audit-explanations.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  readable-audit:
    if: >-
      (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == 'hakaru4i-afk'))
    runs-on: [self-hosted, macOS, ARM64, freight-mac-qa]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          package-manager-cache: false
          node-version: '24'
      - run: node --test tests/owner-audit-explanations-20261117.test.mjs
      - run: cmp owner-audit-explanations-20261117.mjs test/owner-audit-explanations-20261117.mjs
      - run: cmp owner-audit-explanations-20261117.css test/owner-audit-explanations-20261117.css
