name: Owner engineering task validation
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
concurrency:
  group: owner-task-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  task-e2e:
    if: >-
      (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == 'hakaru4i-afk')) &&
      (github.event.pull_request.head.repo.full_name == github.repository && (startsWith(github.head_ref, 'owner-task/') || github.head_ref == 'fix/owner-portal-one-click-release-20261122'))
    name: task-e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Syntax check changed JS modules
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$HEAD_SHA" -- '*.js' '*.mjs' '*.cjs' |
            while IFS= read -r file; do
              test -f "$file" && node --check "$file"
            done
      - name: Classify the entire pull request using its two Git revisions
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          scope=full
          if git cat-file -e "$BASE_SHA:scripts/release/task-change-scope.mjs" 2>/dev/null; then
            classifier=$(mktemp -d "$RUNNER_TEMP/task-scope.XXXXXXXX")
            trap 'rm -rf -- "$classifier"' EXIT
            git show "$BASE_SHA:scripts/release/task-change-scope.mjs" > "$classifier/scope.mjs"
            scope=$(node "$classifier/scope.mjs" classify "$BASE_SHA" "$HEAD_SHA")
          fi
          case "$scope" in lightweight|full) ;; *) exit 1 ;; esac
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
      - name: Quick CRM UI syntax, bundle and Owner button safety
        if: steps.scope.outputs.scope == 'lightweight'
        run: |
          set -euo pipefail
          node scripts/build-css-bundle.mjs --check
          node --test tests/owner-ci-release-control.test.mjs tests/owner-portal-one-click-release.test.mjs
      # Full suite includes real Chromium tests; install the pinned toolchain before importing them.
      - name: Install Playwright (same version as dedicated browser workflows)
        if: steps.scope.outputs.scope == 'full'
        run: npm install --no-save playwright@1.56.1
      - name: Install Chromium
        if: steps.scope.outputs.scope == 'full'
        run: npx playwright install --with-deps chromium
      - name: Run source and local browser regressions, fail closed
        if: steps.scope.outputs.scope == 'full'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/run-owner-task-tests.mjs source
      - name: Explicitly exclude deployment from task acceptance
        run: echo 'TASK_TEST_PASS_IS_NOT_PRODUCTION_RELEASE_APPROVAL'
