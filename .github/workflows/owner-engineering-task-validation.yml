name: Owner engineering task validation
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
concurrency:
  group: owner-task-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  task-e2e:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'owner-task/')
    name: task-e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax check changed JS modules
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$HEAD_SHA" -- '*.js' '*.mjs' '*.cjs' |
            while IFS= read -r file; do
              test -f "$file" && node --check "$file"
            done
      # Full suite includes real Chromium tests; install the pinned toolchain before importing them.
      - name: Install Playwright (same version as dedicated browser workflows)
        run: npm install --no-save playwright@1.56.1
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Run every deterministic Node regression, fail closed
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-concurrency=2 tests/*.test.mjs
      - name: Explicitly exclude deployment from task acceptance
        run: echo 'TASK_TEST_PASS_IS_NOT_PRODUCTION_RELEASE_APPROVAL'
