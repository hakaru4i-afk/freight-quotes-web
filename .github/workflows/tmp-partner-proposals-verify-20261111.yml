name: Verify staged partner proposal attachments and stamp assets
on:
  push:
    branches:
      - feat/staging-partner-proposal-attachments-20261111
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax and protected proposal endpoint
        run: |
          node --check test/lw-public-cooperation-20261108.js
          LW_REAL_UPLOAD=1 node --test tests/lw-partner-proposal-files.test.mjs
      - name: Stamp exact staging asset and process signatures
        run: |
          node scripts/stamp-staging-rc.mjs --write
          node scripts/build-process-maps.mjs --record-reviewed-sources
          node scripts/stamp-staging-rc.mjs --check
          node scripts/build-process-maps.mjs --check
      - name: Commit current source hashes in staging only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/app.js test/index.html test/build-info.json test/site-status.json test/business-process-model.json test/business-process-current.svg test/business-process-current.drawio test/process-map.html test/processes/
          if ! git diff --cached --quiet; then
            git commit -m "chore(staging): stamp new partner attachment assets and evidence"
            git push origin HEAD:feat/staging-partner-proposal-attachments-20261111
          fi
