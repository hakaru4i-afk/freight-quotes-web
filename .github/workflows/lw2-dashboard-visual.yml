name: Logistics Workspace 2.0 staging visual QA
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  visual-staging:
    runs-on: [self-hosted, macOS, ARM64, freight-mac-qa]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          package-manager-cache: false
          node-version: '24'
      - name: Cache npm and Playwright Chromium
        id: browser-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.npm
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-node24-playwright-1.56.1-v2
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install chromium
      - name: Validate actual carrier overview selectors, layout and links
        run: node --test tests/lw2-dashboard-browser.test.mjs
      - name: Upload rendered desktop/mobile screenshots
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: lw2-staging-browser-screenshots
          path: |
            lw2-desktop-qa.png
            lw2-mobile-qa.png
          if-no-files-found: ignore
