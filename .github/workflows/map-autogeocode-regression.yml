name: Automatic Map Geocoding Regression
on:
  push:
    branches: [main]
    paths:
      - 'global-view/**'
      - 'test/global-view/**'
      - 'tests/global-view-route.test.mjs'
      - 'tests/zbk-zabaikalsk-geocode.test.mjs'
      - '.github/workflows/map-autogeocode-regression.yml'
  pull_request:
    paths:
      - 'global-view/**'
      - 'test/global-view/**'
      - 'tests/global-view-route.test.mjs'
      - 'tests/zbk-zabaikalsk-geocode.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  map-regression:
    if: >-
      (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == 'hakaru4i-afk'))
    runs-on: [self-hosted, macOS, ARM64, freight-mac-qa]
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          package-manager-cache: false
          node-version: '22'
      - name: Verify module syntax
        run: |
          node --check global-view/route-model.mjs
          node --check test/global-view/route-model.mjs
          node --check global-view/view.mjs
          node --check test/global-view/view.mjs
          node --check global-view/distance.mjs
      - name: Keep prod/test route implementation identical
        run: |
          cmp global-view/route-model.mjs test/global-view/route-model.mjs
          cmp global-view/view.mjs test/global-view/view.mjs
          cmp global-view/distance.mjs test/global-view/distance.mjs
      - name: Geocoding and preliminary-kilometres regression
        run: node --test tests/global-view-route.test.mjs tests/zbk-zabaikalsk-geocode.test.mjs
