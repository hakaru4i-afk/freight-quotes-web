name: Owner live development progress
on:
  pull_request:
    paths:
      - 'owner-live-task-progress-20261121.*'
      - 'test/owner-live-task-progress-20261121.*'
      - 'index.html'
      - 'test/index.html'
      - 'tests/owner-live-task-progress*.test.mjs'
      - '.github/workflows/owner-live-development-progress.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  progress-unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check static code and fail-closed milestone math
        run: |
          node --check test/owner-live-task-progress-20261121.mjs
          node --check owner-live-task-progress-20261121.mjs
          node --test tests/owner-live-task-progress.test.mjs
  progress-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install isolated browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test mobile 390px, live CI status, Owner-only display and automatic progress
        run: node --test tests/owner-live-task-progress-browser.test.mjs
