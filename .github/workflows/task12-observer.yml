name: Task 1 + Task 2 / Staging QA observer
on:
  workflow_dispatch:
  schedule:
    - cron: '15 6 * * *'
  push:
    branches: [main]
    paths:
      - 'test/qa-observer.json'
      - 'test/qa-observer.html'
      - 'tests/task12-observer-smoke.test.mjs'
      - '.github/workflows/task12-observer.yml'
      - 'tests/task1-create-form-browser.test.mjs'
permissions:
  contents: read
concurrency:
  group: task12-staging-observer
  cancel-in-progress: false
jobs:
  published-smoke:
    name: "Staging: public availability & QA evidence contract"
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify served staging artifacts, QA matrix and backlog preservation
        shell: bash
        run: |
          mkdir -p reports
          node --test --test-reporter=spec --test-reporter=junit --test-reporter-destination=stdout --test-reporter-destination=reports/staging-smoke.xml tests/task12-observer-smoke.test.mjs
      - name: Upload inspectable evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: task12-public-smoke-report
          path: reports/
          if-no-files-found: ignore
          retention-days: 30
  browser-smoke:
    name: "Staging: real desktop/mobile browser smoke (not authenticated E2E)"
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install isolated Chromium test runtime
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Check staging login, localization and JavaScript errors at desktop and mobile
        shell: bash
        run: |
          mkdir -p reports
          node --test --test-reporter=spec --test-reporter=junit --test-reporter-destination=stdout --test-reporter-destination=reports/browser-smoke.xml tests/issue47-live-mobile.test.mjs
      - name: Upload inspectable browser evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: task12-browser-smoke-report
          path: reports/
          if-no-files-found: ignore
          retention-days: 30
  owner-form-browser:
    name: "T1-01 / Owner create shipment / isolated browser validation"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run real Owner-form UI with isolated API doubles; report missing validation as FAIL
        run: |
          mkdir -p reports
          node --test --test-reporter=spec --test-reporter=junit --test-reporter-destination=stdout --test-reporter-destination=reports/t1-01-browser.xml tests/task1-create-form-browser.test.mjs
      - name: Save T1-01 evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: task1-t101-isolated-browser-evidence
          path: reports/
          retention-days: 30
          if-no-files-found: ignore
  policy:
    name: "Scope safeguard"
    runs-on: ubuntu-24.04
    steps:
      - name: Confirm no production access or synthetic PASS is claimed
        shell: bash
        run: |
          echo "This workflow runs only public staging smoke checks."
          echo "No login credentials, real customer files, role mutations or production APIs are used."
          echo "Task1/Task2 full authorized E2E remains PENDING until independently demonstrated."
