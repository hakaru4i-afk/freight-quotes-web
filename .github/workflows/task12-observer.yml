name: Task 1 + Task 2 / Staging QA observer
on:
  workflow_dispatch:
  schedule:
    - cron: '15 6 * * *'
  push:
    branches: [main]
    paths:
      - 'test/**'
      - '!test/qa-robot-latest.json'
      - '!test/qa-release-readiness.json'
      - 'tests/**'
      - '.github/workflows/task12-observer.yml'
permissions:
  contents: read
concurrency:
  group: task12-staging-observer
  cancel-in-progress: false
jobs:
  published-smoke:
    name: "Staging: public availability & QA evidence contract"
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify served staging artifacts, QA matrix and backlog preservation
        shell: bash
        run: |
          mkdir -p reports
          node --test --test-reporter=spec --test-reporter=junit --test-reporter-destination=stdout --test-reporter-destination=reports/staging-smoke.xml tests/task12-observer-smoke.test.mjs
      - name: Upload inspectable evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: task12-public-smoke-report
          path: reports/
          if-no-files-found: ignore
          retention-days: 30
  browser-smoke:
    name: "Staging: real desktop/mobile browser smoke (not authenticated E2E)"
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install isolated Chromium test runtime
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Check staging login, localization and JavaScript errors at desktop and mobile
        shell: bash
        run: |
          mkdir -p reports
          node --test --test-reporter=spec --test-reporter=junit --test-reporter-destination=stdout --test-reporter-destination=reports/browser-smoke.xml tests/issue47-live-mobile.test.mjs
      - name: Upload inspectable browser evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: task12-browser-smoke-report
          path: reports/
          if-no-files-found: ignore
          retention-days: 30
  all-robots:
    name: "Robots: execute 37 mapped checks, report PASS/PARTIAL/FAIL/BLOCKED"
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install isolated browser runtime
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run all available Task1 + Task2 robot checks and produce inspectable report
        id: robot
        continue-on-error: true
        env:
          QA_TEST_TIMEOUT_MS: '85000'
        run: |
          mkdir -p reports
          node tests/task12-robot-runner.mjs
      - name: Upload complete robot report, logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task12-robots-all-groups
          path: |
            reports/
            lw2-desktop-qa.png
            lw2-mobile-qa.png
          retention-days: 30
          if-no-files-found: warn
      - name: Publish redacted public 37-case report for QA observer (staging only)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f reports/task12-robot-matrix.json || exit 0
          git config user.name task12-qa-bot
          git config user.email 'task12-qa-bot@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -B qa-report-publisher origin/main
            cp reports/task12-robot-matrix.json test/qa-robot-latest.json
            git add test/qa-robot-latest.json
            if git diff --cached --quiet; then
              echo 'QA report identical to deployed report'
              break
            fi
            git commit -m "qa(staging): publish robot results for run ${GITHUB_RUN_ID}"
            if git push origin HEAD:main; then
              echo 'Published robot report for dashboard'
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::warning::Could not publish report on main; uploaded artifact remains available."
            fi
          done
      - name: Fail robot job if a check found error (no false green)
        if: always()
        env:
          ROBOT_OUTCOME: ${{ steps.robot.outcome }}
        run: |
          if [ "$ROBOT_OUTCOME" != success ]; then
            echo "::error::Robot tests reported failures; inspect the uploaded artifact."
            exit 1
          fi
  authenticated-qa-preflight:
    name: "Protected QA: real Owner/Carrier/Logistic authentication and denial checks"
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify real login sessions using isolated QA API only
        id: auth
        continue-on-error: true
        env:
          QA_OWNER_LOGIN: ${{ secrets.QA_OWNER_LOGIN }}
          QA_OWNER_PASSWORD: ${{ secrets.QA_OWNER_PASSWORD }}
          QA_CARRIER_A_LOGIN: ${{ secrets.QA_CARRIER_A_LOGIN }}
          QA_CARRIER_A_PASSWORD: ${{ secrets.QA_CARRIER_A_PASSWORD }}
          QA_CARRIER_B_LOGIN: ${{ secrets.QA_CARRIER_B_LOGIN }}
          QA_CARRIER_B_PASSWORD: ${{ secrets.QA_CARRIER_B_PASSWORD }}
          QA_LOGISTIC_LOGIN: ${{ secrets.QA_LOGISTIC_LOGIN }}
          QA_LOGISTIC_PASSWORD: ${{ secrets.QA_LOGISTIC_PASSWORD }}
          QA_SCHEMA_PARITY_VERIFIED: ${{ vars.QA_SCHEMA_PARITY_VERIFIED }}
        run: node tests/task12-authenticated-readonly.e2e.mjs
      - name: Upload redacted results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task12-isolated-qa-auth-preflight
          path: reports/private-auth-qa-preflight.json
          if-no-files-found: warn
          retention-days: 14
      - name: Make missing protected QA setup visible
        if: always()
        env:
          AUTH_OUTCOME: ${{ steps.auth.outcome }}
        run: |
          if [ "$AUTH_OUTCOME" != success ]; then
            echo "::error::AUTH_QA_BLOCKED: missing safe QA credentials/parity or real login failure; no production access."
            exit 1
          fi
  real-business-journey:
    name: "Real QA browser: Owner creates, Carriers bid, Owner selects, Carrier executes"
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check browser journey syntax before connecting to the test system
        run: node --check tests/task12-live-journey.e2e.mjs
      - name: Install isolated Playwright Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run real browser journey against isolated QA API only
        id: journey
        continue-on-error: true
        env:
          QA_OWNER_LOGIN: ${{ secrets.QA_OWNER_LOGIN }}
          QA_OWNER_PASSWORD: ${{ secrets.QA_OWNER_PASSWORD }}
          QA_CARRIER_A_LOGIN: ${{ secrets.QA_CARRIER_A_LOGIN }}
          QA_CARRIER_A_PASSWORD: ${{ secrets.QA_CARRIER_A_PASSWORD }}
          QA_CARRIER_B_LOGIN: ${{ secrets.QA_CARRIER_B_LOGIN }}
          QA_CARRIER_B_PASSWORD: ${{ secrets.QA_CARRIER_B_PASSWORD }}
        run: |
          mkdir -p reports
          node tests/task12-live-journey.e2e.mjs
      - name: Upload private full browser journey evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task12-isolated-real-browser-journey
          path: reports/task12-private-real-business-journey.json
          if-no-files-found: warn
          retention-days: 14
      - name: Fail closed if real journey was not completed
        if: always()
        env:
          JOURNEY_OUTCOME: ${{ steps.journey.outcome }}
        run: |
          if [ "$JOURNEY_OUTCOME" != success ]; then
            echo "::error::REAL_QA_JOURNEY_BLOCKED: inspect restricted evidence artifact; no production access"
            exit 1
          fi
  production-release-gate:
    name: "Release decision: 37 authenticated E2E + security + restore (fail closed)"
    if: always()
    needs: [all-robots, authenticated-qa-preflight, real-business-journey]
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Download robot report from this run
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: task12-robots-all-groups
          path: qa-artifacts
      - name: Evaluate full pre-release acceptance without touching production
        id: decision
        continue-on-error: true
        env:
          ROBOT_REPORT_PATH: qa-artifacts/reports/task12-robot-matrix.json
        run: node tests/task12-release-gate.mjs
      - name: Upload inspectable release decision
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task12-production-release-readiness
          path: reports/task12-release-readiness.json
          retention-days: 30
          if-no-files-found: warn
      - name: Publish redacted release status to staging QA observer
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f reports/task12-release-readiness.json ]; then exit 0; fi
          git config user.name task12-qa-bot
          git config user.email 'task12-qa-bot@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -B qa-release-status-publisher origin/main
            cp reports/task12-release-readiness.json test/qa-release-readiness.json
            git add test/qa-release-readiness.json
            if git diff --cached --quiet; then break; fi
            git commit -m "qa(staging): publish release readiness decision from run ${GITHUB_RUN_ID}"
            if git push origin HEAD:main; then break; fi
            if [ "$attempt" -eq 3 ]; then echo "::warning::Report publishing failed; artifact remains."; fi
          done
      - name: Make release readiness visibly fail when incomplete
        if: always()
        env:
          GATE_OUTCOME: ${{ steps.decision.outcome }}
        run: |
          if [ "$GATE_OUTCOME" != success ]; then
            echo "::error::RELEASE_BLOCKED: do not deploy production. See release-readiness artifact."
            exit 1
          fi
          echo "READY_FOR_OWNER_RELEASE_APPROVAL: Production still requires explicit Owner authorization."
  policy:
    name: "Scope safeguard"
    runs-on: ubuntu-24.04
    steps:
      - name: Confirm no production access or synthetic PASS is claimed
        shell: bash
        run: |
          echo "This workflow executes public smoke and isolated mock-browser checks."
          echo "No login credentials, real customer files, role mutations or production APIs are used."
          echo "Task1/Task2 full authorized E2E remains PENDING until independently demonstrated."
