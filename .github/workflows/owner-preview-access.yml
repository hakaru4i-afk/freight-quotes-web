name: Owner-only cabin preview access regression
on:
  push:
    branches: [main]
    paths:
      - 'app.js'
      - 'test/app.js'
      - 'tests/owner-cabinet-preview-no-carrier-403.test.mjs'
      - '.github/workflows/owner-preview-access.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  security:
    runs-on: [self-hosted, macOS, ARM64, freight-mac-qa]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          package-manager-cache: false
          node-version: '24'
      - run: node --test tests/owner-cabinet-preview-no-carrier-403.test.mjs
