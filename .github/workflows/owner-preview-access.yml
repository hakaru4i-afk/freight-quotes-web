name: Owner-only cabin preview access regression
on:
  push:
    branches: [main]
    paths:
      - 'app.js'
      - 'test/app.js'
      - 'tests/owner-cabinet-preview-no-carrier-403.test.mjs'
      - '.github/workflows/owner-preview-access.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/owner-cabinet-preview-no-carrier-403.test.mjs
