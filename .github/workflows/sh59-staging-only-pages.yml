name: SH59 isolated QA20 staging-only Pages promotion
on:
  pull_request:
    paths:
      - .github/workflows/sh59-staging-only-pages.yml
      - scripts/release/build-staging-only-package.mjs
      - scripts/release/verify-published-root.mjs
      - scripts/release/verify-staging-preview-browser.mjs
      - tests/build-staging-only-package.test.mjs
      - tests/verify-published-root.test.mjs
  # A one-time owner-authorized staging-only release commit on main.
  # No root assets change. All published root bytes must match before/after.
  push:
    branches: [main, ci/isolated-sh59-staging-pages-20261121]
    paths:
      - .github/workflows/sh59-staging-only-pages.yml
  workflow_dispatch:
    inputs:
      handoff_run_id:
        description: 'Successful immutable SH59 source handoff run (37/37 original pair, signed audit)'
        type: string
        default: '44907714960'
        required: true
      staging_confirmation:
        description: 'Exact text STAGING ONLY SH59 API20, does NOT authorize production release'
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: sh59-isolated-staging-pages
  cancel-in-progress: false
jobs:
  unit-and-negative:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify staging-only copy, QA20 routing and production byte guards
        run: |
          set -euo pipefail
          node --check scripts/release/build-staging-only-package.mjs
          node --check scripts/release/verify-published-root.mjs
          node --check scripts/release/verify-staging-preview-browser.mjs
          node --test tests/build-staging-only-package.test.mjs tests/verify-published-root.test.mjs

  prepare:
    needs: unit-and-negative
    if: >-
      github.repository == 'hakaru4i-afk/freight-quotes-web' &&
      ((github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.actor == 'hakaru4i-afk') ||
       (github.event_name == 'workflow_dispatch' &&
        github.actor == 'hakaru4i-afk' &&
        github.ref == 'refs/heads/main') ||
       (github.event_name == 'push' &&
        github.actor == 'hakaru4i-afk' &&
        (github.ref == 'refs/heads/main' ||
         github.ref == 'refs/heads/ci/isolated-sh59-staging-pages-20261121') &&
        startsWith(github.event.head_commit.message, 'release(staging): deploy verified SH59 QA20 to Pages test only')))
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    permissions:
      contents: read
      actions: read
      pages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require explicit staging-only Owner instruction and Pages Actions mode
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        shell: bash
        env:
          CONFIRM: ${{ inputs.staging_confirmation }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            test "$CONFIRM" = 'STAGING ONLY SH59 API20'
            test "$GITHUB_REF" = refs/heads/main
          else
            test "$GITHUB_EVENT_NAME" = push
            test "$GITHUB_ACTOR" = hakaru4i-afk
            case "$GITHUB_REF" in
              refs/heads/main|refs/heads/ci/isolated-sh59-staging-pages-20261121) ;;
              *) echo '::error::Unapproved staging deployment ref'; exit 1 ;;
            esac
            jq -e '.head_commit.message | startswith("release(staging): deploy verified SH59 QA20 to Pages test only")' "$GITHUB_EVENT_PATH" >/dev/null
          fi
          test "$(gh api repos/hakaru4i-afk/freight-quotes-web/pages --jq '.build_type')" = workflow || {
            echo '::error::Owner must set Settings > Pages > Source > GitHub Actions first. No release.'
            exit 1
          }
      - name: Read current GitHub Pages publication mode without changing settings
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh api repos/hakaru4i-afk/freight-quotes-web/pages --jq '"PAGES_SOURCE=" + (.build_type // "unknown")' ; then
            echo 'Pages settings read successfully; no configuration mutation performed.'
          else
            echo '::warning::Current GitHub connector/workflow credential cannot read Pages mode; owner must confirm in Settings > Pages.'
          fi
      - name: Retrieve real immutable QA handoff (no synthetic evidence)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HANDOFF_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.handoff_run_id || '44907714960' }}
        run: |
          set -euo pipefail
          [[ "$HANDOFF_ID" =~ ^[1-9][0-9]*$ ]]
          mkdir -p verified-handoff imported
          gh api "repos/hakaru4i-afk/freight-quotes-web/actions/runs/$HANDOFF_ID" \
            --jq '.conclusion == "success" and .path == ".github/workflows/sh59-verified-handoff.yml"' | grep -qx true
          gh run download "$HANDOFF_ID" -R hakaru4i-afk/freight-quotes-web \
            --name sh59-immutable-tested-source-handoff --dir verified-handoff
          cd verified-handoff
          sha256sum --check SHA256SUMS
          test -s sh59-tested-source-lock.json
          test -s sh59-isolated-staging-import.json
          cd ..
          if tar -tzf verified-handoff/sh59-tested-test-assets.tar.gz | \
            grep -Ev '(^test/|^test$)'; then
            echo '::error::Unsafe source archive'; exit 1
          fi
          tar -xzf verified-handoff/sh59-tested-test-assets.tar.gz -C imported
      - name: Package SH59 isolated QA20 with production root copied unchanged
        run: |
          set -euo pipefail
          node scripts/release/build-staging-only-package.mjs . imported/test \
            verified-handoff/sh59-tested-source-lock.json .qa-pages
          cmp app.js .qa-pages/app.js
          cmp index.html .qa-pages/index.html
          cmp build-info.json .qa-pages/build-info.json
          cmp site-status.json .qa-pages/site-status.json
          cmp production-release-manifest.json .qa-pages/production-release-manifest.json
          test "$(node -e "console.log(require('./.qa-pages/test/sh59-qa-pair.json').productionAuthorized)")" = false
      - name: Check every production root file against currently served Pages before staging publish
        run: node scripts/release/verify-published-root.mjs .qa-pages
      - name: Real browser QA smoke on packaged stage and isolated v20 API
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
          node scripts/release/verify-staging-preview-browser.mjs .qa-pages
      - name: Generate immutable served-root verification receipt
        run: |
          set -euo pipefail
          find .qa-pages -type f -not -path '.qa-pages/test/*' -not -name .nojekyll -print0 | \
            sort -z | xargs -0 sha256sum > production-root-sha256.txt
          # Artifact uploads ignore hidden folders by default; export this public receipt.
          cp .qa-pages/test/sh59-qa-pair.json sh59-qa-pair.json
      - uses: actions/upload-artifact@v4
        with:
          name: sh59-staging-only-root-receipt
          path: |
            production-root-sha256.txt
            sh59-qa-pair.json
            reports/sh59-qa20-*.png
          retention-days: 30
      - uses: actions/configure-pages@v5
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        with:
          path: .qa-pages

  deploy:
    needs: prepare
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
      actions: read
      contents: read
    steps:
      - uses: actions/deploy-pages@v4
        id: pages
      - uses: actions/download-artifact@v4
        with:
          name: sh59-staging-only-root-receipt
          path: verified
      - name: Confirm every served production root asset still matches the prior bytes
        shell: bash
        run: |
          set -euo pipefail
          while read -r expected path; do
            rel="${path#'.qa-pages/'}"
            curl --fail --silent --show-error --location --retry 4 --max-time 30 \
              -H 'Cache-Control: no-cache' \
              "https://hakaru4i-afk.github.io/freight-quotes-web/$rel?root_proof=$GITHUB_RUN_ID" -o /tmp/sh59-verified-root
            actual=$(sha256sum /tmp/sh59-verified-root | cut -d' ' -f1)
            test "$actual" = "$expected" || { echo "::error::Production root changed: $rel"; exit 1; }
          done < verified/production-root-sha256.txt
      - name: Confirm published staging pair receipt, not production release approval
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 4 --max-time 30 \
            "https://hakaru4i-afk.github.io/freight-quotes-web/test/sh59-qa-pair.json?stage_proof=$GITHUB_RUN_ID" -o /tmp/sh59-stage-pair.json
          cmp /tmp/sh59-stage-pair.json verified/sh59-qa-pair.json
          node -e 'const r=require("/tmp/sh59-stage-pair.json");if(r.isolatedQaApiVersion!==20||r.productionAuthorized!==false||r.stagingBundleRebindRequiresFreshE2E!==true)process.exit(1)'
          echo 'STAGING_QA20_PUBLISHED; PRODUCTION_ROOT_UNCHANGED; FULL_AUTHENTICATED_ACCEPTANCE_PENDING'

  verify-published:
    # Exact committed opt-in; read-only verification of an already-deployed QA site.
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'hakaru4i-afk' &&
      startsWith(github.event.head_commit.message, 'verify(staging): confirm published SH59 API20 and root parity')
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Retrieve original deployment receipt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/hakaru4i-afk/freight-quotes-web/actions/runs/44890506212 \
            --jq '.head_sha=="f10923ffe9a4975d13a1b260d9831da51a8ba026"' | grep -qx true
          gh run download 44890506212 -R hakaru4i-afk/freight-quotes-web \
            --name sh59-staging-only-root-receipt --dir verified
          test -s verified/production-root-sha256.txt
      - name: Confirm SH59 isolated QA20 served bytes and production root parity
        shell: bash
        run: |
          set -euo pipefail
          base="https://hakaru4i-afk.github.io/freight-quotes-web"
          for entry in "sh59-qa-pair.json pair.json" "index.html index.html" "app.js app.js" "staging-transport-20261111.js transport.js"; do
            read -r target output <<< "$entry"
            curl --retry 5 --retry-delay 2 --fail --silent --show-error --location --max-time 30 \
              -H 'Cache-Control: no-cache' "$base/test/$target?verify=$GITHUB_RUN_ID" -o "/tmp/$output"
          done
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          import assert from 'node:assert/strict';
          const r=JSON.parse(readFileSync('/tmp/pair.json','utf8'));
          assert.equal(r.kind,'SH59_ISOLATED_QA20_STAGING_PACKAGE');
          assert.equal(r.businessVersion,'SH-01.30.59 v');
          assert.equal(r.testedFrontendSha,'6e0a465b2b031558989f62b38dc7939797434686');
          assert.equal(r.testedBackendSha,'092decf57d97fabdefa35bba0593890f52d34ef6');
          assert.equal(r.testedBackendBundleSha256,'2875f4dc43dcc61a8b191edcf70281d7f1b8875847bc9e0b276160bdfe6b0b87');
          assert.equal(r.apiFunction,'freight-api-qa-carrier124nov18');
          assert.equal(r.apiProject,'ibclzdkxiozbzmniiygv');
          assert.equal(r.isolatedQaApiVersion,20);
          assert.equal(r.originalE2EPass,37);
          assert.equal(r.stagingBundleRebindRequiresFreshE2E,true);
          assert.equal(r.productionAuthorized,false);
          assert.equal(r.productionTreeUnchanged,true);
          const hash=p=>createHash('sha256').update(readFileSync(p)).digest('hex');
          assert.equal(hash('/tmp/index.html'),r.patchedIndexSha256);
          assert.equal(hash('/tmp/app.js'),r.originalTestAppSha256);
          assert.equal(hash('/tmp/transport.js'),r.patchedTransportSha256);
          console.log('SERVED_SH59_QA20_PAIR_PASS');
          JS
          while read -r expected path; do
            rel="${path#'.qa-pages/'}"
            curl --retry 4 --fail --silent --show-error --location --max-time 30 \
              -H 'Cache-Control: no-cache' "$base/$rel?prodcheck=$GITHUB_RUN_ID" -o /tmp/verified-root
            actual=$(sha256sum /tmp/verified-root | cut -d' ' -f1)
            test "$expected" = "$actual" || { echo "::error::Production root changed: $rel"; exit 1; }
          done < verified/production-root-sha256.txt
          echo 'STAGING_QA20_PUBLISHED; ALL_PRODUCTION_ROOT_BYTES_UNCHANGED; FRESH_37_E2E_PENDING'

