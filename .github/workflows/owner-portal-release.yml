name: Owner portal one-click production release
run-name: Portal release ${{ inputs.task_id || (github.event_name == 'push' && 'd19f6625-a814-4c82-a415-9332eb06c4e2') || 'owner-manual' }} / ${{ inputs.request_id || (github.event_name == 'push' && 'f471504c-245b-4a64-9f9f-4a45fa1ce944') || github.run_id }}
on:
  workflow_dispatch:
    inputs:
      task_id:
        description: 'Existing approved CRM task UUID'
        required: false
        type: string
      request_id:
        description: 'Owner release request UUID'
        required: false
        type: string
  # The Owner-approved failed task/release UUIDs above allow a one-time guarded recovery.
  # All later ordinary pushes are excluded from production publication.
  push:
    branches: [main]
    paths:
      - .github/workflows/owner-portal-release.yml
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: owner-portal-production-release
  cancel-in-progress: false
jobs:
  verify:
    if: "${{ github.repository == 'hakaru4i-afk/freight-quotes-web' && github.actor == 'hakaru4i-afk' && github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.event.head_commit.message == 'fix(crm): repair one-click release without cross-repo token')) }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate Owner action and approved UI candidate
        shell: bash
        env:
          TASK_ID: ${{ inputs.task_id }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            if [ -n "$TASK_ID" ]; then
              [[ "$TASK_ID" =~ ^[a-f0-9]{8}-([a-f0-9]{4}-){3}[a-f0-9]{12}$ ]]
            fi
            if [ -n "$REQUEST_ID" ]; then
              [[ "$REQUEST_ID" =~ ^[a-f0-9]{8}-([a-f0-9]{4}-){3}[a-f0-9]{12}$ ]]
            fi
          fi
          cmp test/portal-feedback-center-20261107.js release/owner-portal-feedback-center-20261122.js
          node --check test/portal-feedback-center-20261107.js
          node --check scripts/release/owner-portal-pages.mjs
          node --check scripts/release/owner-ui-live-bootstrap.mjs
          node --test tests/owner-portal-one-click-release.test.mjs tests/owner-ci-release-control.test.mjs
          echo CRM_RELEASE_QUICK_CHECKS_PASSED
  deploy-pages:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: https://hakaru4i-afk.github.io/freight-quotes-web/
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare safe UI-only Pages package from actual production files
        shell: bash
        env:
          PORTAL_RELEASE_VERSION: SH-01.30.61 v
          PORTAL_BACKEND_SHA: 54ffad8ebf007f11a34b11fcf3d0c150caa00ab7
        run: |
          set -euo pipefail
          node scripts/release/owner-portal-pages.mjs
          node scripts/release/owner-ui-live-bootstrap.mjs
          cmp .release-pages/portal-feedback-center-20261107.js release/owner-portal-feedback-center-20261122.js
          cmp .release-pages/test/portal-feedback-center-20261107.js release/owner-portal-feedback-center-20261122.js
          echo CRM_RELEASE_PAGES_PACKAGE_VERIFIED
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .release-pages
      - uses: actions/deploy-pages@v4
      - name: Confirm public site serves the release and Owner button
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if curl -fsSL --retry 2 --max-time 20 "https://hakaru4i-afk.github.io/freight-quotes-web/portal-feedback-center-20261107.js?release=$GITHUB_RUN_ID-$i" -o "$RUNNER_TEMP/owner.js" &&
              cmp -s "$RUNNER_TEMP/owner.js" release/owner-portal-feedback-center-20261122.js &&
              curl -fsSL --retry 2 --max-time 20 "https://hakaru4i-afk.github.io/freight-quotes-web/production-release-manifest.json?release=$GITHUB_RUN_ID-$i" -o "$RUNNER_TEMP/manifest.json" &&
              node -e 'const m=require(process.argv[1]);process.exit(m.environment==="production"&&m.businessVersion==="SH-01.30.61 v"&&m.ownerUiHotfix?.sourceCommit===process.env.GITHUB_SHA&&m.ownerUiHotfix?.backendChanged===false?0:1)' "$RUNNER_TEMP/manifest.json"; then
              echo OWNER_RELEASE_PRODUCTION_VERIFIED
              exit 0
            fi
            sleep 6
          done
          echo "::error::OWNER_RELEASE_SITE_NOT_VERIFIED"
          exit 1
