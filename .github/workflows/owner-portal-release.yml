name: Owner production release from lock
run-name: Portal release ${{ inputs.task_id || 'owner-manual' }} / ${{ inputs.request_id || github.run_id }}
on:
  pull_request:
    paths:
      - .github/workflows/owner-portal-release.yml
      - release-lock.json
      - scripts/release/locked-*.mjs
      - .github/workflows/release-stabilization.yml
      - .github/workflows/locked-backend-regression.yml
      - .github/workflows/isolated-qa-oidc-browser.yml
      - tests/locked-release.test.mjs
      - tests/owner-portal-one-click-release.test.mjs
      - tests/production-versioned-api-routing.test.mjs
      - scripts/release/production-*.mjs
      - staging-api-region.mjs
      - staging-transport-20261111.js
  workflow_dispatch:
    inputs:
      publish:
        description: Apply the approved lock to production
        type: boolean
        default: false
      approval:
        description: Approval binding the exact frontend and backend SHAs in the lock
        type: string
      frontend_run_id:
        description: Optional exact frontend run override; otherwise resolve automatically
        type: string
      backend_run_id:
        description: Optional exact backend run override; otherwise resolve automatically
        type: string
      e2e_run_id:
        description: Optional exact authenticated 37-scenario run override; otherwise resolve automatically
        type: string
      release_runner:
        description: "Release verification and headless publication runner"
        type: choice
        options:
          - github
          - mac
        default: github
      backup_runner:
        description: "Protected backup execution: auto prefers Mac, github selects hosted explicitly"
        type: choice
        options:
          - auto
          - mac
          - github
        default: auto
      task_id:
        description: Associated CRM task
        type: string
      request_id:
        description: Associated CRM release request
        type: string
permissions:
  contents: read
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('locked-release-pr-{0}', github.event.pull_request.number) || 'owner-portal-production-release' }}
  # A newer PR commit supersedes only that PR's tests; never cancel a production release.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  release-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          package-manager-cache: false
          node-version: '24'
      - run: node --test tests/locked-release.test.mjs tests/production-versioned-api-routing.test.mjs

  mac-route-smoke:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == 'hakaru4i-afk' && github.actor == 'hakaru4i-afk'
    # Preserve the historical required-check ID while testing native ARM in GitHub's cloud.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - name: Check release toolchain
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(uname -s)" == Darwin ]]; then
            export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
            printf '%s\n' /opt/homebrew/bin /usr/local/bin >> "$GITHUB_PATH"
          fi
          for tool in gh jq git tar; do command -v "$tool" >/dev/null || { echo "::error::RELEASE_TOOL_MISSING: $tool"; exit 1; }; done
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          package-manager-cache: false
          node-version: '24'
      - run: node --test tests/locked-release.test.mjs tests/production-versioned-api-routing.test.mjs

  verify:
    if: github.repository == 'hakaru4i-afk/freight-quotes-web' && github.actor == 'hakaru4i-afk' && github.triggering_actor == 'hakaru4i-afk' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ${{ inputs.release_runner == 'mac' && fromJSON('["self-hosted","macOS","ARM64","freight-mac-qa"]') || fromJSON('["ubuntu-latest"]') }}
    timeout-minutes: 12
    permissions:
      actions: read
      contents: read
    outputs:
      frontend: ${{ steps.lock.outputs.frontend }}
      backend: ${{ steps.lock.outputs.backend }}
      version: ${{ steps.lock.outputs.version }}
      evidence: ${{ steps.evidence.outputs.receipt }}
    steps:
      - name: Check release toolchain
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(uname -s)" == Darwin ]]; then
            export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
            printf '%s\n' /opt/homebrew/bin /usr/local/bin >> "$GITHUB_PATH"
          fi
          for tool in gh jq git tar; do command -v "$tool" >/dev/null || { echo "::error::RELEASE_TOOL_MISSING: $tool"; exit 1; }; done
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          package-manager-cache: false
          node-version: '24'
      - name: Resolve exact source and next version from the served receipt
        id: lock
        env:
          CRM_REQUEST: ${{ inputs.request_id }}
          PUBLISH: ${{ inputs.publish }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$CRM_REQUEST" ] && [ "$PUBLISH" != true ]; then
            echo '::error::RELEASE_COMMAND_FOR_EXACT_LOCK_REQUIRED'
            exit 1
          fi
          plan="$(node scripts/release/locked-release.mjs plan)"
          frontend="$(jq -er '.frontendSha' <<< "$plan")"
          git merge-base --is-ancestor "$frontend" "$GITHUB_SHA"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "backend=$(jq -er '.backendSha' <<< "$plan")" >> "$GITHUB_OUTPUT"
          echo "version=$(jq -er '.releaseVersion' <<< "$plan")" >> "$GITHUB_OUTPUT"
          echo "$plan" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.lock.outputs.frontend }}
          path: candidate-web
          persist-credentials: false
      - name: Check that the immutable frontend includes the staging runtime
        run: node scripts/release/locked-release-pages.mjs preflight candidate-web
      - name: Reject incompatible production API path before backup
        run: node scripts/release/production-route-contract.mjs candidate-web source
      - name: Require explicit approval and verified reports for the locked pair
        id: evidence
        if: inputs.publish
        env:
          RELEASE_APPROVAL: ${{ inputs.approval }}
          FRONTEND_RUN_ID: ${{ inputs.frontend_run_id }}
          BACKEND_RUN_ID: ${{ inputs.backend_run_id }}
          E2E_RUN_ID: ${{ inputs.e2e_run_id }}
          WEB_TOKEN: ${{ github.token }}
        run: |
          receipt=$(node scripts/release/locked-release.mjs evidence)
          printf 'receipt=%s\n' "$receipt" >> "$GITHUB_OUTPUT"

  backup:
    needs: verify
    if: inputs.publish
    # The protected backend workflow remains responsible for verified recovery.
    runs-on: ubuntu-latest
    timeout-minutes: 85
    outputs:
      receipt: ${{ steps.backup.outputs.receipt }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          package-manager-cache: false
          node-version: '24'
      - name: Capture, encrypt and verify recovery on the protected backup workflow
        id: backup
        env:
          BACKEND_RELEASE_TOKEN: ${{ secrets.BACKEND_RELEASE_TOKEN }}
          RELEASE_BACKUP_RUNNER: ${{ inputs.backup_runner || 'auto' }}
        run: node scripts/release/locked-release.mjs backup

  deploy-pages:
    needs: [verify, backup]
    if: inputs.publish && needs.verify.result == 'success' && needs.backup.result == 'success'
    runs-on: ${{ inputs.release_runner == 'mac' && fromJSON('["self-hosted","macOS","ARM64","freight-mac-qa"]') || fromJSON('["ubuntu-24.04"]') }}
    timeout-minutes: 32
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Check release toolchain
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(uname -s)" == Darwin ]]; then
            export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
            printf '%s\n' /opt/homebrew/bin /usr/local/bin >> "$GITHUB_PATH"
          fi
          for tool in gh jq git tar; do command -v "$tool" >/dev/null || { echo "::error::RELEASE_TOOL_MISSING: $tool"; exit 1; }; done
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          path: candidate-web
          ref: ${{ needs.verify.outputs.frontend }}
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: hakaru4i-afk/freight-quotes
          path: candidate-backend
          ref: ${{ needs.verify.outputs.backend }}
          token: ${{ secrets.BACKEND_RELEASE_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          package-manager-cache: false
          node-version: '24'
      - name: Check protected smoke credentials before publishing any API
        env:
          SMOKE_OWNER_LOGIN: ${{ secrets.SMOKE_OWNER_LOGIN || secrets.SMOKE_OWNER_EMAIL }}
          SMOKE_OWNER_PASSWORD: ${{ secrets.SMOKE_OWNER_PASSWORD }}
        run: node --input-type=module -e "import {validateSmokeCredentials} from './scripts/release/production-owner-login.mjs'; validateSmokeCredentials(process.env.SMOKE_OWNER_LOGIN,process.env.SMOKE_OWNER_PASSWORD)"
      - name: Verify that the backend SHA is in the approved main history
        env:
          BACKEND_SHA: ${{ needs.verify.outputs.backend }}
        run: git -C candidate-backend merge-base --is-ancestor "$BACKEND_SHA" refs/remotes/origin/main
      - uses: actions/configure-pages@v5
      - name: Preserve the verified production root and current candidate staging
        run: node scripts/release/locked-release-pages.mjs snapshot candidate-web .rollback-pages
      - uses: actions/upload-pages-artifact@v4
        with:
          name: rollback-pages
          path: .rollback-pages
          retention-days: 7
      - name: Publish and verify the immutable API before updating Pages
        env:
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          umask 077
          node scripts/release/locked-release-api.mjs publish candidate-backend "$RUNNER_TEMP/api" "$RUNNER_TEMP/api-proof.json"
      - name: Package the exact verified pair
        env:
          RELEASE_EVIDENCE: ${{ needs.verify.outputs.evidence }}
          RELEASE_BACKUP: ${{ needs.backup.outputs.receipt }}
          RELEASE_ROLLBACK_PATH: .rollback-pages
        run: node scripts/release/locked-release-pages.mjs package candidate-web .release-pages "$RUNNER_TEMP/api-proof.json"
      - name: Verify exact packaged production route and cache keys
        run: node scripts/release/production-route-contract.mjs .release-pages package
      - name: Install pinned browser for production smoke
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          if [[ "$RUNNER_OS" == Linux ]]; then
            npx playwright install --with-deps chromium
          else
            npx playwright install chromium
          fi
      - name: Verify direct Owner API login and headless candidate cabinet before switching live Pages
        env:
          SMOKE_OWNER_LOGIN: ${{ secrets.SMOKE_OWNER_LOGIN || secrets.SMOKE_OWNER_EMAIL }}
          SMOKE_OWNER_PASSWORD: ${{ secrets.SMOKE_OWNER_PASSWORD }}
        run: node scripts/release/production-authenticated-browser.mjs candidate .release-pages
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .release-pages
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Confirm public site serves the release and Owner button
        id: readback
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          node scripts/release/locked-release-pages.mjs verify . .release-pages
          node scripts/release/production-authenticated-browser.mjs live .release-pages
      - name: Restore previous Pages if publication readback fails
        id: rollback
        if: failure() && steps.deployment.outcome == 'success' && steps.readback.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          artifact_name: rollback-pages
      - name: Verify the restored production root and API health
        if: failure() && steps.rollback.outcome == 'success'
        run: node scripts/release/locked-release-pages.mjs verify-rollback . .rollback-pages
      - name: Revoke the run-scoped login and delete local session state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          session_dir="$RUNNER_TEMP/freight-prod-smoke-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          if [ -f "$session_dir/session" ]; then
            node scripts/release/production-authenticated-browser.mjs cleanup .release-pages
          fi
