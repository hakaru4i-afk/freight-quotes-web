name: LW permanent-delete staging regression
on:
  push:
    branches: [main]
    paths:
      - test/app.js
      - test/index.html
      - tests/lw-permanent-delete-staging.test.mjs
      - .github/workflows/lw-permanent-delete-staging.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  permanent-delete-staging:
    runs-on: [self-hosted, macOS, ARM64, freight-mac-qa]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          package-manager-cache: false
          node-version: '22'
      - name: Check deletion UI, no trash and cache version
        run: node --test tests/lw-permanent-delete-staging.test.mjs
      - name: Check staging API denies anonymous permanent deletion
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const url = 'https://ibclzdkxiozbzmniiygv.supabase.co/functions/v1/freight-api/api/registry';
          const r = await fetch(url, {method: 'POST', headers: {'content-type':'application/json','origin':'https://hakaru4i-afk.github.io'}, body: JSON.stringify({action:'delete',kind:'request',id:'unauthorized-test',reason:'security regression test'})});
          assert.equal(r.status,403,'unauthenticated users must not delete requests');
          NODE
