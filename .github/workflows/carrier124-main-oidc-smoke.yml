name: Carrier124 live OIDC acceptance on isolated SH59 (11 roles)
on:
  pull_request:
    paths:
      - '.github/workflows/carrier124-main-oidc-smoke.yml'
      - '.github/workflows/sh59-protected-37-audit.yml'
  workflow_dispatch:
    inputs:
      full_suite:
        description: 'Run the pinned SH59 lifecycle and role matrix in the isolated QA environment'
        type: boolean
        required: false
        default: false
permissions:
  contents: read
env:
  # Change this immutable pin only in the protected workflow review.
  FREIGHT_PROTECTED_CANDIDATE: 6e0a465b2b031558989f62b38dc7939797434686
jobs:
  candidate-preflight:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.FREIGHT_PROTECTED_CANDIDATE }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check the frozen SH59 v20 candidate and OIDC regressions without credentials
        run: |
          test "$(git rev-parse HEAD)" = "$FREIGHT_PROTECTED_CANDIDATE"
          node scripts/check-staging-alignment.mjs --source-only
          node scripts/check-isolated-api-pair.mjs
          node --test tests/carrier124-ci-oidc-bindings.test.mjs tests/carrier124-service-recovery.test.mjs
  qa:
    if: github.repository == 'hakaru4i-afk/freight-quotes-web' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    environment: isolated-qa
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: carrier124-main-oidc-verified
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      QA_ISOLATED_RUN: carrier124nov18
      QA_SESSIONS_FILE: /tmp/freight-carrier124-ci/sessions.json
      QA_SCENARIO_STATE_DIR: /tmp/freight-carrier124-ci
      QA_CARRIER124_PRIVATE_DIR: /tmp/freight-carrier124-ci
      AXE_CORE_PATH: node_modules/axe-core/axe.min.js
    steps:
      - uses: actions/checkout@v4
        with:
          repository: hakaru4i-afk/freight-quotes-web
          ref: ${{ env.FREIGHT_PROTECTED_CANDIDATE }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Enforce main-only, GitHub OIDC and source integrity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REPOSITORY" = hakaru4i-afk/freight-quotes-web
          test "$(git rev-parse HEAD)" = "$FREIGHT_PROTECTED_CANDIDATE"
          test "$(git status --porcelain --untracked-files=all)" = ''
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
          node --check tests/carrier124-ci-oidc-bindings.mjs
          node --check tests/carrier124-ci-auth.mjs
          node --check tests/carrier124-ci-business.mjs
          node --check tests/task12-isolated-browser.e2e.mjs
      - name: Bind frozen Git assets and the isolated API before requesting credentials
        run: |
          node scripts/check-staging-alignment.mjs --source-only
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {execFileSync} from 'node:child_process';
          import {appendFileSync,mkdirSync,readFileSync,writeFileSync} from 'node:fs';
          const manifest=JSON.parse(readFileSync('test/staging-manifest.json','utf8'));
          const qa=manifest.sh59IsolatedQa;
          assert.equal(qa?.businessVersion,'SH-01.30.59 v');
          assert.equal(qa.sourceCommit,manifest.backendSourceCommit);
          assert.equal(qa.version,20);
          assert.equal(qa.sourceFilesVerified,26);
          assert.match(qa.sourceReceiptSha256,/^[a-f0-9]{64}$/);
          const api=new URL('https://'+qa.projectRef+'.supabase.co/functions/v1/'+qa.function+'/health');
          const response=await fetch(api,{redirect:'error',signal:AbortSignal.timeout(15000)});
          assert.equal(response.status,200);
          const health=await response.json();
          assert.equal(health.release,qa.businessVersion);
          assert.equal(health.qaRun,'carrier124nov18');
          assert.equal(health.edgeVersion,qa.version,'ISOLATED_EDGE_VERSION_DRIFT');
          assert.equal(health.projectRef,qa.projectRef);
          assert.equal(health.environment,'staging');
          const pair={
            function:qa.function,version:qa.version,bundle:qa.providerBundleSha256,
            backendSource:qa.sourceCommit,match:true,readbackCount:qa.sourceFilesVerified,
            frontendSource:manifest.frontendCommit,frontendMetadata:execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(),protectedWorkflowSha:process.env.GITHUB_SHA,
            frontendTestTree:execFileSync('git',['rev-parse','HEAD:test'],{encoding:'utf8'}).trim(),
            sqlMigrationVersion:qa.catalogMigrationVersion||manifest.sqlMigrationVersion,workflowRunId:process.env.GITHUB_RUN_ID,workflowRunAttempt:process.env.GITHUB_RUN_ATTEMPT
          };
          assert.equal(pair.frontendMetadata,process.env.FREIGHT_PROTECTED_CANDIDATE);
          execFileSync(process.execPath,['scripts/check-isolated-api-pair.mjs'],{stdio:'inherit'});
          const path=process.env.RUNNER_TEMP+'/sh59-isolated-pair.json';
          writeFileSync(path,JSON.stringify(pair),{mode:0o600});
          mkdirSync('reports',{recursive:true});
          writeFileSync('reports/carrier124-ci-pair.json',JSON.stringify(pair,null,2)+'\n');
          appendFileSync(process.env.GITHUB_ENV,'QA_CARRIER124_PAIR_FILE='+path+'\nQA_CARRIER124_CANDIDATE=true\nQA_BROWSER_PUBLISHED=false\n');
          NODE
      - name: Obtain 11 ephemeral QA-only credentials via verified GitHub OIDC
        id: issued
        run: node tests/carrier124-ci-oidc-bindings.mjs
      - name: Authenticate 11 QA users against exact isolated Carrier124 SH59 function
        id: authenticated
        run: node tests/carrier124-ci-auth.mjs
      - name: Recover the interrupted synthetic Service Level fixture before business tests
        id: fixture_recovery
        env:
          QA_BROWSER_EVIDENCE_DIR: reports/carrier124-remaining
        run: node tests/carrier124-remaining-fixtures.e2e.mjs recover-sl
      - name: Execute real owner-carrier award and take with isolated synthetic rows
        id: business
        continue-on-error: true
        run: node tests/carrier124-ci-business.mjs
      - name: Authorized negative API access and document isolation (T1-09 T2-02)
        id: auth_isolation
        continue-on-error: true
        shell: bash
        env:
          QA_BROWSER_EVIDENCE_DIR: reports/carrier124-remaining
        run: |
          set -euo pipefail
          node tests/carrier124-remaining-security.e2e.mjs carrierA
          node tests/carrier124-remaining-security.e2e.mjs carrierB
          node tests/carrier124-remaining-security.e2e.mjs verify
      - name: Install Chromium for real pinned-asset browser E2E
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1 axe-core@4.10.2
          test -s node_modules/axe-core/axe.min.js
          # GitHub's Ubuntu runner already ships browser runtime libraries.
          # --with-deps unnecessarily apt-installs optional font packages that are unavailable on some mirrors.
          # Browser E2E below is the fail-closed runtime validation.
          npx playwright install chromium
          if [ '${{ inputs.full_suite }}' = 'true' ] && ! command -v pdftotext >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends poppler-utils
          fi
      - name: Open all 11 actual role cabinets against SH59 using pinned Git assets
        id: browser
        continue-on-error: true
        env:
          QA_BROWSER_EVIDENCE_DIR: reports/carrier124-published-browser
        run: node tests/task12-isolated-browser.e2e.mjs
      - name: Full isolated Carrier124 SH59 workflow with claim and ordinary closure
        id: full_lifecycle
        if: ${{ inputs.full_suite == true }}
        continue-on-error: true
        env:
          QA_MAP_ORDER: QA-C124-REV-${{ github.run_id }}-${{ github.run_attempt }}
          QA_NOV14_INCLUDE_ORDINARY: 'true'
        run: node tests/nov14-published-chain.e2e.mjs
      - name: Eleven real role cabinets RU EN ZH desktop/mobile on isolated SH59
        id: full_matrix
        if: ${{ inputs.full_suite == true }}
        continue-on-error: true
        env:
          QA_BROWSER_MATRIX: 'true'
          QA_BROWSER_EVIDENCE_DIR: reports/carrier124-full-roles
        run: node tests/task12-isolated-browser.e2e.mjs
      - name: Verify multilingual matrix screenshot hashes are present before archiving
        id: matrix_screenshots
        if: ${{ inputs.full_suite == true }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          import {readFileSync} from 'node:fs';
          const result=JSON.parse(readFileSync('reports/carrier124-full-roles/browser-results-all.json','utf8'));
          let checked=0;
          for(const role of result.roles||[]){
            assert.equal(role.status,'PASS','Role cabinet not PASS: '+role.actor);
            for(const row of role.cabinetMatrix||[]){
              assert.ok(row.screenshot?.startsWith('reports/isolated-rc/'),'Unexpected screenshot path: '+row.screenshot);
              const digest=createHash('sha256').update(readFileSync(row.screenshot)).digest('hex');
              assert.equal(digest,row.screenshotSha256,'Screenshot hash mismatch: '+row.screenshot);
              checked++;
            }
          }
          assert.ok(checked>=96,'Missing multilingual matrix screenshot evidence: '+checked+' < 96');
          console.log('ROLE_MATRIX_SCREENSHOT_SHA256_PASS count='+checked);
          NODE
      - name: Run MAP50 with real provider and pinned isolated assets
        id: map50
        if: ${{ inputs.full_suite == true }}
        continue-on-error: true
        env:
          QA_BROWSER_EVIDENCE_DIR: reports/carrier124-map50
          QA_MAP50: 'true'
          QA_MAP_ORDER: QA-MAP50-${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {carrier124Base} from './tests/carrier124-isolated-target.mjs';
          const r=await fetch(carrier124Base+'/health',{redirect:'error',signal:AbortSignal.timeout(15000)});
          assert.equal(r.status,200);
          const {shipmentGeocoder}=await r.json();
          assert.equal(shipmentGeocoder?.provider,'local-gazetteer','REQUIRES_LOCAL_OFFLINE_CATALOG');
          assert.equal(shipmentGeocoder?.configured,true,'LOCAL_CATALOG_NOT_CONFIGURED');
          assert.equal(shipmentGeocoder?.requiresExternalKey,false,'UNAUTHORIZED_EXTERNAL_GEOCODER_DEPENDENCY');
          assert.ok(['partial','complete'].includes(shipmentGeocoder?.coverage),'MISSING_CATALOG_COVERAGE_ATTESTATION');
          NODE
          QA_BROWSER_ACTORS=owner QA_BROWSER_CREATE=true node tests/task12-isolated-browser.e2e.mjs
          QA_BROWSER_ACTORS=carrierA,carrierB QA_BROWSER_BID=true node tests/task12-isolated-browser.e2e.mjs
          QA_BROWSER_ACTORS=owner QA_BROWSER_SELECT=true node tests/task12-isolated-browser.e2e.mjs
          winner=$(node -p "require('./reports/carrier124-map50/browser-results-owner.json').roles[0].selection.winnerActor")
          test "$winner" = carrierA || test "$winner" = carrierB
          QA_BROWSER_ACTORS="$winner" QA_BROWSER_ACCEPT=true node tests/task12-isolated-browser.e2e.mjs
          QA_BROWSER_ACTORS=owner QA_MAP_GEOCODES=true node tests/task12-isolated-browser.e2e.mjs
          QA_BROWSER_ACTORS="$winner" QA_MAP_GEOCODES=true node tests/task12-isolated-browser.e2e.mjs
          QA_BROWSER_ACTORS=ved QA_MAP_GEOCODES=true node tests/task12-isolated-browser.e2e.mjs
      - name: Verify Owner archives, support and process editor in the real browser
        id: alignment_owner
        if: ${{ inputs.full_suite == true }}
        continue-on-error: true
        env:
          QA_BROWSER_ALIGNMENT: 'true'
          QA_BROWSER_ACTORS: owner
          QA_BROWSER_EVIDENCE_DIR: reports/isolated-rc
        run: node tests/task12-isolated-browser.e2e.mjs
      - name: Verify all ten non-Owner roles are denied private archives
        id: alignment_denials
        if: ${{ inputs.full_suite == true && steps.alignment_owner.outcome == 'success' }}
        continue-on-error: true
        env:
          QA_BROWSER_ALIGNMENT: 'true'
          QA_BROWSER_ACTORS: carrierA,carrierB,ved,logistic,supplier,supplierB,designer,content,purchasing,certification
          QA_BROWSER_EVIDENCE_DIR: reports/isolated-rc
        run: node tests/task12-isolated-browser.e2e.mjs
      - name: Verify addressed Logistic upload, completion and VED separation
        id: logistic_security
        if: ${{ inputs.full_suite == true && steps.map50.outcome == 'success' }}
        continue-on-error: true
        env:
          QA_BROWSER_LOGISTIC_SECURITY: 'true'
          QA_BROWSER_ACTORS: logistic
          QA_BROWSER_EVIDENCE_DIR: reports/isolated-rc
        run: node tests/task12-isolated-browser.e2e.mjs
      - name: Verify the previous UI can read the new API for rollback
        id: rollback_ui
        if: ${{ inputs.full_suite == true }}
        continue-on-error: true
        run: node tests/production-previous-ui-compatibility.e2e.mjs
      - name: Verify required fields, late rates, tender and session policy through the pinned API
        id: full_business_api
        if: ${{ inputs.full_suite == true }}
        continue-on-error: true
        env:
          QA_BROWSER_EVIDENCE_DIR: reports/isolated-rc
        run: node tests/task12-business-api.e2e.mjs
      - name: Verify live cross-role security against isolated requests
        id: security
        if: ${{ inputs.full_suite == true && steps.full_business_api.outcome == 'success' }}
        continue-on-error: true
        run: node tests/security-gate-real.e2e.mjs
      - name: Verify sea, air and multimodal tracking in the real browser
        id: transport_modes
        if: ${{ inputs.full_suite == true && steps.full_business_api.outcome == 'success' }}
        continue-on-error: true
        env:
          QA_BROWSER_MODE_MATRIX: 'true'
          QA_BROWSER_ACTORS: carrierA
          QA_BROWSER_EVIDENCE_DIR: reports/isolated-rc
        run: node tests/task12-isolated-browser.e2e.mjs
      - name: Download the finalized tender PDF and validate the exact server values
        id: tender_pdf
        if: ${{ inputs.full_suite == true && steps.full_business_api.outcome == 'success' }}
        continue-on-error: true
        env:
          QA_BROWSER_TENDER: 'true'
          QA_BROWSER_ACTORS: owner
          QA_BROWSER_EVIDENCE_DIR: reports/isolated-rc
        run: node tests/task12-isolated-browser.e2e.mjs
      - name: Authorized Service Level policy boundaries (T2-24)
        id: sl_bounds
        continue-on-error: true
        env:
          QA_BROWSER_EVIDENCE_DIR: reports/carrier124-remaining
        run: node tests/carrier124-remaining-fixtures.e2e.mjs sl
      - name: Log out all issued synthetic sessions
        if: always()
        run: node tests/carrier124-ci-auth.mjs --logout
      - name: Disable 11 QA accounts, revoke remaining sessions and close leases
        id: cleanup
        if: always()
        continue-on-error: true
        run: node tests/carrier124-ci-oidc-bindings.mjs --finish
      - name: Resume cleanup for the leases the broker has not confirmed
        id: cleanup_resume
        if: always() && steps.cleanup.outcome == 'failure'
        run: node tests/carrier124-ci-oidc-bindings.mjs --finish
      - name: Fail closed unless real API, browser and credential cleanup all succeed
        if: always()
        shell: bash
        run: |
          failed=0
          require_pass() {
            if [ "$2" != success ]; then
              echo "::error::$1 returned $2"
              failed=1
            fi
          }

          require_pass issued '${{ steps.issued.outcome }}'
          require_pass authenticated '${{ steps.authenticated.outcome }}'
          require_pass fixture_recovery '${{ steps.fixture_recovery.outcome }}'
          require_pass business '${{ steps.business.outcome }}'
          require_pass auth_isolation '${{ steps.auth_isolation.outcome }}'
          require_pass browser '${{ steps.browser.outcome }}'
          require_pass sl_bounds '${{ steps.sl_bounds.outcome }}'
          if [ '${{ steps.cleanup.outcome }}' != success ]; then
            require_pass cleanup_resume '${{ steps.cleanup_resume.outcome }}'
          fi

          if [ '${{ inputs.full_suite }}' = true ]; then
            require_pass full_lifecycle '${{ steps.full_lifecycle.outcome }}'
            require_pass full_matrix '${{ steps.full_matrix.outcome }}'
            require_pass matrix_screenshots '${{ steps.matrix_screenshots.outcome }}'
            require_pass map50 '${{ steps.map50.outcome }}'
            require_pass alignment_owner '${{ steps.alignment_owner.outcome }}'
            require_pass alignment_denials '${{ steps.alignment_denials.outcome }}'
            require_pass logistic_security '${{ steps.logistic_security.outcome }}'
            require_pass rollback_ui '${{ steps.rollback_ui.outcome }}'
            require_pass full_business_api '${{ steps.full_business_api.outcome }}'
            require_pass security '${{ steps.security.outcome }}'
            require_pass transport_modes '${{ steps.transport_modes.outcome }}'
            require_pass tender_pdf '${{ steps.tender_pdf.outcome }}'
          fi
          test "$failed" = 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: carrier124-oidc-sh59-redacted-evidence
          path: |
            reports/carrier124-ci-pair.json
            reports/carrier124-ci-qa-auth.json
            reports/carrier124-ci-cleanup.json
            reports/carrier124-ci-business.json
            reports/carrier124-published-browser/
            reports/carrier124-full-roles/
            reports/carrier124-remaining/
            reports/isolated-rc/
            reports/carrier124-map50/
            reports/nov14-published/
            reports/nov14-ordinary/
            !reports/**/*-failure.txt
            !reports/**/*-failure.png
          retention-days: 14
