name: SH59 reviewed process maps (QA candidate only)
on:
  pull_request:
    paths:
      - 'test/business-process-model.json'
      - 'scripts/build-process-maps.mjs'
      - '.github/workflows/sh59-reviewed-process-maps.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: sh59-reviewed-process-maps
  cancel-in-progress: false
jobs:
  reviewed-model:
    if: >-
      github.repository == 'hakaru4i-afk/freight-quotes-web' &&
      ((github.event_name == 'pull_request' &&
        github.event.pull_request.number == 145 &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.head.ref == 'ci/sh59-verified-source-handoff-20261121') ||
       (github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/ci/sh59-verified-source-handoff-20261121'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/sh59-verified-source-handoff-20261121
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify reviewed Carrier #124 terminal-state delta, exact one source and backend lock
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/carrier-winner-status-unit.test.mjs tests/map-geocode-fallback.test.mjs
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          import {sourceSignatures} from './scripts/build-process-maps.mjs';
          const model=JSON.parse(readFileSync('test/business-process-model.json','utf8'));
          const manifest=JSON.parse(readFileSync('test/staging-manifest.json','utf8'));
          assert.equal(model.version,'20261121-logic-14');
          assert.equal(model.previousVersion,'20261121-logic-13');
          assert.equal(model.releaseStatus,'RELEASE_BLOCKED');
          assert.equal(model.reviewedBackendSourceCommit,manifest.backendSourceCommit);
          const p1=model.processes.find(p=>p.id==='P01'),p5=model.processes.find(p=>p.id==='P05');
          assert.ok(p1?.actual.includes('неподтверждённой улицей/домом'));
          assert.ok(p5?.risks.includes('city/approximate'));
          assert.ok(model.decisions.some(d=>d.includes('21.11 MAP50 candidate review')));
          assert.ok(model.decisions.some(d=>d.includes('21.11 Carrier #124 candidate review')));
          const p2=model.processes.find(p=>p.id==='P02'),p3=model.processes.find(p=>p.id==='P03');
          assert.ok(p2?.actual.includes('итог раунда имеет приоритет'));
          assert.ok(p3?.actual.includes('статус «Победитель»'));
          const actual=sourceSignatures();
          const changed=Object.keys(actual).filter(path=>actual[path]!==model.reviewedSourceSignatures?.[path]).sort();
          const reviewedPaths=['test/app.js'];
          const reviewedBefore='da479a1f3e898ebadd8c9321adcbf8280658e289ae3585ec86738094e67db986';
          const reviewedAfter='beedda737fdbb2e95e2cccc0eca2ce5a41d4fe37a1cc5d3c2877242bf4a304b9';
          if(changed.length===0){
            assert.equal(model.reviewedSourceSignatures['test/app.js'],reviewedAfter,
              'No changes are expected only when reviewed Carrier state model is already generated');
            console.log('REVIEWED_CARRIER124_ALREADY_CURRENT');
          } else {
            assert.deepEqual(changed,reviewedPaths,
              'Unreviewed source changed; abort instead of auto-signing');
            assert.equal(model.reviewedSourceSignatures['test/app.js'],reviewedBefore);
          }
          assert.equal(actual['test/app.js'],reviewedAfter);
          const carrier=readFileSync('test/app.js','utf8');
          assert.match(carrier,/selected:"Победитель"/);
          assert.match(carrier,/n\.round_result==="winner"/);
          assert.match(carrier,/n\.lifecycle_state==="annulled"/);
          const expectedBlob=execFileSync('git',['hash-object','test/global-view/route-model.mjs'],{encoding:'utf8'}).trim().slice(0,12);
          for(const p of ['test/global-view/map.mjs','test/global-view/globe.mjs']){
            assert.match(readFileSync(p,'utf8'),new RegExp('route-model\\.mjs\\?v='+expectedBlob));
          }
          assert.equal(readFileSync('global-view/route-model.mjs','utf8'),readFileSync('test/global-view/route-model.mjs','utf8'));
          assert.equal(readFileSync('global-view/view.mjs','utf8'),readFileSync('test/global-view/view.mjs','utf8'));
          console.log('REVIEWED_CARRIER124_DELTA_CONFIRMED:',changed.join(', '));
          JS
      - name: Preserve old process version, regenerate reviewed diagrams, fail closed on drift
        id: record
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-process-maps.mjs --record-reviewed-sources
          node scripts/build-process-maps.mjs --check
          git diff --name-only | while IFS= read -r path; do
            case "$path" in
              test/business-process-model.json|test/business-process-current.svg|test/business-process-current.drawio|test/process-map.html|test/processes/*|test/process-history/*) ;;
              "") ;;
              *) echo "::error::Unexpected path changed by process generator: $path"; exit 1 ;;
            esac
          done
          git add test/business-process-model.json test/business-process-current.svg \
            test/business-process-current.drawio test/process-map.html test/processes \
            test/process-history
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "REVIEWED_MAPS_ALREADY_CURRENT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "docs(process): regenerate reviewed SH59 MAP50 diagrams and archive previous process version"
          git push origin HEAD:refs/heads/ci/sh59-verified-source-handoff-20261121
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo 'REVIEWED_MAP50_PROCESS_MAPS_GENERATED; PRODUCTION_UNCHANGED'
      - name: Trigger exact source and release regression on regenerated candidate
        if: steps.record.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run sh59-process-source-coherence.yml --ref ci/sh59-verified-source-handoff-20261121
          gh workflow run release-stabilization.yml --ref ci/sh59-verified-source-handoff-20261121
          echo 'Source coherence and release regression dispatched; runtime-pair gate remains active'
