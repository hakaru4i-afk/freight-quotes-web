name: Staging anonymous access denial
on:
  push:
    branches: [main]
    paths: ['tests/qa-anonymous-roles.test.mjs', '.github/workflows/qa-anonymous-api.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  anonymous-denied:
    runs-on: [self-hosted, macOS, ARM64, freight-mac-qa]
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          package-manager-cache: false
          node-version: '24'
      - name: Anonymous read, write and preview-spoof denial against staging API
        run: node --test tests/qa-anonymous-roles.test.mjs
