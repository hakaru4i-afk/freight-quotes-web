name: Emergency chat contrast only
run-name: Owner-approved emergency chat UI #217 + #219
on:
  push:
    branches: [main]
    paths: ['.github/workflows/chat-contrast-emergency-20261126.yml']
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Owner approval: chat UI only, no API or data changes'
        required: true
        type: choice
        options: ['CHAT CSS ONLY']
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: owner-portal-production-release
  cancel-in-progress: false
jobs:
  publish:
    if: >-
      github.repository == 'hakaru4i-afk/freight-quotes-web' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'hakaru4i-afk' &&
      github.triggering_actor == 'hakaru4i-afk' &&
      ((github.event_name == 'push' && github.event.head_commit.message == 'release(owner): emergency chat UI #217 and #219') ||
      (github.event_name == 'workflow_dispatch' && inputs.confirmation == 'CHAT CSS ONLY'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: github-pages
      url: https://hakaru4i-afk.github.io/freight-quotes-web/
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Download exact previously deployed staging Pages artifact
        uses: actions/download-artifact@v7
        with:
          name: locked-staging-pages-attempt-1
          run-id: 45778306459
          github-token: ${{ github.token }}
          path: verified-pages-archive
      - name: Unpack known verified public Pages artifact
        run: |
          set -euo pipefail
          mkdir verified-pages
          tar -tf verified-pages-archive/artifact.tar | head -n 5 || true
          tar --no-same-owner --no-same-permissions -xf verified-pages-archive/artifact.tar -C verified-pages
          test -f verified-pages/test/app.js
      - name: Validate approved CSS and unchanged live inventory
        run: |
          node scripts/build-css-bundle.mjs --check
          node --check scripts/release/chat-contrast-emergency-20261126.mjs
          node --check lw-ved-shared-chat-20261109.js
          node scripts/release/chat-contrast-emergency-20261126.mjs prepare
      - name: Browser contrast check in all cabinet roles and four chat surfaces
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          node --input-type=module <<'NODE'
          import {chromium} from 'playwright';
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const browser=await chromium.launch({headless:true});
          try{
            const page=await browser.newPage();
            for(const role of ['owner','carrier','logistic','supplier','designer','content','purchasing','certification']){
              for(const width of [1440,390]){
                await page.setViewportSize({width,height:844});
                await page.setContent('<div id="root"><div class="cabinet-app staff-portal lw-cc-active" data-cabinet-role="'+role+'"><div class="cabinet-panel"><div class="chat-workspace"><div class="chat-thread"><article class="chat-message"><p>Incoming</p></article><article class="chat-message own"><p>Outgoing</p></article><div class="chat-composer"><label>Message</label><textarea>Draft</textarea></div></div></div><div class="lw-ved-chat-layout"><article class="lw-ved-chat-message"><p>VED</p></article></div><div class="sw-chat-messages"><article><p>Supplier</p></article></div><div class="t2-chat"><p>Execution</p></div></div></div></div>');
                await page.addStyleTag({content:readFileSync('.chat-pages/bundle.css','utf8')});
                const values=await page.locator('.chat-message p,.chat-composer label,.chat-composer textarea,.lw-ved-chat-message p,.sw-chat-messages p,.t2-chat p').evaluateAll(es=>es.map(e=>{const s=getComputedStyle(e);return [s.color,s.webkitTextFillColor]}));
                assert.equal(values.length,7);
                for(const [color,fill] of values){assert.equal(color,'rgb(24, 52, 79)',role+' '+width);assert.equal(fill,color);}
              }
            }
          }finally{await browser.close()}
          console.log('CHAT_CONTRAST_BROWSER_FIXTURE_PASS');
          NODE
      - name: Preserve previous verified Pages artifact
        uses: actions/upload-artifact@v6
        with:
          name: chat-before
          path: .chat-before/
          include-hidden-files: true
          retention-days: 7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .chat-pages
      - uses: actions/deploy-pages@v5
        id: deploy
      - name: Verify published chat CSS and preserved staging
        id: verify
        run: node scripts/release/chat-contrast-emergency-20261126.mjs verify
      - name: Prepare rollback artifact if public verification failed
        if: failure() && steps.deploy.outcome == 'success' && steps.verify.outcome == 'failure'
        uses: actions/upload-pages-artifact@v5
        with:
          name: chat-rollback
          path: .chat-before
      - name: Restore previous verified Pages on readback failure
        if: failure() && steps.deploy.outcome == 'success' && steps.verify.outcome == 'failure'
        uses: actions/deploy-pages@v5
        with:
          artifact_name: chat-rollback
