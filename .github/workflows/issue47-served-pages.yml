name: Issue47 served Pages and API smoke (staging)
on:
  pull_request:
    paths:
      - 'test/**'
      - 'tests/issue47-served-pages.test.mjs'
      - '.github/workflows/issue47-served-pages.yml'
  push:
    branches: [main]
    paths:
      - 'test/**'
      - 'tests/issue47-served-pages.test.mjs'
      - '.github/workflows/issue47-served-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-served-pages:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: deployed-baseline
      - name: Verify exact served staging build and API
        env:
          QA_SERVED_EXPECTED_DIR: ${{ github.event_name == 'pull_request' && 'deployed-baseline' || '.' }}
        run: node --test tests/issue47-served-pages.test.mjs
