name: Issue49 staging-only regression
on:
  pull_request:
    paths: ['test/**', 'tests/issue49-staging-check.test.mjs', '.github/workflows/issue49-staging-check.yml']
  push:
    branches: [fix/issue49-staging-pages]
permissions:
  contents: read
jobs:
  check-staging-bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check test/app.js
      - run: node --test tests/issue49-staging-check.test.mjs
