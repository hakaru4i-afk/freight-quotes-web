name: Issue47 carrier Excel XLSX template regression
on:
  push:
    branches: [main]
    paths:
      - 'test/task2-guidance.js'
      - 'test/carrier-csv-wps-hotfix.js'
      - 'tests/issue47-carrier-xlsx.test.mjs'
      - 'tests/issue47-insurance-excel-import.test.mjs'
      - '.github/workflows/issue47-excel-qa.yml'
  workflow_dispatch:
jobs:
  validate-xlsx:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate native XLSX export, field columns, and carrier Excel UI
        run: node --test tests/issue47-carrier-xlsx.test.mjs tests/issue47-insurance-excel-import.test.mjs
      - name: Validate Excel using independent Python ZIP and XML readers
        run: |
          python3 - <<'PY'
          import zipfile, xml.etree.ElementTree as ET
          path = "/tmp/issue47-carrier-generated.xlsx"
          with zipfile.ZipFile(path) as book:
              print("archive contents:", book.namelist())
              bad = book.testzip()
              if bad: raise RuntimeError("Invalid ZIP CRC for " + bad)
              for part in book.namelist():
                  if part.endswith(".xml") or part.endswith(".rels") or part == "[Content_Types].xml":
                      ET.fromstring(book.read(part))
              sheet = ET.fromstring(book.read("xl/worksheets/sheet1.xml"))
              ns = {"s":"http://schemas.openxmlformats.org/spreadsheetml/2006/main"}
              cells = [c.attrib["r"] for c in sheet.findall(".//s:c", ns)]
              assert cells == ["A1","B1","C1","D1","E1","A2","B2","C2","D2","E2"], cells
              print("Independent workbook integrity and distinct columns PASS")
          PY
      - name: Confirm GitHub Pages serves the new Excel interface
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const base='https://hakaru4i-afk.github.io/freight-quotes-web/test/';
          let ok=false;
          for(let i=0;i<20;i++){
            const stamp=Date.now();
            try{
              const [html,guide,codec]=await Promise.all([
                fetch(base+'index.html?qa='+stamp,{cache:'no-store'}).then(r=>r.text()),
                fetch(base+'task2-guidance.js?qa='+stamp,{cache:'no-store'}).then(r=>r.text()),
                fetch(base+'carrier-csv-wps-hotfix.js?qa='+stamp,{cache:'no-store'}).then(r=>r.text())
              ]);
              if(html.includes('task2-guidance.js?v=66cb31663137') &&
                 html.includes('carrier-csv-wps-hotfix.js?v=1e867d941474') &&
                 guide.includes('Скачать Excel-шаблон') &&
                 guide.includes('freight-form-') &&
                 codec.includes('window.freightXlsxInterop=Object.freeze({makeXlsx,unzip,xlsxToCsv})')){
                console.log('PASS published staging includes native XLSX download/import modules');
                ok=true;break;
              }
            }catch(e){console.log('Published probe: '+e.message)}
            await new Promise(r=>setTimeout(r,5000));
          }
          assert.ok(ok,'Published staging does not yet match Excel template build');
          NODE
