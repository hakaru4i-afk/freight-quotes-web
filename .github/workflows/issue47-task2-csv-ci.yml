name: Issue47 staging CSV and completion regression
on:
  push:
    branches: [main]
    paths:
      - 'test/task2-panel.js'
      - 'tests/issue47-task2-csv.test.mjs'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  regression:
    runs-on: [self-hosted, macOS, ARM64, freight-mac-qa]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check test/task2-panel.js
      - run: node --test tests/issue47-task2-csv.test.mjs
