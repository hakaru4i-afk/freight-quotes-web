name: Issue47 staging CSV and completion regression
on:
  pull_request:
    paths:
      - 'test/task2-panel.js'
      - 'tests/issue47-task2-csv.test.mjs'
      - '.github/workflows/issue47-task2-csv-ci.yml'
  push:
    branches: [main]
    paths:
      - 'test/task2-panel.js'
      - 'tests/issue47-task2-csv.test.mjs'
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check test/task2-panel.js
      - run: node --test tests/issue47-task2-csv.test.mjs
