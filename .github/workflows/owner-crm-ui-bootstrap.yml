name: CRM Owner release UI bootstrap (one time, no private token)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/owner-crm-ui-bootstrap.yml
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: owner-crm-pages-bootstrap
  cancel-in-progress: false
jobs:
  publish-owner-ui:
    if: "${{ github.repository == 'hakaru4i-afk/freight-quotes-web' && github.ref == 'refs/heads/main' && github.event.head_commit.message == 'fix(crm): publish UI via free GitHub runner' }}"
    # A standard GitHub-hosted runner is free in this public UI repository.
    # This one-time publication needs no Mac or Linux VM administered by the Owner.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: https://hakaru4i-afk.github.io/freight-quotes-web/
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check approved Owner UI source and current production identity
        shell: bash
        run: |
          set -euo pipefail
          cmp test/portal-feedback-center-20261107.js release/owner-portal-feedback-center-20261122.js
          node --check test/portal-feedback-center-20261107.js
          node --check scripts/release/owner-portal-pages.mjs
          node --test tests/owner-portal-one-click-release.test.mjs tests/owner-ci-release-control.test.mjs
          # Live production bytes are verified and retained by the packaging step below.
          echo CRM_BOOTSTRAP_SOURCE_CHECK_PASS
      - name: Build production Pages with new Owner UI and unchanged API
        shell: bash
        env:
          PORTAL_RELEASE_VERSION: SH-01.30.61 v
          PORTAL_BACKEND_SHA: 54ffad8ebf007f11a34b11fcf3d0c150caa00ab7
        run: |
          set -euo pipefail
          node scripts/release/owner-portal-pages.mjs
          node --check scripts/release/owner-ui-live-bootstrap.mjs
          node scripts/release/owner-ui-live-bootstrap.mjs
          cmp .release-pages/portal-feedback-center-20261107.js release/owner-portal-feedback-center-20261122.js
          cmp .release-pages/test/portal-feedback-center-20261107.js release/owner-portal-feedback-center-20261122.js
          node --check .release-pages/portal-feedback-center-20261107.js
          echo CRM_OWNER_UI_PAGES_BUILD_PASS
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .release-pages
      - uses: actions/deploy-pages@v4
      - name: Confirm actual served Owner button JS, do not infer deployment from green build
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --location --max-time 25               "https://hakaru4i-afk.github.io/freight-quotes-web/portal-feedback-center-20261107.js?crm-bootstrap=$GITHUB_RUN_ID-$attempt"               -o "$RUNNER_TEMP/served-owner-ui.js" &&
              cmp -s "$RUNNER_TEMP/served-owner-ui.js" release/owner-portal-feedback-center-20261122.js; then
              echo CRM_OWNER_UI_PRODUCTION_PUBLISHED_VERIFIED
              exit 0
            fi
            sleep 6
          done
          echo "::error::CRM_OWNER_UI_PRODUCTION_NOT_UPDATED"
          exit 1
