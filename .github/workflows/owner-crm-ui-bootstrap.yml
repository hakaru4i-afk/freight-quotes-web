name: CRM Owner release UI bootstrap (one time, no private token)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/owner-crm-ui-bootstrap.yml
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: owner-crm-pages-bootstrap
  cancel-in-progress: false
jobs:
  publish-owner-ui:
    if: "${{ github.repository == 'hakaru4i-afk/freight-quotes-web' && github.ref == 'refs/heads/main' && github.event.head_commit.message == 'fix(crm): ship Mac-compatible Pages package' }}"
    runs-on: [self-hosted, macOS, ARM64, freight-mac-qa]
    timeout-minutes: 25
    environment:
      name: github-pages
      url: https://hakaru4i-afk.github.io/freight-quotes-web/
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check approved Owner UI source and current production identity
        shell: bash
        run: |
          set -euo pipefail
          cmp test/portal-feedback-center-20261107.js release/owner-portal-feedback-center-20261122.js
          node --check test/portal-feedback-center-20261107.js
          node --check scripts/release/owner-portal-pages.mjs
          node --test tests/owner-portal-one-click-release.test.mjs tests/owner-ci-release-control.test.mjs
          # Live production bytes are verified and retained by the packaging step below.
          echo CRM_BOOTSTRAP_SOURCE_CHECK_PASS
      - name: Build production Pages with new Owner UI and unchanged API
        shell: bash
        env:
          PORTAL_RELEASE_VERSION: SH-01.30.61 v
          PORTAL_BACKEND_SHA: 54ffad8ebf007f11a34b11fcf3d0c150caa00ab7
        run: |
          set -euo pipefail
          node scripts/release/owner-portal-pages.mjs
          node --check scripts/release/owner-ui-live-bootstrap.mjs
          node scripts/release/owner-ui-live-bootstrap.mjs
          cmp .release-pages/portal-feedback-center-20261107.js release/owner-portal-feedback-center-20261122.js
          cmp .release-pages/test/portal-feedback-center-20261107.js release/owner-portal-feedback-center-20261122.js
          node --check .release-pages/portal-feedback-center-20261107.js
          echo CRM_OWNER_UI_PAGES_BUILD_PASS
      - uses: actions/configure-pages@v5
      - name: Provide a verified tar archiver for GitHub Pages on Mac
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/crm-bin"
          cat > "$RUNNER_TEMP/crm-bin/gtar" <<'PY'
          #!/usr/bin/env python3
          import os,sys,tarfile
          args=sys.argv[1:]
          directory=None; output=None; exclude=[]; i=0
          while i<len(args):
              flag=args[i]
              if flag=='--directory':
                  i+=1; directory=args[i]
              elif flag=='-cvf':
                  i+=1; output=args[i]
              elif flag.startswith('--exclude='):
                  exclude.append(flag.partition('=')[2])
              elif flag in ('--dereference','--hard-dereference','.', '-v'):
                  pass
              else:
                  raise SystemExit('UNSUPPORTED_GTAR_ARGUMENT:'+flag)
              i+=1
          if not directory or not output:
              raise SystemExit('PAGES_ARCHIVE_INPUT_MISSING')
          directory=os.path.realpath(directory)
          count=0
          with tarfile.open(output,'w',format=tarfile.GNU_FORMAT,dereference=True) as archive:
              for folder,subdirs,files in os.walk(directory,followlinks=False):
                  subdirs[:]=sorted(n for n in subdirs if not n.startswith('.'))
                  for name in sorted(files):
                      if name.startswith('.'): continue
                      full=os.path.join(folder,name)
                      if os.path.islink(full):
                          raise SystemExit('PAGES_ARCHIVE_SYMLINK_FORBIDDEN')
                      rel=os.path.relpath(full,directory).replace(os.sep,'/')
                      archive.add(full,arcname='./'+rel,recursive=False)
                      count+=1
          print('CRM_PAGES_ARCHIVE_OK files='+str(count)+' bytes='+str(os.stat(output).st_size))
          PY
          chmod 755 "$RUNNER_TEMP/crm-bin/gtar"
          "$RUNNER_TEMP/crm-bin/gtar" --directory .release-pages -cvf "$RUNNER_TEMP/crm-archive-probe.tar" --exclude=.git .
          rm -f "$RUNNER_TEMP/crm-archive-probe.tar"
          echo "$RUNNER_TEMP/crm-bin" >> "$GITHUB_PATH"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .release-pages
      - uses: actions/deploy-pages@v4
      - name: Confirm actual served Owner button JS, do not infer deployment from green build
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --location --max-time 25               "https://hakaru4i-afk.github.io/freight-quotes-web/portal-feedback-center-20261107.js?crm-bootstrap=$GITHUB_RUN_ID-$attempt"               -o "$RUNNER_TEMP/served-owner-ui.js" &&
              cmp -s "$RUNNER_TEMP/served-owner-ui.js" release/owner-portal-feedback-center-20261122.js; then
              echo CRM_OWNER_UI_PRODUCTION_PUBLISHED_VERIFIED
              exit 0
            fi
            sleep 6
          done
          echo "::error::CRM_OWNER_UI_PRODUCTION_NOT_UPDATED"
          exit 1
