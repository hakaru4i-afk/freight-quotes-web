name: Carrier acceptance singleton / staging
on:
  push:
    branches: [main]
    paths:
      - test/carrier-acceptance-workflow-20261107.js
      - test/index.html
      - tests/carrier-acceptance-singleton-browser.test.mjs
      - .github/workflows/carrier-acceptance-singleton.yml
  pull_request:
    paths:
      - test/carrier-acceptance-workflow-20261107.js
      - test/index.html
      - tests/carrier-acceptance-singleton-browser.test.mjs
      - .github/workflows/carrier-acceptance-singleton.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    if: >-
      (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == 'hakaru4i-afk'))
    runs-on: [self-hosted, macOS, ARM64, freight-mac-qa]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: Syntax check
        run: |
          set -euo pipefail
          node --check test/carrier-acceptance-workflow-20261107.js
          node --check tests/carrier-acceptance-singleton-browser.test.mjs
          
  served:
    if: >-
      (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == 'hakaru4i-afk')) &&
      github.event_name != 'pull_request'
    needs: source
    runs-on: [self-hosted, macOS, ARM64, freight-mac-qa]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify served script and HTML cache key on staging only
        shell: bash
        run: |
          set -euo pipefail
          SCRIPT_SHA=$(git hash-object test/carrier-acceptance-workflow-20261107.js)
          BASE="https://hakaru4i-afk.github.io/freight-quotes-web/test"
          for attempt in {1..12}; do
            curl -fsSL --max-time 16 -H 'Cache-Control: no-cache' "$BASE/index.html?qa=$GITHUB_SHA" -o /tmp/accept-index.html || true
            curl -fsSL --max-time 16 -H 'Cache-Control: no-cache' "$BASE/carrier-acceptance-workflow-20261107.js?qa=$GITHUB_SHA" -o /tmp/accept-workflow.js || true
            if grep -Fq "carrier-acceptance-workflow-20261107.js?v=${SCRIPT_SHA:0:12}" /tmp/accept-index.html 2>/dev/null \
              && cmp -s test/carrier-acceptance-workflow-20261107.js /tmp/accept-workflow.js; then
              echo 'PASS: staging has exact singleton workflow and updated cache key'
              shasum -a 256 /tmp/accept-workflow.js
              exit 0
            fi
            sleep 15
          done
          echo '::error::Staging script has not been published byte-for-byte'
          exit 1
          
  browser:
    needs: source
    if: >-
      (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == 'hakaru4i-afk'))
    runs-on: [self-hosted, macOS, ARM64, freight-mac-qa]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
      - name: "Chromium desktop and 390px: no duplicate panels or accept actions"
        run: node --test tests/carrier-acceptance-singleton-browser.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: carrier-singleton-desktop-mobile
          path: carrier-acceptance-singleton-*.png
          if-no-files-found: ignore
