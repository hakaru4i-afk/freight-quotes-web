name: Legacy optional frontend quick checks on Mac
on:
  workflow_dispatch:
    inputs:
      task_id:
        required: true
        type: string
      request_id:
        required: true
        type: string
      frontend_sha:
        required: true
        type: string
      backend_sha:
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: owner-release-preflight-frontend
  cancel-in-progress: false
jobs:
  frontend-source:
    if: github.actor == 'hakaru4i-afk' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, macOS, ARM64, freight-mac-qa]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          package-manager-cache: false
          node-version: '24'
      - name: Verify exact source and owner UI tests
        env:
          INPUTS_JSON: ${{ toJSON(inputs) }}
        run: |
          set -euo pipefail
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict';
          const inputs=JSON.parse(process.env.INPUTS_JSON);
          for(const key of ['task_id','request_id'])assert.match(inputs[key],/^[a-f0-9-]{36}$/i);
          for(const key of ['frontend_sha','backend_sha'])assert.match(inputs[key],/^[a-f0-9]{40}$/i);
          assert.equal(inputs.frontend_sha,process.env.GITHUB_SHA);
          JS
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node --check portal-feedback-center-20261107.js
          node --test tests/owner-portal-one-click-release.test.mjs tests/owner-register-publication.test.mjs tests/owner-ci-release-control.test.mjs
