name: Issue17 document mapping
on:
  pull_request:
    paths: ['test/transport-application*', 'tests/issue17*', '.github/workflows/issue17-document.yml']
  push:
    branches: [main, fix/issue17-compact-document]
    paths: ['test/transport-application*', 'tests/issue17*', '.github/workflows/issue17-document.yml']
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  mapping:
    if: >-
      (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == 'hakaru4i-afk'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          package-manager-cache: false
          node-version: '24'
      - run: node tests/issue17-model.test.mjs
      - run: node --check test/app.js
