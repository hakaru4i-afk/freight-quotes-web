name: Release metadata integrity (read only)
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'site-status.json'
      - 'release-status.json'
      - 'test/site-status.json'
      - 'test/release-status.json'
      - 'index.html'
      - 'test/index.html'
      - 'build-info.json'
      - 'test/build-info.json'
      - 'scripts/sync-release-metadata.py'
      - '.github/workflows/sync-release-metadata.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-metadata-main
  cancel-in-progress: false
jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run release metadata safety regressions
        run: node --test tests/release-metadata-transaction.test.mjs
      - name: Check metadata without committing or publishing
        run: python scripts/sync-release-metadata.py --check
