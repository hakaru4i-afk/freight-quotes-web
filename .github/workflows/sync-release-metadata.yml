name: Release metadata audit (read-only; publication via gated workflow only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: [self-hosted, macOS, ARM64, freight-mac-qa]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          package-manager-cache: false
          node-version: '24'
      - name: Check source files without rewriting production
        run: |
          node --check scripts/check-runtime-parity.mjs
          node --check scripts/stamp-staging-rc.mjs
          node scripts/check-runtime-parity.mjs --allow-staging-candidate
      - name: Confirm no write permission or production promotion
        run: echo "READ_ONLY_AUDIT; SH59 publication requires approved manual workflow"
