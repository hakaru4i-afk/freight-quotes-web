name: Release metadata audit (read-only; publication via gated workflow only)
on:
  pull_request:
    paths:
      - '.github/workflows/sync-release-metadata.yml'
      - '.github/workflows/isolated-qa-oidc-browser.yml'
      - '.github/workflows/isolated-qa-published-browser.yml'
      - 'scripts/release/verify-live-release.mjs'
      - 'tests/verify-live-release.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verifier-tests:
    if: >-
      github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'hakaru4i-afk'
    runs-on: [self-hosted, macOS, ARM64, freight-mac-qa]
    timeout-minutes: 8
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/verify-live-release.test.mjs tests/task12-ci-environment-policy.test.mjs
      - name: Verify GitHub Actions can read the native main-only QA policy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module - <<'JS'
          import {execFileSync} from 'node:child_process';
          import {validateEnvironmentPolicy} from './tests/task12-ci-environment-policy.mjs';
          const base = 'repos/' + process.env.GITHUB_REPOSITORY + '/environments/isolated-qa';
          const get = path => JSON.parse(execFileSync('gh', ['api', path], {encoding: 'utf8'}));
          validateEnvironmentPolicy(get(base), get(base + '/deployment-branch-policies'));
          console.log('QA environment policy verified using the workflow read token');
          JS
  audit:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.actor == 'hakaru4i-afk'
    runs-on: [self-hosted, macOS, ARM64, freight-mac-qa]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check source files without rewriting production
        run: |
          node --check scripts/check-runtime-parity.mjs
          node --check scripts/stamp-staging-rc.mjs
          node scripts/check-runtime-parity.mjs --allow-staging-candidate
      - name: Compare served metadata, checksums and active API deployments
        if: success() || failure()
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/release/verify-live-release.mjs
