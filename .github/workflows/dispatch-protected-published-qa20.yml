name: Verify protected published SH59 QA20 configuration
on:
  pull_request:
    paths:
      - '.github/workflows/dispatch-protected-published-qa20.yml'
      - '.github/workflows/carrier124-main-oidc-smoke.yml'
      - 'tests/task12-published-qa20.e2e.mjs'
permissions:
  contents: read
concurrency:
  group: owner-protected-published-qa20-dispatch
  cancel-in-progress: false
jobs:
  source-validation:
    if: >-
      (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == 'hakaru4i-afk'))
    runs-on: [self-hosted, macOS, ARM64, freight-mac-qa]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          package-manager-cache: false
          node-version: '24'
      - name: Verify published browser harness syntax and immutable-gate assertions
        shell: bash
        run: |
          set -euo pipefail
          node --check tests/task12-published-qa20.e2e.mjs
          node --check tests/carrier124-remaining-api.mjs
          node --test tests/qa20-sl-recovery-guard.test.mjs tests/qa20-protected-run-guard.test.mjs
          node --test tests/qa20-published-proof-contract.test.mjs
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          import assert from 'node:assert/strict';
          const source=readFileSync('tests/task12-published-qa20.e2e.mjs','utf8');
          for(const marker of [
            'PUBLISHED_QA20_BROWSER_REQUIRED',
            'PROTECTED_MAIN_DISPATCH_REQUIRED',
            'PUBLISHED_ASSET_HASH_MISMATCH:',
            'PUBLISHED_QA20_ASSET_PROVENANCE_PASS',
            'SOURCE_APP_DIFFERS_FROM_TESTED_HANDOFF',
            "const functionPrefix='/functions/v1/'+qaFunction"
          ])assert.ok(source.includes(marker),'UNVERIFIED_PUBLISHED_BROWSER_GUARD:'+marker);
          const workflow=readFileSync('.github/workflows/carrier124-main-oidc-smoke.yml','utf8');
          assert.ok(workflow.includes('FREIGHT_PROTECTED_CANDIDATE'));
          assert.ok(workflow.includes('environment: isolated-qa'));
          assert.ok(workflow.includes('git show "$GITHUB_SHA:tests/task12-published-qa20.e2e.mjs"'));
          assert.ok(workflow.includes('QA_BROWSER_PUBLISHED=true'));
          assert.ok(workflow.includes('node tests/carrier124-ci-oidc-bindings.mjs --finish'));
          console.log('PUBLISHED_QA20_FULL_ACCEPTANCE_GUARDS_PASS');
          JS
