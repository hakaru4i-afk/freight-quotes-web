<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title" viewBox="0 0 1280 1135"><title id="title">Назначенные задачи остальных сотрудников</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#53667c"/></marker></defs><g font-family="system-ui,sans-serif" fill="#142c45"><rect x="20" y="0" width="300" height="1135" fill="#f8fafc"/><text x="170" y="34" text-anchor="middle" font-size="18" font-weight="700">Система</text><rect x="330" y="0" width="300" height="1135" fill="#eff6ff"/><text x="480" y="34" text-anchor="middle" font-size="18" font-weight="700">Контент</text><rect x="640" y="0" width="300" height="1135" fill="#f8fafc"/><text x="790" y="34" text-anchor="middle" font-size="18" font-weight="700">Закупки</text><rect x="950" y="0" width="300" height="1135" fill="#eff6ff"/><text x="1100" y="34" text-anchor="middle" font-size="18" font-weight="700">Сертификация</text><text x="30" y="100" font-size="16" font-weight="700">P08 · Назначенные задачи остальных сотрудников</text><path d="M165,275 V297 H475 V319" fill="none" stroke="#53667c" stroke-width="2" marker-end="url(#arrow)"/><text x="170" y="313" font-size="12">Только своя роль / логин</text><path d="M165,275 V297 H785 V509" fill="none" stroke="#53667c" stroke-width="2" marker-end="url(#arrow)"/><text x="170" y="313" font-size="12">Только своя роль / логин</text><path d="M165,275 V297 H1095 V699" fill="none" stroke="#53667c" stroke-width="2" marker-end="url(#arrow)"/><text x="170" y="313" font-size="12">Только своя роль / логин</text><g id="P08-1"><title>Чужие, закрытые и аннулированные скрыты</title><rect x="30" y="135" width="270" height="140" rx="12" fill="white" stroke="#07806d" stroke-width="2"/><text x="45" y="162" font-size="17" font-weight="600">Получить реальные назначения</text><text x="45" y="185" font-size="17" font-weight="600">сессии</text><text x="45" y="238" font-size="13" fill="#35465b">open / in_progress</text><text x="45" y="258" font-size="12" fill="#35465b">P08-1</text></g><g id="P08-2"><title>Только существующие поручения</title><rect x="340" y="325" width="270" height="140" rx="12" fill="white" stroke="#365dad" stroke-width="2"/><text x="355" y="352" font-size="17" font-weight="600">Просмотреть своё назначение</text><text x="355" y="428" font-size="13" fill="#35465b">read-only</text><text x="355" y="448" font-size="12" fill="#35465b">P08-2</text></g><g id="P08-3"><title>Новый workflow не определён</title><rect x="650" y="515" width="270" height="140" rx="12" fill="white" stroke="#365dad" stroke-width="2"/><text x="665" y="542" font-size="17" font-weight="600">Просмотреть своё назначение</text><text x="665" y="618" font-size="13" fill="#35465b">read-only</text><text x="665" y="638" font-size="12" fill="#35465b">P08-3</text></g><g id="P08-4"><title>Новый workflow не определён</title><rect x="960" y="705" width="270" height="140" rx="12" fill="white" stroke="#365dad" stroke-width="2"/><text x="975" y="732" font-size="17" font-weight="600">Просмотреть своё назначение</text><text x="975" y="808" font-size="13" fill="#35465b">read-only</text><text x="975" y="828" font-size="12" fill="#35465b">P08-4</text></g><g id="P08-5"><title>Без новых запросов и изменения полномочий</title><rect x="30" y="895" width="270" height="140" rx="12" fill="white" stroke="#07806d" stroke-width="2"/><text x="45" y="922" font-size="17" font-weight="600">Раскрыть следующие</text><text x="45" y="945" font-size="17" font-weight="600">назначения</text><text x="45" y="998" font-size="13" fill="#35465b">read-only</text><text x="45" y="1018" font-size="12" fill="#35465b">P08-5</text></g></g></svg>
