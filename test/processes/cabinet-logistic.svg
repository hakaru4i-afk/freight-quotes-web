<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title" viewBox="0 0 660 2190"><title id="title">ВЭД / логист</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#53667c"/></marker></defs><g font-family="system-ui,sans-serif" fill="#142c45"><rect x="20" y="0" width="300" height="2190" fill="#f8fafc"/><text x="170" y="34" text-anchor="middle" font-size="18" font-weight="700">Система</text><rect x="330" y="0" width="300" height="2190" fill="#eff6ff"/><text x="480" y="34" text-anchor="middle" font-size="18" font-weight="700">ВЭД / логист</text><text x="30" y="100" font-size="16" font-weight="700">P06 · ВЭД: документы, логисты и общий чат</text><text x="30" y="1345" font-size="16" font-weight="700">P09 · Завершение перевозки</text><path d="M165,275 V297 H475 V319" fill="none" stroke="#53667c" stroke-width="2" marker-end="url(#arrow)"/><text x="170" y="313" font-size="12">После принятия</text><path d="M475,465 V487 H475 V889" fill="none" stroke="#53667c" stroke-width="2" marker-end="url(#arrow)"/><text x="480" y="503" font-size="12">Комплект достаточен</text><path d="M475,465 V487 H475 V509" fill="none" stroke="#53667c" stroke-width="2" marker-end="url(#arrow)"/><text x="480" y="503" font-size="12">Не хватает документов</text><path d="M475,655 V677 H475 V699" fill="none" stroke="#53667c" stroke-width="2" marker-end="url(#arrow)"/><text x="480" y="693" font-size="12">Адресный получатель</text><path d="M475,845 V867 H475 V889" fill="none" stroke="#53667c" stroke-width="2" marker-end="url(#arrow)"/><text x="480" y="883" font-size="12">Файл связан с задачей</text><path d="M475,1035 V1057 H165 V1079" fill="none" stroke="#53667c" stroke-width="2" marker-end="url(#arrow)"/><text x="170" y="1073" font-size="12">Проверка завершена</text><path d="M475,1520 V1542 H165 V1564" fill="none" stroke="#53667c" stroke-width="2" marker-end="url(#arrow)"/><text x="170" y="1558" font-size="12">Условия шага выполнены</text><path d="M165,1710 V1732 H475 V1754" fill="none" stroke="#53667c" stroke-width="2" marker-end="url(#arrow)"/><text x="170" y="1748" font-size="12">Условия шага выполнены</text><path d="M475,1900 V1922 H165 V1944" fill="none" stroke="#53667c" stroke-width="2" marker-end="url(#arrow)"/><text x="170" y="1938" font-size="12">Условия шага выполнены</text><path d="M165,1710 V1732 H475 V1374" fill="none" stroke="#53667c" stroke-width="2" marker-end="url(#arrow)"/><text x="170" y="1748" font-size="12">Условия не выполнены: исправить</text><g id="P06-1"><title>Автоматически либо вручную Owner с обязательным аудитом; без дублей Центры городов и ориентировочная дорожная схема не подтверждают &lt;1000 км. Сохраняются одна задача, согласованный резерв Owner и запрет таможни до проверки.</title><rect x="30" y="135" width="270" height="140" rx="12" fill="white" stroke="#07806d" stroke-width="2"/><text x="45" y="162" font-size="17" font-weight="600">Одна проверка: &lt;1000 км или</text><text x="45" y="185" font-size="17" font-weight="600">подтверждённый резерв</text><text x="45" y="238" font-size="13" fill="#35465b">open</text><text x="45" y="258" font-size="12" fill="#35465b">P06-1</text></g><g id="P06-2"><title>ВЭД; доступ после принятия</title><rect x="340" y="325" width="270" height="140" rx="12" fill="white" stroke="#365dad" stroke-width="2"/><text x="355" y="352" font-size="17" font-weight="600">Проверить документы</text><text x="355" y="428" font-size="13" fill="#35465b">in_progress</text><text x="355" y="448" font-size="12" fill="#35465b">P06-2</text></g><g id="P06-3"><title>Получатель по логину</title><rect x="340" y="515" width="270" height="140" rx="12" fill="white" stroke="#365dad" stroke-width="2"/><text x="355" y="542" font-size="17" font-weight="600">Запросить недостающее</text><text x="355" y="565" font-size="17" font-weight="600">адресно</text><text x="355" y="618" font-size="13" fill="#35465b">ved_request_logistic</text><text x="355" y="638" font-size="12" fill="#35465b">P06-3</text></g><g id="P06-4"><title>Выполняет указанный получатель</title><rect x="340" y="705" width="270" height="140" rx="12" fill="white" stroke="#365dad" stroke-width="2"/><text x="355" y="732" font-size="17" font-weight="600">Загрузить документ в</text><text x="355" y="755" font-size="17" font-weight="600">назначение</text><text x="355" y="808" font-size="13" fill="#35465b">open</text><text x="355" y="828" font-size="12" fill="#35465b">P06-4</text></g><g id="P06-5"><title>Полный корректный комплект → completed и отметка проверки; замечания → существующий чат, прежняя задача in_progress, повторная проверка после исправления. Таможенный запрет сохраняется.</title><rect x="340" y="895" width="270" height="140" rx="12" fill="white" stroke="#365dad" stroke-width="2"/><text x="355" y="922" font-size="17" font-weight="600">Подтвердить комплект либо</text><text x="355" y="945" font-size="17" font-weight="600">направить замечания</text><text x="355" y="998" font-size="13" fill="#35465b">completed</text><text x="355" y="1018" font-size="12" fill="#35465b">P06-5</text></g><g id="P06-6"><title>Реальные сообщения и вложения</title><rect x="30" y="1085" width="270" height="140" rx="12" fill="white" stroke="#07806d" stroke-width="2"/><text x="45" y="1112" font-size="17" font-weight="600">Сохранить общий чат и</text><text x="45" y="1135" font-size="17" font-weight="600">историю</text><text x="45" y="1188" font-size="13" fill="#35465b">pto_checked_at</text><text x="45" y="1208" font-size="12" fill="#35465b">P06-6</text></g><g id="P09-1"><title>Уполномоченный сотрудник; действие Owner или уполномоченного ВЭД, не два последовательных согласования</title><rect x="340" y="1380" width="270" height="140" rx="12" fill="white" stroke="#365dad" stroke-width="2"/><text x="355" y="1407" font-size="17" font-weight="600">Запросить завершение</text><text x="355" y="1483" font-size="13" fill="#35465b">in_progress</text><text x="355" y="1503" font-size="12" fill="#35465b">P09-1</text></g><g id="P09-2"><title>Незавершённое → вернуть ответственному</title><rect x="30" y="1570" width="270" height="140" rx="12" fill="white" stroke="#07806d" stroke-width="2"/><text x="45" y="1597" font-size="17" font-weight="600">Проверить этапы, документы и</text><text x="45" y="1620" font-size="17" font-weight="600">претензии</text><text x="45" y="1673" font-size="13" fill="#35465b">blocked / ready</text><text x="45" y="1693" font-size="12" fill="#35465b">P09-2</text></g><g id="P09-3"><title>Только если номера нет; действие Owner или уполномоченного ВЭД, не два последовательных согласования</title><rect x="340" y="1760" width="270" height="140" rx="12" fill="white" stroke="#365dad" stroke-width="2"/><text x="355" y="1787" font-size="17" font-weight="600">Указать решение по</text><text x="355" y="1810" font-size="17" font-weight="600">контейнеру</text><text x="355" y="1863" font-size="13" fill="#35465b">ready</text><text x="355" y="1883" font-size="12" fill="#35465b">P09-3</text></g><g id="P09-4"><title>Нет автоматического обхода претензии</title><rect x="30" y="1950" width="270" height="140" rx="12" fill="white" stroke="#07806d" stroke-width="2"/><text x="45" y="1977" font-size="17" font-weight="600">Завершить и сохранить</text><text x="45" y="2000" font-size="17" font-weight="600">историю</text><text x="45" y="2053" font-size="13" fill="#35465b">completed</text><text x="45" y="2073" font-size="12" fill="#35465b">P09-4</text></g></g></svg>
