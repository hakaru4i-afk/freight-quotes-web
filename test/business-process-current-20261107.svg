<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1920" viewBox="0 0 1000 1920" role="img" aria-label="Актуальная бизнес-схема логистического портала. Роли: Владелец, Система, Перевозчик. От создания заявки до архива."><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#7190a7"/></marker></defs><rect width="1000" height="1920" fill="#f7fafc"/><text x="95" y="62" font-family="Arial,DejaVu Sans,sans-serif" font-size="31" font-weight="800" fill="#113b5a">Логистический портал · текущий процесс</text><text x="95" y="96" font-family="Arial,DejaVu Sans,sans-serif" font-size="16" fill="#385973">Редакция 07.11.2026 · логика задач №1 и №2</text><rect x="95" y="114" width="810" height="51" rx="10" fill="#fff1db" stroke="#edc17d"/><text x="116" y="136" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" font-weight="700" fill="#805000">В действующем процессе — 3 роли: Владелец / Система / Перевозчик</text><text x="116" y="155" font-family="Arial,DejaVu Sans,sans-serif" font-size="13.5" fill="#805000">После победы переход сразу к исполнению. Документальные задачи другим ролям не создаются.</text><g font-family="Arial,DejaVu Sans,sans-serif"><path d="M 500 304 V 322" stroke="#7190a7" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
