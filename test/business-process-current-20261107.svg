<g><rect x="95" y="1457" width="810" height="112" rx="17" fill="#e8f8ef" stroke="#148058" stroke-width="2"/><rect x="113" y="1472" width="154" height="26" rx="13" fill="#148058"/><text x="125" y="1490" fill="#fff" font-size="13" font-weight="700">ПЕРЕВОЗЧИК</text><text x="118" y="1524" fill="#17334c" font-size="23" font-weight="750">10. Отмечать контрольные этапы</text><text x="118" y="1550" fill="#35526b" font-size="15.4">Выход → в пути → ПТО → таможня → склад · подтверждающие данные</text></g>
