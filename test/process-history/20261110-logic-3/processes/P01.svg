<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title" viewBox="0 0 660 1135"><title id="title">Создание и публикация заявки</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#53667c"/></marker></defs><g font-family="system-ui,sans-serif" fill="#142c45"><rect x="20" y="0" width="300" height="1135" fill="#f8fafc"/><text x="170" y="34" text-anchor="middle" font-size="18" font-weight="700">Владелец</text><rect x="330" y="0" width="300" height="1135" fill="#eff6ff"/><text x="480" y="34" text-anchor="middle" font-size="18" font-weight="700">Система</text><text x="30" y="100" font-size="16" font-weight="700">P01 · Создание и публикация заявки</text><path d="M165,275 V297 H165 V319" fill="none" stroke="#53667c" stroke-width="2" marker-end="url(#arrow)"/><text x="170" y="313" font-size="12">Условия шага выполнены</text><path d="M165,465 V487 H165 V509" fill="none" stroke="#53667c" stroke-width="2" marker-end="url(#arrow)"/><text x="170" y="503" font-size="12">Условия шага выполнены</text><path d="M165,655 V677 H475 V699" fill="none" stroke="#53667c" stroke-width="2" marker-end="url(#arrow)"/><text x="170" y="693" font-size="12">Условия шага выполнены</text><path d="M475,845 V867 H475 V889" fill="none" stroke="#53667c" stroke-width="2" marker-end="url(#arrow)"/><text x="480" y="883" font-size="12">Условия шага выполнены</text><path d="M475,845 V867 H165 V129" fill="none" stroke="#53667c" stroke-width="2" marker-end="url(#arrow)"/><text x="170" y="883" font-size="12">Неполный комплект → исправление</text><g id="P01-1"><title>Заказ, Bitrix, Incoterms, груз, срок</title><rect x="30" y="135" width="270" height="140" rx="12" fill="white" stroke="#365dad" stroke-width="2"/><text x="45" y="162" font-size="17" font-weight="600">Заполнить исходные поля</text><text x="45" y="238" font-size="13" fill="#35465b">draft</text><text x="45" y="258" font-size="12" fill="#35465b">P01-1</text></g><g id="P01-2"><title>Исходные вложения</title><rect x="30" y="325" width="270" height="140" rx="12" fill="white" stroke="#365dad" stroke-width="2"/><text x="45" y="352" font-size="17" font-weight="600">Загрузить документы</text><text x="45" y="428" font-size="13" fill="#35465b">draft</text><text x="45" y="448" font-size="12" fill="#35465b">P01-2</text></g><g id="P01-4"><title>Явное решение владельца</title><rect x="30" y="515" width="270" height="140" rx="12" fill="white" stroke="#365dad" stroke-width="2"/><text x="45" y="542" font-size="17" font-weight="600">Опубликовать заявку</text><text x="45" y="618" font-size="13" fill="#35465b">submitted</text><text x="45" y="638" font-size="12" fill="#35465b">P01-4</text></g><g id="P01-3"><title>При ошибке вернуться к форме без публикации</title><rect x="340" y="705" width="270" height="140" rx="12" fill="white" stroke="#07806d" stroke-width="2"/><text x="355" y="732" font-size="17" font-weight="600">Проверить и опубликовать</text><text x="355" y="808" font-size="13" fill="#35465b">published / 400</text><text x="355" y="828" font-size="12" fill="#35465b">P01-3</text></g><g id="P01-5"><title>Журнал адресатов, доступ к исходным файлам</title><rect x="340" y="895" width="270" height="140" rx="12" fill="white" stroke="#07806d" stroke-width="2"/><text x="355" y="922" font-size="17" font-weight="600">Уведомить перевозчиков</text><text x="355" y="998" font-size="13" fill="#35465b">pending</text><text x="355" y="1018" font-size="12" fill="#35465b">P01-5</text></g></g></svg>
