H785 V509" fill="none" stroke="#53667c" stroke-width="2" marker-end="url(#arrow)"/><text x="790" y="1263" font-size="12">Возврат владельцем: changes_requested</text><g id="P07-1"><title>Подписанная проформа</title><rect x="30" y="135" width="270" height="140" rx="12" fill="white" stroke="#365dad" stroke-width="2"/><text x="45" y="162" font-size="17" font-weight="600">Назначить поставщика и</text><text x="45" y="185" font-size="17" font-weight="600">проформу</text><text x="45" y="238" font-size="13" fill="#35465b">assigned</text><text x="45" y="258" font-size="12" fill="#35465b">P07-1</text></g><g id="P07-2"><title>Фактическая дата не в будущем</title><rect x="650" y="325" width="270" height="140" rx="12" fill="white" stroke="#365dad" stroke-width="2"/><text x="665" y="352" font-size="17" font-weight="600">Начать и указать готовность</text><text x="665" y="428" font-size="13" fill="#35465b">in_progress</text><text x="665" y="448" font-size="12" fill="#35465b">P07-2</text></g><g id="P07-3"><title>Фото погрузки и комплект</title><rect x="650" y="515" width="270" height="140" rx="12" fill="white" stroke="#365dad" stroke-width="2"/><text x="665" y="542" font-size="17" font-weight="600">Подготовить файлы /</text><text x="665" y="565" font-size="17" font-weight="600">объяснения</text><text x="665" y="618" font-size="13" fill="#35465b">in_progress</text><text x="665" y="638" font-size="12" fill="#35465b">P07-3</text></g><g id="P07-4"><title>Не завершается скрыто от загрузки</title><rect x="650" y="705" width="270" height="140" rx="12" fill="white" stroke="#365dad" stroke-width="2"/><text x="665" y="732" font-size="17" font-weight="600">Явно завершить подготовку</text><text x="665" y="808" font-size="13" fill="#35465b">completed</text><text x="665" y="828" font-size="12" fill="#35465b">P07-4</text></g><g id="P07-5"><title>Ссылки на существующие файлы</title><rect x="340" y="895" width="270" height="140" rx="12" fill="white" stroke="#07806d" stroke-width="2"/><text x="355" y=