<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title" viewBox="0 0 660 1135"><title id="title">Трекинг, контрольные точки и сроки</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#53667c"/></marker></defs><g font-family="system-ui,sans-serif" fill="#142c45"><rect x="20" y="0" width="300" height="1135" fill="#f8fafc"/><text x="170" y="34" text-anchor="middle" font-size="18" font-weight="700">Система</text><rect x="330" y="0" width="300" height="1135" fill="#eff6ff"/><text x="480" y="34" text-anchor="middle" font-size="18" font-weight="700">Перевозчик</text><text x="30" y="100" font-size="16" font-weight="700">P05 · Трекинг, контрольные точки и сроки</text><path d="M475,275 V297 H165 V319" fill="none" stroke="#53667c" stroke-width="2" marker-end="url(#arrow)"/><text x="170" y="313" font-size="12">Условия шага выполнены</text><path d="M165,465 V487 H165 V509" fill="none" stroke="#53667c" stroke-width="2" marker-end="url(#arrow)"/><text x="170" y="503" font-size="12">Условия шага выполнены</text><path d="M165,655 V677 H475 V699" fill="none" stroke="#53667c" stroke-width="2" marker-end="url(#arrow)"/><text x="170" y="693" font-size="12">Условия шага выполнены</text><path d="M475,845 V867 H475 V889" fill="none" stroke="#53667c" stroke-width="2" marker-end="url(#arrow)"/><text x="480" y="883" font-size="12">Условия шага выполнены</text><path d="M165,465 V487 H475 V129" fill="none" stroke="#53667c" stroke-width="2" marker-end="url(#arrow)"/><text x="170" y="503" font-size="12">Недоступен расчёт: повтор, без вымысла</text><g id="P05-1"><title>Даты и история контрольных точек</title><rect x="340" y="135" width="270" height="140" rx="12" fill="white" stroke="#365dad" stroke-width="2"/><text x="355" y="162" font-size="17" font-weight="600">Записать выход и</text><text x="355" y="185" font-size="17" font-weight="600">местоположение</text><text x="355" y="238" font-size="13" fill="#35465b">in_progress</text><text x="355" y="258" font-size="12" fill="#35465b">P05-1</text></g><g id="P05-2"><title>Никаких вымышленных километров</title><rect x="30" y="325" width="270" height="140" rx="12" fill="white" stroke="#07806d" stroke-width="2"/><text x="45" y="352" font-size="17" font-weight="600">Проверить расстояние</text><text x="45" y="428" font-size="13" fill="#35465b">verified / unavailable</text><text x="45" y="448" font-size="12" fill="#35465b">P05-2</text></g><g id="P05-3"><title>Без повторов; перейти в P06</title><rect x="30" y="515" width="270" height="140" rx="12" fill="white" stroke="#07806d" stroke-width="2"/><text x="45" y="542" font-size="17" font-weight="600">Если остаток &lt; 1000 км —</text><text x="45" y="565" font-size="17" font-weight="600">одна проверка</text><text x="45" y="618" font-size="13" fill="#35465b">pto_review</text><text x="45" y="638" font-size="12" fill="#35465b">P05-3</text></g><g id="P05-4"><title>Фактическая дата</title><rect x="340" y="705" width="270" height="140" rx="12" fill="white" stroke="#365dad" stroke-width="2"/><text x="355" y="732" font-size="17" font-weight="600">Зафиксировать прибытие на</text><text x="355" y="755" font-size="17" font-weight="600">ПТО</text><text x="355" y="808" font-size="13" fill="#35465b">pto_at</text><text x="355" y="828" font-size="12" fill="#35465b">P05-4</text></g><g id="P05-5"><title>Сервер проверяет необходимые предыдущие условия</title><rect x="340" y="895" width="270" height="140" rx="12" fill="white" stroke="#365dad" stroke-width="2"/><text x="355" y="922" font-size="17" font-weight="600">Записать таможню и склад</text><text x="355" y="998" font-size="13" fill="#35465b">customs_at / warehouse_at</text><text x="355" y="1018" font-size="12" fill="#35465b">P05-5</text></g></g></svg>
