<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title" viewBox="0 0 660 1325"><title id="title">Сравнение, тендер и один победитель</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#53667c"/></marker></defs><g font-family="system-ui,sans-serif" fill="#142c45"><rect x="20" y="0" width="300" height="1325" fill="#f8fafc"/><text x="170" y="34" text-anchor="middle" font-size="18" font-weight="700">Владелец</text><rect x="330" y="0" width="300" height="1325" fill="#eff6ff"/><text x="480" y="34" text-anchor="middle" font-size="18" font-weight="700">Система</text><text x="30" y="100" font-size="16" font-weight="700">P03 · Сравнение, тендер и один победитель</text><path d="M165,275 V297 H475 V319" fill="none" stroke="#53667c" stroke-width="2" marker-end="url(#arrow)"/><text x="170" y="313" font-size="12">Перед выбором</text><path d="M475,465 V487 H165 V699" fill="none" stroke="#53667c" stroke-width="2" marker-end="url(#arrow)"/><text x="170" y="503" font-size="12">Активных черновиков нет</text><path d="M475,465 V487 H165 V509" fill="none" stroke="#53667c" stroke-width="2" marker-end="url(#arrow)"/><text x="170" y="503" font-size="12">Выбор заблокирован</text><path d="M165,655 V677 H475 V319" fill="none" stroke="#53667c" stroke-width="2" marker-end="url(#arrow)"/><text x="170" y="693" font-size="12">После завершения / снятия</text><path d="M165,845 V867 H475 V889" fill="none" stroke="#53667c" stroke-width="2" marker-end="url(#arrow)"/><text x="170" y="883" font-size="12">Один победитель</text><path d="M475,1035 V1057 H475 V1079" fill="none" stroke="#53667c" stroke-width="2" marker-end="url(#arrow)"/><text x="480" y="1073" font-size="12">Если тендер завершён</text><g id="P03-1"><title>Цена, срок, маршрут, условия</title><rect x="30" y="135" width="270" height="140" rx="12" fill="white" stroke="#365dad" stroke-width="2"/><text x="45" y="162" font-size="17" font-weight="600">Сравнить предложения /</text><text x="45" y="185" font-size="17" font-weight="600">провести тендер</text><text x="45" y="238" font-size="13" fill="#35465b">review</text><text x="45" y="258" font-size="12" fill="#35465b">P03-1</text></g><g id="P03-2"><title>Есть активный черновик → выбор запрещён</title><rect x="340" y="325" width="270" height="140" rx="12" fill="white" stroke="#07806d" stroke-width="2"/><text x="355" y="352" font-size="17" font-weight="600">Проверить активные поздние</text><text x="355" y="375" font-size="17" font-weight="600">черновики</text><text x="355" y="428" font-size="13" fill="#35465b">blocked / eligible</text><text x="355" y="448" font-size="12" fill="#35465b">P03-2</text></g><g id="P03-3"><title>Не менять дедлайн автоматически</title><rect x="30" y="515" width="270" height="140" rx="12" fill="white" stroke="#365dad" stroke-width="2"/><text x="45" y="542" font-size="17" font-weight="600">Завершить подготовку либо</text><text x="45" y="565" font-size="17" font-weight="600">снять с причиной</text><text x="45" y="618" font-size="13" fill="#35465b">review</text><text x="45" y="638" font-size="12" fill="#35465b">P03-3</text></g><g id="P03-4"><title>Одна конкретная ставка</title><rect x="30" y="705" width="270" height="140" rx="12" fill="white" stroke="#365dad" stroke-width="2"/><text x="45" y="732" font-size="17" font-weight="600">Выбрать одну ставку</text><text x="45" y="808" font-size="13" fill="#35465b">awarded</text><text x="45" y="828" font-size="12" fill="#35465b">P03-4</text></g><g id="P03-5"><title>История и уведомления</title><rect x="340" y="895" width="270" height="140" rx="12" fill="white" stroke="#07806d" stroke-width="2"/><text x="355" y="922" font-size="17" font-weight="600">Закрыть раунд и архивировать</text><text x="355" y="945" font-size="17" font-weight="600">проигравших</text><text x="355" y="998" font-size="13" fill="#35465b">archived</text><text x="355" y="1018" font-size="12" fill="#35465b">P03-5</text></g><g id="P03-6"><title>Номер протокола и PDF тендера</title><rect x="340" y="1085" width="270" height="140" rx="12" fill="white" stroke="#07806d" stroke-width="2"/><text x="355" y="1112" font-size="17" font-weight="600">Сформировать итоговый</text><text x="355" y="1135" font-size="17" font-weight="600">протокол</text><text x="355" y="1188" font-size="13" fill="#35465b">final</text><text x="355" y="1208" font-size="12" fill="#35465b">P03-6</text></g></g></svg>
