<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title" viewBox="0 0 660 1325"><title id="title">Получение, расчёт и отправка ставки</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#53667c"/></marker></defs><g font-family="system-ui,sans-serif" fill="#142c45"><rect x="20" y="0" width="300" height="1325" fill="#f8fafc"/><text x="170" y="34" text-anchor="middle" font-size="18" font-weight="700">Система</text><rect x="330" y="0" width="300" height="1325" fill="#eff6ff"/><text x="480" y="34" text-anchor="middle" font-size="18" font-weight="700">Перевозчик</text><text x="30" y="100" font-size="16" font-weight="700">P02 · Получение, расчёт и отправка ставки</text><path d="M475,275 V297 H475 V319" fill="none" stroke="#53667c" stroke-width="2" marker-end="url(#arrow)"/><text x="480" y="313" font-size="12">Условия шага выполнены</text><path d="M475,465 V487 H475 V509" fill="none" stroke="#53667c" stroke-width="2" marker-end="url(#arrow)"/><text x="480" y="503" font-size="12">Условия шага выполнены</text><path d="M475,655 V677 H165 V699" fill="none" stroke="#53667c" stroke-width="2" marker-end="url(#arrow)"/><text x="170" y="693" font-size="12">Условия шага выполнены</text><path d="M165,845 V867 H475 V889" fill="none" stroke="#53667c" stroke-width="2" marker-end="url(#arrow)"/><text x="170" y="883" font-size="12">Условия шага выполнены</text><path d="M475,1035 V1057 H165 V1079" fill="none" stroke="#53667c" stroke-width="2" marker-end="url(#arrow)"/><text x="170" y="1073" font-size="12">Условия шага выполнены</text><path d="M165,845 V867 H475 V509" fill="none" stroke="#53667c" stroke-width="2" marker-end="url(#arrow)"/><text x="170" y="883" font-size="12">Неверные поля → исправление</text><g id="P02-1"><title>Уведомление и исходные документы</title><rect x="340" y="135" width="270" height="140" rx="12" fill="white" stroke="#365dad" stroke-width="2"/><text x="355" y="162" font-size="17" font-weight="600">Получить приглашение</text><text x="355" y="238" font-size="13" fill="#35465b">pending</text><text x="355" y="258" font-size="12" fill="#35465b">P02-1</text></g><g id="P02-2"><title>Отказ с причиной в срок</title><rect x="340" y="325" width="270" height="140" rx="12" fill="white" stroke="#365dad" stroke-width="2"/><text x="355" y="352" font-size="17" font-weight="600">Принять участие или</text><text x="355" y="375" font-size="17" font-weight="600">отказаться</text><text x="355" y="428" font-size="13" fill="#35465b">participating / declined</text><text x="355" y="448" font-size="12" fill="#35465b">P02-2</text></g><g id="P02-3"><title>XLSX / CSV; preview</title><rect x="340" y="515" width="270" height="140" rx="12" fill="white" stroke="#365dad" stroke-width="2"/><text x="355" y="542" font-size="17" font-weight="600">Рассчитать варианты /</text><text x="355" y="565" font-size="17" font-weight="600">импортировать</text><text x="355" y="618" font-size="13" fill="#35465b">draft</text><text x="355" y="638" font-size="12" fill="#35465b">P02-3</text></g><g id="P02-4"><title>Неверные ячейки не меняют форму частично</title><rect x="30" y="705" width="270" height="140" rx="12" fill="white" stroke="#07806d" stroke-width="2"/><text x="45" y="732" font-size="17" font-weight="600">Проверить варианты</text><text x="45" y="808" font-size="13" fill="#35465b">valid / 400</text><text x="45" y="828" font-size="12" fill="#35465b">P02-4</text></g><g id="P02-5"><title>Явная отправка всех вариантов</title><rect x="340" y="895" width="270" height="140" rx="12" fill="white" stroke="#365dad" stroke-width="2"/><text x="355" y="922" font-size="17" font-weight="600">Отправить варианты</text><text x="355" y="998" font-size="13" fill="#35465b">pending</text><text x="355" y="1018" font-size="12" fill="#35465b">P02-5</text></g><g id="P02-6"><title>Повтор с тем же request ID не дублирует</title><rect x="30" y="1085" width="270" height="140" rx="12" fill="white" stroke="#07806d" stroke-width="2"/><text x="45" y="1112" font-size="17" font-weight="600">Сохранить и показать</text><text x="45" y="1135" font-size="17" font-weight="600">владельцу</text><text x="45" y="1188" font-size="13" fill="#35465b">submitted</text><text x="45" y="1208" font-size="12" fill="#35465b">P02-6</text></g></g></svg>
