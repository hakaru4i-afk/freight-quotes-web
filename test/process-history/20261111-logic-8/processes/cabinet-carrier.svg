<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title" viewBox="0 0 970 4490"><title id="title">Перевозчик</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#53667c"/></marker></defs><g font-family="system-ui,sans-serif" fill="#142c45"><rect x="20" y="0" width="300" height="4490" fill="#f8fafc"/><text x="170" y="34" text-anchor="middle" font-size="18" font-weight="700">Владелец</text><rect x="330" y="0" width="300" height="4490" fill="#eff6ff"/><text x="480" y="34" text-anchor="middle" font-size="18" font-weight="700">Система</text><rect x="640" y="0" width="300" height="4490" fill="#f8fafc"/><text x="790" y="34" text-anchor="middle" font-size="18" font-weight="700">Перевозчик</text><text x="30" y="100" font-size="16" font-weight="700">P02 · Получение, расчёт и отправка ставки</text><text x="30" y="1345" font-size="16" font-weight="700">P04 · Принятие и начало исполнения</text><text x="30" y="2210" font-size="16" font-weight="700">P05 · Трекинг, контрольные точки и сроки</text><text x="30" y="3455" font-size="16" font-weight="700">P10 · Service Level, сроки и допуск</text><path d="M785,275 V297 H785 V319" fill="none" stroke="#53667c" stroke-width="2" marker-end="url(#arrow)"/><text x="790" y="313" font-size="12">Условия шага выполнены</text><path d="M785,465 V487 H785 V509" fill="none" stroke="#53667c" stroke-width="2" marker-end="url(#arrow)"/><text x="790" y="503" font-size="12">Условия шага выполнены</text><path d="M785,655 V677 H475 V699" fill="none" stroke="#53667c" stroke-width="2" marker-end="url(#arrow)"/><text x="480" y="693" font-size="12">Условия шага выполнены</text><path d="M475,845 V867 H785 V889" fill="none" stroke="#53667c" stroke-width="2" marker-end="url(#arrow)"/><text x="480" y="883" font-size="12">Условия шага выполнены</text><path d="M785,1035 V1057 H475 V1079" fill="none" stroke="#53667c" stroke-width="2" marker-end="url(#arrow)"/><text x="480" y="1073" font-size="12">Условия шага выполнены</text><path d="M475,845 V867 H785 V509" fill="none" stroke="#53667c" stroke-width="2" marker-end="url(#arrow)"/><text x="480" y="883" font-size="12">Неверные поля → исправление</text><path d="M475,1520 V1542 H785 V1564" fill="none" stroke="#53667c" stroke-width="2" marker-end="url(#arrow)"/><text x="480" y="1558" font-size="12">Условия шага выполнены</text><path d="M785,1710 V1732 H475 V1754" fill="none" stroke="#53667c" stroke-width="2" marker-end="url(#arrow)"/><text x="480" y="1748" font-size="12">Условия шага выполнены</text><path d="M475,1900 V1922 H785 V1944" fill="none" stroke="#53667c" stroke-width="2" marker-end="url(#arrow)"/><text x="480" y="1938" font-size="12">Условия шага выполнены</text><path d="M785,1710 V1732 H785 V1564" fill="none" stroke="#53667c" stroke-width="2" marker-end="url(#arrow)"/><text x="790" y="1748" font-size="12">Повтор: уже принято</text><path d="M785,2385 V2407 H475 V2429" fill="none" stroke="#53667c" stroke-width="2" marker-end="url(#arrow)"/><text x="480" y="2423" font-size="12">Контрольная точка</text><path d="M475,2575 V2597 H475 V2809" fill="none" stroke="#53667c" stroke-width="2" marker-end="url(#arrow)"/><text x="480" y="2613" font-size="12">Подтверждено &lt;1000 км</text><path d="M475,2575 V2597 H165 V2619" fill="none" stroke="#53667c" stroke-width="2" marker-end="url(#arrow)"/><text x="170" y="2613" font-size="12">Невозможно рассчитать</text><path d="M165,2765 V2787 H475 V2809" fill="none" stroke="#53667c" stroke-width="2" marker-end="url(#arrow)"/><text x="170" y="2803" font-size="12">Owner: причина, основание, аудит</text><path d="M475,2955 V2977 H785 V2999" fill="none" stroke="#53667c" stroke-width="2" marker-end="url(#arrow)"/><text x="480" y="2993" font-size="12">Одна задача; ВЭД выполняет проверку</text><path d="M785,3145 V3167 H785 V3189" fill="none" stroke="#53667c" stroke-width="2" marker-end="url(#arrow)"/><text x="790" y="3183" font-size="12">ПТО и ВЭД подтверждены</text><path d="M475,3630 V3652 H785 V3674" fill="none" stroke="#53667c" stroke-width="2" marker-end="url(#arrow)"/><text x="480" y="3668" font-size="12">Условия шага выполнены</text><path d="M785,3820 V3842 H475 V3864" fill="none" stroke="#53667c" stroke-width="2" marker-end="url(#arrow)"/><text x="480" y="3858" font-size="12">Условия шага выполнены</text><path d="M475,4010 V4032 H475 V4054" fill="none" stroke="#53667c" stroke-width="2" marker-end="url(#arrow)"/><text x="480" y="4048" font-size="12">Условия шага выполнены</text><path d="M475,4200 V4222 H165 V4244" fill="none" stroke="#53667c" stroke-width="2" marker-end="url(#arrow)"/><text x="170" y="4238" font-size="12">Условия шага выполнены</text><path d="M475,4200 V4222 H475 V3484" fill="none" stroke="#53667c" stroke-width="2" marker-end="url(#arrow)"/><text x="480" y="4238" font-size="12">Повтор cron: без второго штрафа</text><g id="P02-1"><title>Уведомление и исходные документы</title><rect x="650" y="135" width="270" height="140" rx="12" fill="white" stroke="#365dad" stroke-width="2"/><text x="665" y="162" font-size="17" font-weight="600">Получить приглашение</text><text x="665" y="238" font-size="13" fill="#35465b">pending</text><text x="665" y="258" font-size="12" fill="#35465b">P02-1</text></g><g id="P02-2"><title>Отказ с причиной в срок</title><rect x="650" y="325" width="270" height="140" rx="12" fill="white" stroke="#365dad" stroke-width="2"/><text x="665" y="352" font-size="17" font-weight="600">Принять участие или</text><text x="665" y="375" font-size="17" font-weight="600">отказаться</text><text x="665" y="428" font-size="13" fill="#35465b">participating / declined</text><text x="665" y="448" font-size="12" fill="#35465b">P02-2</text></g><g id="P02-3"><title>XLSX / CSV; preview</title><rect x="650" y="515" width="270" height="140" rx="12" fill="white" stroke="#365dad" stroke-width="2"/><text x="665" y="542" font-size="17" font-weight="600">Рассчитать варианты /</text><text x="665" y="565" font-size="17" font-weight="600">импортировать</text><text x="665" y="618" font-size="13" fill="#35465b">draft</text><text x="665" y="638" font-size="12" fill="#35465b">P02-3</text></g><g id="P02-4"><title>Неверные ячейки не меняют форму частично</title><rect x="340" y="705" width="270" height="140" rx="12" fill="white" stroke="#07806d" stroke-width="2"/><text x="355" y="732" font-size="17" font-weight="600">Проверить варианты</text><text x="355" y="808" font-size="13" fill="#35465b">valid / 400</text><text x="355" y="828" font-size="12" fill="#35465b">P02-4</text></g><g id="P02-5"><title>Явная отправка всех вариантов</title><rect x="650" y="895" width="270" height="140" rx="12" fill="white" stroke="#365dad" stroke-width="2"/><text x="665" y="922" font-size="17" font-weight="600">Отправить варианты</text><text x="665" y="998" font-size="13" fill="#35465b">pending</text><text x="665" y="1018" font-size="12" fill="#35465b">P02-5</text></g><g id="P02-6"><title>Повтор с тем же request ID не дублирует</title><rect x="340" y="1085" width="270" height="140" rx="12" fill="white" stroke="#07806d" stroke-width="2"/><text x="355" y="1112" font-size="17" font-weight="600">Сохранить и показать</text><text x="355" y="1135" font-size="17" font-weight="600">владельцу</text><text x="355" y="1188" font-size="13" fill="#35465b">submitted</text><text x="355" y="1208" font-size="12" fill="#35465b">P02-6</text></g><g id="P04-1"><title>Уведомление победителю</title><rect x="340" y="1380" width="270" height="140" rx="12" fill="white" stroke="#07806d" stroke-width="2"/><text x="355" y="1407" font-size="17" font-weight="600">Показать выигранную</text><text x="355" y="1430" font-size="17" font-weight="600">перевозку</text><text x="355" y="1483" font-size="13" fill="#35465b">awaiting_take</text><text x="355" y="1503" font-size="12" fill="#35465b">P04-1</text></g><g id="P04-2"><title>Без нового согласуемого документа</title><rect x="650" y="1570" width="270" height="140" rx="12" fill="white" stroke="#365dad" stroke-width="2"/><text x="665" y="1597" font-size="17" font-weight="600">Взять в работу</text><text x="665" y="1673" font-size="13" fill="#35465b">in_progress</text><text x="665" y="1693" font-size="12" fill="#35465b">P04-2</text></g><g id="P04-3"><title>Только текущий принявший победитель</title><rect x="340" y="1760" width="270" height="140" rx="12" fill="white" stroke="#07806d" stroke-width="2"/><text x="355" y="1787" font-size="17" font-weight="600">Открыть исполнение и доступ</text><text x="355" y="1810" font-size="17" font-weight="600">ВЭД</text><text x="355" y="1863" font-size="13" fill="#35465b">in_progress</text><text x="355" y="1883" font-size="12" fill="#35465b">P04-3</text></g><g id="P04-4"><title>Исходная дата + отдельные переносы</title><rect x="650" y="1950" width="270" height="140" rx="12" fill="white" stroke="#365dad" stroke-width="2"/><text x="665" y="1977" font-size="17" font-weight="600">Указать план и фактический</text><text x="665" y="2000" font-size="17" font-weight="600">выход</text><text x="665" y="2053" font-size="13" fill="#35465b">in_progress</text><text x="665" y="2073" font-size="12" fill="#35465b">P04-4</text></g><g id="P05-1"><title>Даты и история контрольных точек</title><rect x="650" y="2245" width="270" height="140" rx="12" fill="white" stroke="#365dad" stroke-width="2"/><text x="665" y="2272" font-size="17" font-weight="600">Записать выход и</text><text x="665" y="2295" font-size="17" font-weight="600">местоположение</text><text x="665" y="2348" font-size="13" fill="#35465b">in_progress</text><text x="665" y="2368" font-size="12" fill="#35465b">P05-1</text></g><g id="P05-2"><title>Никаких вымышленных километров</title><rect x="340" y="2435" width="270" height="140" rx="12" fill="white" stroke="#07806d" stroke-width="2"/><text x="355" y="2462" font-size="17" font-weight="600">Проверить расстояние</text><text x="355" y="2538" font-size="13" fill="#35465b">verified / unavailable</text><text x="355" y="2558" font-size="12" fill="#35465b">P05-2</text></g><g id="P05-manual"><title>Только Владелец; сервер подтверждает основание, записывает дату/пользователя/аудит; один ключ pto</title><rect x="30" y="2625" width="270" height="140" rx="12" fill="white" stroke="#365dad" stroke-width="2"/><text x="45" y="2652" font-size="17" font-weight="600">При невозможности расчёта:</text><text x="45" y="2675" font-size="17" font-weight="600">причина и основание</text><text x="45" y="2728" font-size="13" fill="#35465b">manual_pto_review</text><text x="45" y="2748" font-size="12" fill="#35465b">P05-manual</text></g><g id="P05-3"><title>Без повторов; перейти в P06</title><rect x="340" y="2815" width="270" height="140" rx="12" fill="white" stroke="#07806d" stroke-width="2"/><text x="355" y="2842" font-size="17" font-weight="600">Создать или найти</text><text x="355" y="2865" font-size="17" font-weight="600">единственную проверку ВЭД</text><text x="355" y="2918" font-size="13" fill="#35465b">pto_review</text><text x="355" y="2938" font-size="12" fill="#35465b">P05-3</text></g><g id="P05-4"><title>Фактическая дата</title><rect x="650" y="3005" width="270" height="140" rx="12" fill="white" stroke="#365dad" stroke-width="2"/><text x="665" y="3032" font-size="17" font-weight="600">Зафиксировать прибытие на</text><text x="665" y="3055" font-size="17" font-weight="600">ПТО</text><text x="665" y="3108" font-size="13" fill="#35465b">pto_at</text><text x="665" y="3128" font-size="12" fill="#35465b">P05-4</text></g><g id="P05-5"><title>Факт ПТО и проверка ВЭД обязательны; затем таможня и склад</title><rect x="650" y="3195" width="270" height="140" rx="12" fill="white" stroke="#365dad" stroke-width="2"/><text x="665" y="3222" font-size="17" font-weight="600">Записать таможню и склад</text><text x="665" y="3298" font-size="13" fill="#35465b">customs_at / warehouse_at</text><text x="665" y="3318" font-size="12" fill="#35465b">P05-5</text></g><g id="P10-1"><title>Ответ / отказ / нет ответа</title><rect x="340" y="3490" width="270" height="140" rx="12" fill="white" stroke="#07806d" stroke-width="2"/><text x="355" y="3517" font-size="17" font-weight="600">Проверить дедлайн по Минску</text><text x="355" y="3593" font-size="13" fill="#35465b">deadline</text><text x="355" y="3613" font-size="12" fill="#35465b">P10-1</text></g><g id="P10-2"><title>Поздняя подача не выбирает победителя</title><rect x="650" y="3680" width="270" height="140" rx="12" fill="white" stroke="#365dad" stroke-width="2"/><text x="665" y="3707" font-size="17" font-weight="600">Ответить или отказаться с</text><text x="665" y="3730" font-size="17" font-weight="600">причиной</text><text x="665" y="3783" font-size="13" fill="#35465b">on_time / late</text><text x="665" y="3803" font-size="12" fill="#35465b">P10-2</text></g><g id="P10-3"><title>Уникальный ключ, повтор безопасен</title><rect x="340" y="3870" width="270" height="140" rx="12" fill="white" stroke="#07806d" stroke-width="2"/><text x="355" y="3897" font-size="17" font-weight="600">Записать штраф один раз</text><text x="355" y="3973" font-size="13" fill="#35465b">service_event</text><text x="355" y="3993" font-size="12" fill="#35465b">P10-3</text></g><g id="P10-4"><title>Поздняя подача не отменяет штраф</title><rect x="340" y="4060" width="270" height="140" rx="12" fill="white" stroke="#07806d" stroke-width="2"/><text x="355" y="4087" font-size="17" font-weight="600">Обновить показатель и допуск</text><text x="355" y="4163" font-size="13" fill="#35465b">score / eligibility</text><text x="355" y="4183" font-size="12" fill="#35465b">P10-4</text></g><g id="P10-5"><title>Историю не удалять</title><rect x="30" y="4250" width="270" height="140" rx="12" fill="white" stroke="#365dad" stroke-width="2"/><text x="45" y="4277" font-size="17" font-weight="600">Разобрать оспаривание по</text><text x="45" y="4300" font-size="17" font-weight="600">действующим правилам</text><text x="45" y="4353" font-size="13" fill="#35465b">audit</text><text x="45" y="4373" font-size="12" fill="#35465b">P10-5</text></g></g></svg>
