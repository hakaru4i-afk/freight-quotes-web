<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title" viewBox="0 0 970 1135"><title id="title">Service Level, сроки и допуск</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#53667c"/></marker></defs><g font-family="system-ui,sans-serif" fill="#142c45"><rect x="20" y="0" width="300" height="1135" fill="#f8fafc"/><text x="170" y="34" text-anchor="middle" font-size="18" font-weight="700">Владелец</text><rect x="330" y="0" width="300" height="1135" fill="#eff6ff"/><text x="480" y="34" text-anchor="middle" font-size="18" font-weight="700">Система</text><rect x="640" y="0" width="300" height="1135" fill="#f8fafc"/><text x="790" y="34" text-anchor="middle" font-size="18" font-weight="700">Перевозчик</text><text x="30" y="100" font-size="16" font-weight="700">P10 · Service Level, сроки и допуск</text><path d="M475,275 V297 H785 V319" fill="none" stroke="#53667c" stroke-width="2" marker-end="url(#arrow)"/><text x="480" y="313" font-size="12">Условия шага выполнены</text><path d="M785,465 V487 H475 V509" fill="none" stroke="#53667c" stroke-width="2" marker-end="url(#arrow)"/><text x="480" y="503" font-size="12">Условия шага выполнены</text><path d="M475,655 V677 H475 V699" fill="none" stroke="#53667c" stroke-width="2" marker-end="url(#arrow)"/><text x="480" y="693" font-size="12">Условия шага выполнены</text><path d="M475,845 V867 H165 V889" fill="none" stroke="#53667c" stroke-width="2" marker-end="url(#arrow)"/><text x="170" y="883" font-size="12">Условия шага выполнены</text><path d="M475,845 V867 H475 V129" fill="none" stroke="#53667c" stroke-width="2" marker-end="url(#arrow)"/><text x="480" y="883" font-size="12">Повтор cron: без второго штрафа</text><g id="P10-1"><title>Ответ / отказ / нет ответа</title><rect x="340" y="135" width="270" height="140" rx="12" fill="white" stroke="#07806d" stroke-width="2"/><text x="355" y="162" font-size="17" font-weight="600">Проверить дедлайн по Минску</text><text x="355" y="238" font-size="13" fill="#35465b">deadline</text><text x="355" y="258" font-size="12" fill="#35465b">P10-1</text></g><g id="P10-2"><title>Поздняя подача не выбирает победителя</title><rect x="650" y="325" width="270" height="140" rx="12" fill="white" stroke="#365dad" stroke-width="2"/><text x="665" y="352" font-size="17" font-weight="600">Ответить или отказаться с</text><text x="665" y="375" font-size="17" font-weight="600">причиной</text><text x="665" y="428" font-size="13" fill="#35465b">on_time / late</text><text x="665" y="448" font-size="12" fill="#35465b">P10-2</text></g><g id="P10-3"><title>Уникальный ключ, повтор безопасен</title><rect x="340" y="515" width="270" height="140" rx="12" fill="white" stroke="#07806d" stroke-width="2"/><text x="355" y="542" font-size="17" font-weight="600">Записать штраф один раз</text><text x="355" y="618" font-size="13" fill="#35465b">service_event</text><text x="355" y="638" font-size="12" fill="#35465b">P10-3</text></g><g id="P10-4"><title>Поздняя подача не отменяет штраф</title><rect x="340" y="705" width="270" height="140" rx="12" fill="white" stroke="#07806d" stroke-width="2"/><text x="355" y="732" font-size="17" font-weight="600">Обновить показатель и допуск</text><text x="355" y="808" font-size="13" fill="#35465b">score / eligibility</text><text x="355" y="828" font-size="12" fill="#35465b">P10-4</text></g><g id="P10-5"><title>Историю не удалять</title><rect x="30" y="895" width="270" height="140" rx="12" fill="white" stroke="#365dad" stroke-width="2"/><text x="45" y="922" font-size="17" font-weight="600">Разобрать оспаривание по</text><text x="45" y="945" font-size="17" font-weight="600">действующим правилам</text><text x="45" y="998" font-size="13" fill="#35465b">audit</text><text x="45" y="1018" font-size="12" fill="#35465b">P10-5</text></g></g></svg>
