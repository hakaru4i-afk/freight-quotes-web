<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title" viewBox="0 0 660 945"><title id="title">Завершение перевозки</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#53667c"/></marker></defs><g font-family="system-ui,sans-serif" fill="#142c45"><rect x="20" y="0" width="300" height="945" fill="#f8fafc"/><text x="170" y="34" text-anchor="middle" font-size="18" font-weight="700">Владелец</text><rect x="330" y="0" width="300" height="945" fill="#eff6ff"/><text x="480" y="34" text-anchor="middle" font-size="18" font-weight="700">Система</text><text x="30" y="100" font-size="16" font-weight="700">P09 · Завершение перевозки</text><path d="M165,275 V297 H475 V319" fill="none" stroke="#53667c" stroke-width="2" marker-end="url(#arrow)"/><text x="170" y="313" font-size="12">Условия шага выполнены</text><path d="M475,465 V487 H165 V509" fill="none" stroke="#53667c" stroke-width="2" marker-end="url(#arrow)"/><text x="170" y="503" font-size="12">Условия шага выполнены</text><path d="M165,655 V677 H475 V699" fill="none" stroke="#53667c" stroke-width="2" marker-end="url(#arrow)"/><text x="170" y="693" font-size="12">Условия шага выполнены</text><path d="M475,465 V487 H165 V129" fill="none" stroke="#53667c" stroke-width="2" marker-end="url(#arrow)"/><text x="170" y="503" font-size="12">Условия не выполнены: исправить</text><g id="P09-1"><title>Уполномоченный сотрудник; действие Owner или уполномоченного ВЭД, не два последовательных согласования</title><rect x="30" y="135" width="270" height="140" rx="12" fill="white" stroke="#365dad" stroke-width="2"/><text x="45" y="162" font-size="17" font-weight="600">Запросить завершение</text><text x="45" y="238" font-size="13" fill="#35465b">in_progress</text><text x="45" y="258" font-size="12" fill="#35465b">P09-1</text></g><g id="P09-2"><title>Незавершённое → вернуть ответственному</title><rect x="340" y="325" width="270" height="140" rx="12" fill="white" stroke="#07806d" stroke-width="2"/><text x="355" y="352" font-size="17" font-weight="600">Проверить этапы, документы и</text><text x="355" y="375" font-size="17" font-weight="600">претензии</text><text x="355" y="428" font-size="13" fill="#35465b">blocked / ready</text><text x="355" y="448" font-size="12" fill="#35465b">P09-2</text></g><g id="P09-3"><title>Только если номера нет; действие Owner или уполномоченного ВЭД, не два последовательных согласования</title><rect x="30" y="515" width="270" height="140" rx="12" fill="white" stroke="#365dad" stroke-width="2"/><text x="45" y="542" font-size="17" font-weight="600">Указать решение по</text><text x="45" y="565" font-size="17" font-weight="600">контейнеру</text><text x="45" y="618" font-size="13" fill="#35465b">ready</text><text x="45" y="638" font-size="12" fill="#35465b">P09-3</text></g><g id="P09-4"><title>Нет автоматического обхода претензии</title><rect x="340" y="705" width="270" height="140" rx="12" fill="white" stroke="#07806d" stroke-width="2"/><text x="355" y="732" font-size="17" font-weight="600">Завершить и сохранить</text><text x="355" y="755" font-size="17" font-weight="600">историю</text><text x="355" y="808" font-size="13" fill="#35465b">completed</text><text x="355" y="828" font-size="12" fill="#35465b">P09-4</text></g></g></svg>
