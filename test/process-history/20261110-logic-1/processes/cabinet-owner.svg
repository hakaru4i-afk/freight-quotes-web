ne" stroke="#53667c" stroke-width="2" marker-end="url(#arrow)"/><text x="170" y="693" font-size="12">Условия шага выполнены</text><path d="M475,845 V867 H475 V889" fill="none" stroke="#53667c" stroke-width="2" marker-end="url(#arrow)"/><text x="480" y="883" font-size="12">Условия шага выполнены</text><path d="M475,845 V867 H165 V129" fill="none" stroke="#53667c" stroke-width="2" marker-end="url(#arrow)"/><text x="170" y="883" font-size="12">Неполный комплект → исправление</text><path d="M165,1330 V1352 H475 V1374" fill="none" stroke="#53667c" stroke-width="2" marker-end="url(#arrow)"/><text x="170" y="1368" font-size="12">Перед выбором</text><path d="M475,1520 V1542 H165 V1754" fill="none" stroke="#53667c" stroke-width="2" marker-end="url(#arrow)"/><text x="170" y="1558" font-size="12">Активных черновиков нет</text><path d="M475,1520 V1542 H165 V1564" fill="none" stroke="#53667c" stroke-width="2" marker-end="url(#arrow)"/><text x="170" y="1558" font-size="12">Выбор заблокирован</text><path d="M165,1710 V1732 H475 V1374" fill="none" stroke="#53667c" stroke-width="2" marker-end="url(#arrow)"/><text x="170" y="1748" font-size="12">После завершения / снятия</text><path d="M165,1900 V1922 H475 V1944" fill="none" stroke="#53667c" stroke-width="2" marker-end="url(#arrow)"/><text x="170" y="1938" font-size="12">Один победитель</text><path d="M475,2090 V2112 H475 V2134" fill="none" stroke="#53667c" stroke-width="2" marker-end="url(#arrow)"/><text x="480" y="2128" font-size="12">Если тендер завершён</text><path d="M165,2575 V2597 H1095 V2619" fill="none" stroke="#53667c" stroke-width="2" marker-end="url(#arrow)"/><text x="170" y="2613" font-size="12">Условия шага выполнены</text><path d="M1095,2765 V2787 H1095 V2809" fill="none" stroke="#53667c" stroke-width="2" marker-end="url(#arrow)"/><text x="1100" y="2803" font-size="12">Условия шага выполнены</text><path d="M1095,2955 V2977 H1095 V2999" fill="none" stroke="#53667c" stroke-width="2" marker-end="url(#arrow)"/><text x="1100" y="2993" font-size="12">Условия шага выполнены</text><path d="M1095,3145 V3167 H475 V3189" fill="none" stroke="#53667c" stroke-width="2" marker-end="url(#arrow)"/><text x="480" y="3183" font-size="12">Условия шага выполнены</text><path d="M475,3335 V3357 H1405 V3379" fill="none" stroke="#53667c" stroke-width="2" marker-end="url(#arrow)"/><text x="480" y="3373" font-size="12">Условия шага выполнены</text><path d="M1405,3525 V3547 H1095 V2809" fill="none" stroke="#53667c" stroke-width="2" marker-end="url(#arrow)"/><text x="1100" y="3563" font-size="12">Возврат владельцем: changes_requested</text><path d="M165,3820 V3842 H475 V3864" fill="none" stroke="#53667c" stroke-width="2" marker-end="url(#arrow)"/><text x="170" y="3858" font-size="12">Условия шага выполнены</text><path d="M475,4010 V4032 H165 V4054" fill="none" stroke="#53667c" stroke-width="2" marker-end="url(#arrow)"/><text x="170" y="4048" font-size="12">Условия шага выполнены</text><path d="M165,4200 V4222 H475 V4244" fill="none" stroke="#53667c" stroke-width="2" marker-end="url(#arrow)"/><text x="170" y="4238" font-size="12">Условия шага выполнены</text><path d="M475,4010 V4032 H165 V3674" fill="none" stroke="#53667c" stroke-width="2" marker-end="url(#arrow)"/><text x="170" y="4048" font-size="12">Условия не выполнены: исправить</text><path d="M475,4685 V4707 H785 V4729" fill="none" stroke="#53667c" stroke-width="2" marker-end="url(#arrow)"/><text x="480" y="4723" font-size="12">Условия шага выполнены</text><path d="M785,4875 V4897 H475 V4919" fill="none" stroke="#53667c" stroke-width="2" marker-end="url(#arrow)"/><text x="480" y="4913" font-size="12">Условия шага выполнены</text><path d="M475,5065 V5087 H475 V5109" fill="none" stroke="#53667c" stroke-width="2" marker-end="url(#arrow)"/><text x="480" y="5103" font-size="12">Условия шага выполнены</text><path d="M475,5255 V5277 H165 V5299" fill="none" stroke="#53667c" stroke-width="2" marker-end="url(#arrow)"/><text x="170" y="5293" font-size="12">Условия шага выполнены</text><path d="M475,5255 V5277 H475 V4539" fill="none" stroke="#53667c" stroke-width="2" marker-end="url(#arrow)"/><text x="480" y="5293" font-size="12">Повтор cron: без второго штрафа</text><g id="P01-1"><title>Заказ, Bitrix, Incoterms, груз, срок</title><rect x="30" y="135" width="270" height="140" rx="12" fill="white" stroke="#365dad" stroke-width="2"/><text x="45" y="162" font-size="17" font-weight="600">Заполнить исходные поля</text><text x="45" y="238" font-size="13" fill="#35465b">draft</text><text x="45" y="258" font-size="12" fill="#35465b">P01-1</text></g><g id="P01-2"><title>Исходные вложения</title><rect x="30" y="325" width="270" height="140" rx="12" fill="white" stroke="#365dad" stroke-width="2"/><text x="45" y="352" font-size="17" font-weight="600">Загрузить документы</text><text x="45" y="428" font-size="13" fill="#35465b">draft</text><text x="45" y="448" font-size="12" fill="#35465b">P01-2</text></g><g id="P01-4"><title>Явное решение владельца</title><rect x="30" y="515" width="270" height="140" rx="12" fill="white" stroke="#365dad" stroke-width="2"/><text x="45" y="542" font-size="17" font-weight="600">Опубликовать заявку</text><text x="45" y="618" font-size="13" fill="#35465b">submitted</text><text x="45" y="638" font-size="12" fill="#35465b">P01-4</text></g><g id="P01-3"><title>При ошибке вернуться к форме без публикации</title><rect x="340" y="705" width="270" height="140" rx="12" fill="white" stroke="#07806d" stroke-width="2"/><text x="355" y="732" font-size="17" font-weight="600">Проверить и опубликовать</text><text x="355" y="808" font-size="13" fill="#35465b">published / 400</text><text x="355" y="828" font-size="12" fill="#35465b">P01-3</text></g><g id="P01-5"><title>Журнал адресатов, доступ к исходным файлам</title><rect x="340" y="895" width="270" height="140" rx="12" fill="white" stroke="#07806d" stroke-width="2"/><text x="355" y="922" font-size="17" font-weight="600">Уведомить перевозчиков</text><text x="355" y="998" font-size="13" fill="#35465b">pending</text><text x="355" y="1018" font-size="12" fill="#35465b">P01-5</text></g><g id="P03-1"><title>Цена, срок, маршрут, условия</title><rect x="30" y="1190" width="270" height="140" rx="12" fill="white" stroke="#365dad" stroke-width="2"/><text x="45" y="1217" font-size="17" font-weight="600">Сравнить предложения /</text><text x="45" y="1240" font-size="17" font-weight="600">провести тендер</text><text x="45" y="1293" font-size="13" fill="#35465b">review</text><text x="45" y="1313" font-size="12" fill="#35465b">P03-1</text></g><g id="P03-2"><title>Есть активный черновик → выбор запрещён</title><rect x="340" y="1380" width="270" height="140" rx="12" fill="white" stroke="#07806d" stroke-width="2"/><text x="355" y="1407" font-size="17" font-weight="600">Проверить активные поздние</text><text x="355" y="1430" font-size="17" font-weight="600">черновики</text><text x="355" y="1483" font-size="13" fill="#35465b">blocked / eligible</text><text x="355" y="1503" font-size="12" fill="#35465b">P03-2</text></g><g id="P03-3"><title>Не менять дедлайн автоматически</title><rect x="30" y="1570" width="270" height="140" rx="12" fill="white" stroke="#365dad" stroke-width="2"/><text x="45" y="1597" font-size="17" font-weight="600">Завершить подготовку либо</text><text x="45" y="1620" font-size="17" font-weight="600">снять с причиной</text><text x="45" y="1673" font-size="13" fill="#35465b">review</text><text x="45" y="1693" font-size="12" fill="#35465b">P03-3</text></g><g id="P03-4"><title>Одна конкретная ставка</title><rect x="30" y="1760" width="270" height="140" rx="12" fill="white" stroke="#365dad" stroke-width="2"/><text x="45" y="1787" font-size="17" font-weight="600">Выбрать одну ставку</text><text x="45" y="1863" font-size="13" fill="#35465b">awarded</text><text x="45" y="1883" font-size="12" fill="#35465b">P03-4</text></g><g id="P03-5"><title>История и уведомления</title><rect x="340" y="1950" width="270" height="140" rx="12" fill="white" stroke="#07806d" stroke-width="2"/><text x="355" y="1977" font-size="17" font-weight="600">Закрыть раунд и архивировать</text><text x="355" y="2000" font-size="17" font-weight="600">проигравших</text><text x="355" y="2053" font-size="13" fill="#35465b">archived</text><text x="355" y="2073" font-size="12" fill="#35465b">P03-5</text></g><g id="P03-6"><title>Номер протокола и PDF тендера</title><rect x="340" y="2140" width="270" height="140" rx="12" fill="white" stroke="#07806d" stroke-width="2"/><text x="355" y="2167" font-size="17" font-weight="600">Сформировать итоговый</text><text x="355" y="2190" font-size="17" font-weight="600">протокол</text><text x="355" y="2243" font-size="13" fill="#35465b">final</text><text x="355" y="2263" font-size="12" fill="#35465b">P03-6</text></g><g id="P07-1"><title>Подписанная проформа</title><rect x="30" y="2435" width="270" height="140" rx="12" fill="white" stroke="#365dad" stroke-width="2"/><text x="45" y="2462" font-size="17" font-weight="600">Назначить поставщика и</text><text x="45" y="2485" font-size="17" font-weight="600">проформу</text><text x="45" y="2538" font-size="13" fill="#35465b">assigned</text><text x="45" y="2558" font-size="12" fill="#35465b">P07-1</text></g><g id="P07-2"><title>Фактическая дата не в будущем</title><rect x="960" y="2625" width="270" height="140" rx="12" fill="white" stroke="#365dad" stroke-width="2"/><text x="975" y="2652" font-size="17" font-weight="600">Начать и указать готовность</text><text x="975" y="2728" font-size="13" fill="#35465b">in_progress</text><text x="975" y="2748" font-size="12" fill="#35465b">P07-2</text></g><g id="P07-3"><title>Фото погрузки и комплект</title><rect x="960" y="2815" width="270" height="140" rx="12" fill="white" stroke="#365dad" stroke-width="2"/><text x="975" y="2842" font-size="17" font-weight="600">Подготовить файлы /</text><text x="975" y="2865" font-size="17" font-weight="600">объяснения</text><text x="975" y="2918" font-size="13" fill="#35465b">in_progress</text><text x="975" y="2938" font-size="12" fill="#35465b">P07-3</text></g><g id="P07-4"><title>Не завершается скрыто от загрузки</title><rect x="960" y="3005" width="270" height="140" rx="12" fill="white" stroke="#365dad" stroke-width="2"/><text x="975" y="3032" font-size="17" font-weight="600">Явно завершить подготовку</text><text x="975" y="3108" font-size="13" fill="#35465b">completed</text><text x="975" y="3128" font-size="12" fill="#35465b">P07-4</text></g><g id="P07-5"><title>Ссылки на существующие файлы</title><rect x="340" y="3195" width="270" height="140" rx="12" fill="white" stroke="#07806d" stroke-width="2"/><text x="355" y="3222" font-size="17" font-weight="600">Передать комплект дизайнеру</text><text x="355" y="3298" font-size="13" fill="#35465b">new</text><text x="355" y="3318" font-size="12" fill="#35465b">P07-5</text></g><g id="P07-6"><title>Результат и комментарий</title><rect x="1270" y="3385" width="270" height="140" rx="12" fill="white" stroke="#365dad" stroke-width="2"/><text x="1285" y="3412" font-size="17" font-weight="600">Взять и выполнить</text><text x="1285" y="3435" font-size="17" font-weight="600">контент-задачу</text><text x="1285" y="3488" font-size="13" fill="#35465b">in_progress → completed</text><text x="1285" y="3508" font-size="12" fill="#35465b">P07-6</text></g><g id="P09-1"><title>Уполномоченный сотрудник</title><rect x="30" y="3680" width="270" height="140" rx="12" fill="white" stroke="#365dad" stroke-width="2"/><text x="45" y="3707" font-size="17" font-weight="600">Запросить завершение</text><text x="45" y="3783" font-size="13" fill="#35465b">in_progress</text><text x="45" y="3803" font-size="12" fill="#35465b">P09-1</text></g><g id="P09-2"><title>Незавершённое → вернуть ответственному</title><rect x="340" y="3870" width="270" height="140" rx="12" fill="white" stroke="#07806d" stroke-width="2"/><text x="355" y="3897" font-size="17" font-weight="600">Проверить этапы, документы и</text><text x="355" y="3920" font-size="17" font-weight="600">претензии</text><text x="355" y="3973" font-size="13" fill="#35465b">blocked / ready</text><text x="355" y="3993" font-size="12" fill="#35465b">P09-2</text></g><g id="P09-3"><title>Только если номера нет</title><rect x="30" y="4060" width="270" height="140" rx="12" fill="white" stroke="#365dad" stroke-width="2"/><text x="45" y="4087" font-size="17" font-weight="600">Указать решение по</text><text x="45" y="4110" font-size="17" font-weight="600">контейнеру</text><text x="45" y="4163" font-size="13" fill="#35465b">ready</text><text x="45" y="4183" font-size="12" fill="#35465b">P09-3</text></g><g id="P09-4"><title>Нет автоматического обхода претензии</title><rect x="340" y="4250" width="270" height="140" rx="12" fill="white" stroke="#07806d" stroke-width="2"/><text x="355" y="4277" font-size="17" font-weight="600">Завершить и сохранить</text><text x="355" y="4300" font-size="17" font-weight="600">историю</text><text x="355" y="4353" font-size="13" fill="#35465b">completed</text><text x="355" y="4373" font-size="12" fill="#35465b">P09-4</text></g><g id="P10-1"><title>Ответ / отказ / нет ответа</title><rect x="340" y="4545" width="270" height="140" rx="12" fill="white" stroke="#07806d" stroke-width="2"/><text x="355" y="4572" font-size="17" font-weight="600">Проверить дедлайн по Минску</text><text x="355" y="4648" font-size="13" fill="#35465b">deadline</text><text x="355" y="4668" font-size="12" fill="#35465b">P10-1</text></g><g id="P10-2"><title>Поздняя подача не выбирает победителя</title><rect x="650" y="4735" width="270" height="140" rx="12" fill="white" stroke="#365dad" stroke-width="2"/><text x="665" y="4762" font-size="17" font-weight="600">Ответить или отказаться с</text><text x="665" y="4785" font-size="17" font-weight="600">причиной</text><text x="665" y="4838" font-size="13" fill="#35465b">on_time / late</text><text x="665" y="4858" font-size="12" fill="#35465b">P10-2</text></g><g id="P10-3"><title>Уникальный ключ, повтор безопасен</title><rect x="340" y="4925" width="270" height="140" rx="12" fill="white" stroke="#07806d" stroke-width="2"/><text x="355" y="4952" font-size="17" font-weight="600">Записать штраф один раз</text><text x="355" y="5028" font-size="13" fill="#35465b">service_event</text><text x="355" y="5048" font-size="12" fill="#35465b">P10-3</text></g><g id="P10-4"><title>Поздняя подача не отменяет штраф</title><rect x="340" y="5115" width="270" height="140" rx="12" fill="white" stroke="#07806d" stroke-width="2"/><text x="355" y="5142" font-size="17" font-weight="600">Обновить показатель и допуск</text><text x="355" y="5218" font-size="13" fill="#35465b">score / eligibility</text><text x="355" y="5238" font-size="12" fill="#35465b">P10-4</text></g><g id="P10-5"><title>Историю не удалять</title><rect x="30" y="5305" width="270" height="140" rx="12" fill="white" stroke="#365dad" stroke-width="2"/><text x="45" y="5332" font-size="17" font-weight="600">Разобрать оспаривание по</text><text x="45" y="5355" font-size="17" font-weight="600">действующим правилам</text><text x="45" y="5408" font-size="13" fill="#35465b">audit</text><text x="45" y="5428" font-size="12" fill="#35465b">P10-5</text></g></g></svg>
