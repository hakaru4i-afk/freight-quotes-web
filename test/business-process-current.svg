<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title" viewBox="0 0 1900 2085"><title id="title">Общая схема портала</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#53667c"/></marker></defs><g font-family="system-ui,sans-serif" fill="#142c45"><rect x="20" y="0" width="300" height="2085" fill="#f8fafc"/><text x="170" y="34" text-anchor="middle" font-size="18" font-weight="700">Владелец</text><rect x="330" y="0" width="300" height="2085" fill="#eff6ff"/><text x="480" y="34" text-anchor="middle" font-size="18" font-weight="700">Система</text><rect x="640" y="0" width="300" height="2085" fill="#f8fafc"/><text x="790" y="34" text-anchor="middle" font-size="18" font-weight="700">Перевозчик</text><rect x="950" y="0" width="300" height="2085" fill="#eff6ff"/><text x="1100" y="34" text-anchor="middle" font-size="18" font-weight="700">ВЭД / логист</text><rect x="1260" y="0" width="300" height="2085" fill="#f8fafc"/><text x="1410" y="34" text-anchor="middle" font-size="18" font-weight="700">Поставщик</text><rect x="1570" y="0" width="300" height="2085" fill="#eff6ff"/><text x="1720" y="34" text-anchor="middle" font-size="18" font-weight="700">Контент</text><text x="30" y="100" font-size="16" font-weight="700">OVERVIEW · Взаимосвязи процессов; поставка/контент и назначения — отдельные ветви</text><path d="M165,275 V297 H785 V319" fill="none" stroke="#53667c" stroke-width="2" marker-end="url(#arrow)"/><text x="170" y="313" font-size="12">Опубликованная заявка</text><path d="M785,465 V487 H165 V509" fill="none" stroke="#53667c" stroke-width="2" marker-end="url(#arrow)"/><text x="170" y="503" font-size="12">Предложения</text><path d="M165,655 V677 H785 V699" fill="none" stroke="#53667c" stroke-width="2" marker-end="url(#arrow)"/><text x="170" y="693" font-size="12">Один победитель</text><path d="M785,845 V867 H785 V889" fill="none" stroke="#53667c" stroke-width="2" marker-end="url(#arrow)"/><text x="790" y="883" font-size="12">Принятие и выход</text><path d="M785,1035 V1057 H1095 V1079" fill="none" stroke="#53667c" stroke-width="2" marker-end="url(#arrow)"/><text x="790" y="1073" font-size="12">&lt;1000 км или подтверждённый резерв Owner</text><path d="M1095,1225 V1247 H785 V889" fill="none" stroke="#53667c" stroke-width="2" marker-end="url(#arrow)"/><text x="790" y="1263" font-size="12">Документы проверены</text><path d="M785,1035 V1057 H165 V1649" fill="none" stroke="#53667c" stroke-width="2" marker-end="url(#arrow)"/><text x="170" y="1073" font-size="12">Этапы и задачи завершены</text><path d="M785,465 V487 H475 V1839" fill="none" stroke="#53667c" stroke-width="2" marker-end="url(#arrow)"/><text x="480" y="503" font-size="12">Контроль дедлайна</text><path d="M475,1985 V2007 H165 V509" fill="none" stroke="#53667c" stroke-width="2" marker-end="url(#arrow)"/><text x="170" y="2023" font-size="12">Допуск и история SL</text><g id="summary-P01"><title>Обязательные поля и хотя бы один исходный документ; черновик можно сохранять неполным.</title><rect x="30" y="135" width="270" height="140" rx="12" fill="white" stroke="#365dad" stroke-width="2"/><text x="45" y="162" font-size="17" font-weight="600">P01 · Создание и публикация</text><text x="45" y="185" font-size="17" font-weight="600">заявки</text><text x="45" y="238" font-size="13" fill="#35465b">LOGIC_OK</text><text x="45" y="258" font-size="12" fill="#35465b">summary-P01</text></g><g id="summary-P02"><title>Назначенный перевозчик получает исходные данные; до 20 вариантов, обязательные условия и срок, явная отправка.</title><rect x="650" y="325" width="270" height="140" rx="12" fill="white" stroke="#365dad" stroke-width="2"/><text x="665" y="352" font-size="17" font-weight="600">P02 · Получение, расчёт и</text><text x="665" y="375" font-size="17" font-weight="600">отправка ставки</text><text x="665" y="428" font-size="13" fill="#35465b">LOGIC_OK</text><text x="665" y="448" font-size="12" fill="#35465b">summary-P02</text></g><g id="summary-P03"><title>Только владелец выбирает одного победителя; активная поздняя подготовка блокирует выбор; штраф не отменяется подачей.</title><rect x="30" y="515" width="270" height="140" rx="12" fill="white" stroke="#365dad" stroke-width="2"/><text x="45" y="542" font-size="17" font-weight="600">P03 · Сравнение, тендер и</text><text x="45" y="565" font-size="17" font-weight="600">один победитель</text><text x="45" y="618" font-size="13" fill="#35465b">LOGIC_OK</text><text x="45" y="638" font-size="12" fill="#35465b">summary-P03</text></g><g id="summary-P04"><title>Победитель принимает перевозку напрямую, без отдельной транспортной заявки. ВЭД получает доступ после принятия.</title><rect x="650" y="705" width="270" height="140" rx="12" fill="white" stroke="#365dad" stroke-width="2"/><text x="665" y="732" font-size="17" font-weight="600">P04 · Принятие и начало</text><text x="665" y="755" font-size="17" font-weight="600">исполнения</text><text x="665" y="808" font-size="13" fill="#35465b">LOGIC_OK</text><text x="665" y="828" font-size="12" fill="#35465b">summary-P04</text></g><g id="summary-P05"><title>Только подтверждённый остаток менее 1000 км создаёт одну проверку ВЭД до ПТО. Неизвестные километры не выдумываются. Согласованный резерв: Владелец может вручную запустить ту же проверку после документированного подтверждения невозможности расчёта, с причиной/датой/пользователем и аудитом.</title><rect x="650" y="895" width="270" height="140" rx="12" fill="white" stroke="#365dad" stroke-width="2"/><text x="665" y="922" font-size="17" font-weight="600">P05 · Трекинг, контрольные</text><text x="665" y="945" font-size="17" font-weight="600">точки и сроки</text><text x="665" y="998" font-size="13" fill="#35465b">LOGIC_IMPROVED</text><text x="665" y="1018" font-size="12" fill="#35465b">summary-P05</text></g><g id="summary-P06"><title>Одна автоматическая проверка до ПТО; общий чат Owner/Carrier/ВЭД; адресный запрос документов без шаблонных сообщений. Резервный запуск Owner при подтверждённой невозможности расчёта использует ту же задачу; проверку выполняет ВЭД.</title><rect x="960" y="1085" width="270" height="140" rx="12" fill="white" stroke="#365dad" stroke-width="2"/><text x="975" y="1112" font-size="17" font-weight="600">P06 · ВЭД: документы,</text><text x="975" y="1135" font-size="17" font-weight="600">логисты и общий чат</text><text x="975" y="1188" font-size="13" fill="#35465b">LOGIC_IMPROVED</text><text x="975" y="1208" font-size="12" fill="#35465b">summary-P06</text></g><g id="summary-P07"><title>Назначенный поставщик фиксирует фактическую готовность, комплект или объяснения отсутствия; владелец предоставляет подписанную проформу.</title><rect x="1270" y="1275" width="270" height="140" rx="12" fill="white" stroke="#365dad" stroke-width="2"/><text x="1285" y="1302" font-size="17" font-weight="600">P07 · Поставщик: готовность</text><text x="1285" y="1325" font-size="17" font-weight="600">и комплект документов</text><text x="1285" y="1378" font-size="13" fill="#35465b">LOGIC_OK</text><text x="1285" y="1398" font-size="12" fill="#35465b">summary-P07</text></g><g id="summary-P08"><title>Показывать реальные невыполненные назначения; новых процессов контента, закупок и сертификации без решения владельца не создавать.</title><rect x="1580" y="1465" width="270" height="140" rx="12" fill="white" stroke="#365dad" stroke-width="2"/><text x="1595" y="1492" font-size="17" font-weight="600">P08 · Назначенные задачи</text><text x="1595" y="1515" font-size="17" font-weight="600">остальных сотрудников</text><text x="1595" y="1568" font-size="13" fill="#35465b">LOGIC_IMPROVED</text><text x="1595" y="1588" font-size="12" fill="#35465b">summary-P08</text></g><g id="summary-P09"><title>Закрывает только уполномоченный сотрудник после обязательных событий и задач; контейнер либо явное разрешённое решение без него.</title><rect x="30" y="1655" width="270" height="140" rx="12" fill="white" stroke="#365dad" stroke-width="2"/><text x="45" y="1682" font-size="17" font-weight="600">P09 · Завершение перевозки</text><text x="45" y="1758" font-size="13" fill="#35465b">LOGIC_IMPROVED</text><text x="45" y="1778" font-size="12" fill="#35465b">summary-P09</text></g><g id="summary-P10"><title>За отсутствие ответа — однократный штраф; своевременный отказ не штрафуется; поздняя подача не возвращает штраф.</title><rect x="340" y="1845" width="270" height="140" rx="12" fill="white" stroke="#07806d" stroke-width="2"/><text x="355" y="1872" font-size="17" font-weight="600">P10 · Service Level, сроки и</text><text x="355" y="1895" font-size="17" font-weight="600">допуск</text><text x="355" y="1948" font-size="13" fill="#35465b">LOGIC_OK</text><text x="355" y="1968" font-size="12" fill="#35465b">summary-P10</text></g></g></svg>
